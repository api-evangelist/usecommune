    post:
      operationId: createArticleImage
      summary: Store an image for an article
      description: "Stores an image for this article and answers with the URL it is served\nat, so whatever\
        \ writes the article never needs somewhere of its own\nto host one. Needs `content: write`.\n\n\
        Two ways in, chosen by the body:\n\n- **`source_url`**: Commune downloads the image and stores\
        \ a copy. For\n  an image you hold as a link, including a generated one on a link\n  that will\
        \ expire. It has to be a public http or https URL on the\n  standard port; private and local network\
        \ addresses are refused,\n  redirects included.\n- **`content_type`**: Commune answers with a\
        \ one-time `upload` URL and\n  the image's final `url`. `PUT` the file's bytes to `upload.url`\
        \ with\n  the `upload.headers`, before `upload.expires_at`. The bytes go\n  straight to storage,\
        \ so a file on disk never has to pass through a\n  model or through this API. Until the upload\
        \ is made, `url` answers\n  `404`.\n\nEither way the image is a JPEG, PNG, WebP or GIF of at most\
        \ 10MB, and\nthe article itself is not changed: put the `url` in the body's\nMarkdown (`![alt](url)`)\
        \ or in `image_url` with Update an article\n(`PATCH /articles/{article}`).\n"
