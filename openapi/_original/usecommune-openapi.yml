# x-archived-from: usecommune-openapi.yml
# x-archived-on: 2026-10-07
openapi: 3.1.0
info:
  title: Commune API
  version: '2026-08-26'
  summary: Newsletters, articles, threads and the people around them.
  description: "The Commune API exposes a Commune community: newsletters, the articles they\npublish,\
    \ the chat threads those articles start, and the people who write\nand read them.\n\nMost of it is\
    \ reading. A small set of operations changes something, and\nthose behave differently in three ways\
    \ described under Writes below.\n\n## Fetching this document\n\nThis contract is served by the API\
    \ itself, in two syntaxes carrying the same\ncontent: `https://api.usecommune.com/openapi.yaml` and\n\
    `https://api.usecommune.com/openapi.json`. Generate a client from whichever\nyour toolchain prefers.\n\
    \n`?version=` selects a contract version, the same way the `Commune-Version`\nheader does for a request,\
    \ and answers `404` for a version that was never\nreleased. `?profile=docs` returns the variant the\
    \ published reference is\nrendered from; it differs only in presentation metadata, so the operations,\n\
    webhooks and schemas are identical either way.\n\n## Versioning\n\nThe base URL carries no version\
    \ segment. A request selects a contract\nversion with the `Commune-Version` header, whose value is\
    \ the release date\nof the contract (for example `2026-08-26`). Omitting the header pins the\nrequest\
    \ to the version that was current when the API key was issued.\n\nEvery response echoes the version\
    \ it resolved to in a `Commune-Version`\nresponse header, on success and on failure alike. A client\
    \ that never sets\nthe header can read which contract it has been getting, and compare it\nagainst\
    \ `version` in `GET /status` to find out whether a newer one is\navailable to move to.\n\nEvery response\
    \ also carries a `Commune-Request-Id`, which is the value that\nappears as `request_id` in an error\
    \ body. Quote it in support requests.\n\n## Authentication\n\nEvery request is authenticated with\
    \ a credential sent as a bearer token.\nThere are two ways to obtain one and one permission model\
    \ behind both. **An\nAPI key** is minted by a creator in Commune's settings. **An OAuth access\ntoken**\
    \ is issued when a person completes the authorization code flow and\nclicks allow; the walkthrough\
    \ is at\n[usecommune.dev/use-cases/build-an-integration](https://usecommune.dev/use-cases/build-an-integration).\n\
    \nA credential is granted one or more of the newsletters its holder can act\non. On each of those\
    \ it carries six independent permissions, one per family,\neach `none`, `read` or `write`:\n\n| Family\
    \ | Covers |\n| --- | --- |\n| `content` | articles, the passages readers marked in them, threads,\
    \ messages |\n| `audience` | subscribers, segments, the community roster |\n| `sending` | sending\
    \ an article, senders, delivery attempts |\n| `insights` | engagement events and the metrics over\
    \ them |\n| `settings` | the newsletter's configuration, its website domains, its team, its credentials\
    \ |\n| `webhooks` | event destinations and the portal that edits them |\n\nEach operation names the\
    \ family and the level it needs, as an OAuth scope\nsuch as `content:read`. `write` implies `read`\
    \ **within its own family and\nnowhere else**: there is no hierarchy across families, so a credential\
    \ that\nmay send your articles has no claim at all on your subscribers. An operation\na credential\
    \ does not hold the family for answers `403` naming what it\nneeded and what the credential holds\
    \ on that newsletter.\n\nPermissions are granted per newsletter, so the same credential can hold\n\
    `content: read` on one and `audience: write` on another. They are also\n**bounded by their holder**:\
    \ what a credential can do is what it was granted\nintersected with what the person it belongs to\
    \ can do on that newsletter at\nthe moment of the request. Remove them from the team and the credential\n\
    reaches nothing there on its very next call; demote them from admin to\neditor and it loses `settings:\
    \ write`. There is nothing to revoke and no\ndelay.\n\n**Unpublished rows follow one extra rule.**\
    \ A draft, an article whose send\ntime has not arrived, and a thread addressed to a segment are not\
    \ secret,\nthey are unpublished, and the credentials that may see them are the ones\nthat may change\
    \ the newsletter: those holding `write` in **any** family on\nit. A credential holding only `read`\
    \ permissions sees the newsletter as it\nhas been published, and this document says so on each operation\
    \ where it\nmakes a difference.\n\nA credential can also carry `account: read`, which reads the account\
    \ it\nbelongs to: the profile behind it, and the teams, lists, saved articles and\nliked articles\
    \ that belong to the person rather than to a newsletter. It is\na **separate axis**, not a seventh\
    \ family. No newsletter grant implies it\nand it implies no newsletter grant, so a credential that\
    \ reads a\nnewsletter's subscribers still cannot read its owner's own reading list. It\nis granted\
    \ on the credential itself, so either kind can carry it, and one\nissued without it answers `403`\
    \ at an operation that needs it however many\nnewsletters it reaches.\n\nAn OAuth authorization that\
    \ asks only for `account:read` is granted no\nnewsletter, so it answers `403` at every operation that\
    \ addresses one.\n\n## Rate limits\n\nEvery request is counted against the credential that made it,\
    \ never against\nan address. Three budgets apply:\n\n* `general` counts every request.\n* `audience`,\
    \ which is tighter, counts only the operations that return\n  subscriber or recipient email addresses.\n\
    * `write`, equally tight, counts only the operations that change something.\n\nAn operation covered\
    \ by one of the narrow budgets is charged to it and to\n`general`, and has to pass both.\n\nFrom the\
    \ moment a credential resolves, every response carries\n`RateLimit-Limit`, `RateLimit-Remaining` and\
    \ `RateLimit-Reset` for whichever\nbudget is closest to exhaustion, and `RateLimit-Policy` listing\
    \ every budget\nthat applied. `RateLimit-Reset` is in seconds from now. A `429` additionally\ncarries\
    \ `Retry-After`, and its `message` names the budget that refused:\nbeing refused by the `audience`\
    \ budget still leaves the rest of the API\ncallable.\n\n`GET /rate-limit` reports every budget at\
    \ once, which is what to read rather\nthan inferring the whole picture from the one budget the headers\
    \ describe.\n\n## Writes\n\nAn operation that changes something is a `POST`, a `PATCH` or a `DELETE`,\n\
    needs `write` in its own family, and differs from a read in three ways.\n\n**It requires an `Idempotency-Key`\
    \ request header.** Choose one value per\nchange you intend to make, and send that same value again\
    \ if you have to\nretry. Commune records the answer your first attempt produced and replays\nit rather\
    \ than making the change a second time; a replayed response carries\n`Idempotent-Replay: true` and\
    \ is otherwise identical to the original. A key\nis remembered for 24 hours, per credential.\n\nReusing\
    \ a key for a different request answers `409` rather than replaying\nthe wrong answer. Two requests\
    \ count as the same request when the operation,\nthe path, the query string, the body and the contract\
    \ version all match.\n\n**It is counted against the `write` rate limit budget.** See Rate limits\n\
    above.\n\n**It publishes an event**, carrying your credential in the envelope's\n`actor` and your\
    \ `Idempotency-Key` in `idempotency_key`. That lets a\nconsumer tell a change your integration made\
    \ from one a creator made in\nCommune, and collapse the events one retried write produced. If the\
    \ same\nintegration also consumes events, the event your write publishes is\ndelivered back to you:\
    \ skip the ones whose `idempotency_key` you issued, or\nyour integration will answer itself. See Webhooks.\n\
    \n## Pagination\n\nCollections are cursor paginated. A response carries `data` plus a\n`pagination`\
    \ object holding an opaque `next_cursor`. Pass it back as\n`?cursor=` to fetch the following page.\
    \ There is no offset, limit-offset or\npage number, and a cursor is not a durable identifier.\n\n\
    ## Identifiers\n\nResources that have a page in Commune carry both a UUID `id` and a short,\nURL friendly\
    \ `short_id`. Either value is accepted wherever a path parameter\nnames that resource.\n"
  contact:
    name: Commune
    url: https://usecommune.com
    email: support@usecommune.com
servers:
- url: https://api.usecommune.com
  description: 'Production. There is no separate sandbox host.

    '
tags:
- name: Newsletters
  description: 'A newsletter is the top level object in Commune. It owns its articles, its

    chat, its subscribers and its team. Everything else in this API hangs

    off one.

    '
- name: Team
  description: 'Who may act on behalf of a newsletter: its owner, plus the members the

    owner added as admins, editors or guests.


    Both sides of that edge are here. A newsletter''s roster answers "who is on

    this team" and needs `settings`. `GET /memberships` answers "which teams

    is this account on", which is the same membership read from the person

    rather than from the newsletter, and needs `account: read` instead:

    the set of teams somebody is on is a fact about them.

    '
- name: Users
  description: 'A person with a Commune account: the readers who join a community and the

    writers who are credited on an article. Looked up by identifier or by

    username, and only ever as a public profile: never an email address.


    The one account read from the inside is the credential''s own. `GET /me`

    is the same person as the profile above plus the address and verification

    state that one withholds, and it sits here rather than under a heading of

    its own because it is the private view of exactly what this tag already

    documents. It needs no permission at all.

    '
- name: Search
  description: 'One query across newsletters, articles, people and chat. Where a reader

    starts who does not yet have an identifier for any of them.

    '
- name: Articles
  description: 'An article is one thing a newsletter published: written in Commune and

    sent, or imported from the newsletter''s provider. Two rules

    gate every article read and are described on each operation. First, an

    article stamped with an audience is visible only to the newsletter''s team

    and to subscribers holding one of its tags. Second, an article dated in

    the future is invisible until that moment passes.


    An article written in Commune can be created and edited here, its body sent

    and returned as Markdown, and moved through its life: sent to a test

    address, queued for a time, taken back off the schedule, sent to the list,

    and re-attempted for the recipients a dispatch could not reach. An

    imported article is read only.


    What one reader did with an article is here too, from their side of it.

    `GET /saved-articles` and `GET /liked-articles` are the articles an account

    put aside and the articles it liked, across every newsletter it reads, and

    they need `account: read` rather than `content`. Both obey the two rules

    above, applied against the person rather than against a newsletter, so an

    article they may no longer read leaves the page on its own.

    '
- name: Highlights
  description: 'A highlight is a passage of an article a reader marked. It anchors a

    comment to the exact sentence that prompted it.

    '
- name: Threads
  description: 'A thread is a conversation inside a newsletter''s community. Commune has no

    separate posts or comments stack: a creator''s broadcast, a reader''s

    question and the discussion under an article are all threads in the same

    newsletter scoped chat.

    '
- name: Messages
  description: 'A message is a reply inside a thread, up to two levels deep. Reactions

    hang off a message.

    '
- name: Subscribers
  description: 'Who receives a newsletter. Needs `audience`, and never a public

    surface: a newsletter''s list belongs to its creator.


    `GET /subscriptions` is that edge read from the other end, the lists one

    account is on rather than the people on one list, and it needs

    `account: read` instead. It carries none of what a newsletter''s own record

    of a subscriber carries: no address, no lifecycle status, none of the tags

    the newsletter applied and nothing about how they were acquired.

    '
- name: Subscriber tags
  description: 'A tag segments a newsletter''s audience. Sending an article to a tag stamps

    that article with an audience, which is what makes it invisible to everyone

    outside it. Named for the subscribers it is applied to, because a tag

    called `Tags` inside a document made of tags says nothing.


    Applying and removing a tag are writes, and they are grants and

    revocations of access to whatever articles that segment was addressed to,

    not only labels. Creating, renaming and retiring a tag are not operations

    here yet.

    '
- name: Engagement
  description: 'What Commune knows about one subscriber that a newsletter''s email provider

    cannot answer: engagement scored across the inbox and the community

    together, and the raw event stream those scores are summed from. Row

    shaped and high cardinality, which is what a CRM or a re-engagement

    automation reads. Needs `insights`, and part of the one read surface Commune

    may put behind a plan.

    '
- name: Metrics
  description: 'The rolled up numbers for a newsletter and for one article: headline stats

    for a period, acquisition attribution, bucketed series for charting, and

    one article''s email performance beside its community response. What a

    dashboard reads, where Engagement is what an automation reads. Creator

    scope, and part of the one read surface Commune may put behind a plan.

    '
- name: Sends
  description: 'A send is one dispatch of one article to a newsletter''s list: when it

    started, when it finished, and the three numbers it finished on. Not to

    be confused with Senders, one heading below: a sender is the address an

    article goes out from and is configuration, a send is something that

    happened.


    Starting one is an operation under Articles, because it is a moment in an

    article''s life. Reading what became of it is here, because a run is its own

    object with its own identifier and one article can have more than one.


    The same run is announced as a `send.completed` event, carrying the same

    three numbers under the same names, and these operations are how a

    consumer reads them back afterwards from the identifier that event

    carried. Needs `sending`.

    '
- name: Senders
  description: 'The addresses a newsletter sends from, and the state of the DNS that has

    to be in place for them to work. The sending half of the pair; Website

    domains is the other. Needs `sending`.

    '
- name: Website domains
  description: 'A creator''s own domain pointed at their Commune site, so their community

    lives at their address rather than at ours. The same prove you own this

    hostname flow as Senders, pointed at the site rather than at the mail.

    Needs `settings`: a website domain is how the newsletter is configured,

    not how it sends.

    '
- name: Platform
  description: 'The API''s own machinery rather than any newsletter''s data: the readiness

    probe, what a credential has left of its rate limit budgets, what its

    newsletter''s plan allows, and the newsletter''s API keys. A key can be

    listed and revoked here but never created, so a stolen credential cannot

    mint itself a replacement.

    '
- name: Event delivery
  description: 'Where a newsletter''s events go, and how a creator changes it. Commune

    hands every event it publishes to a delivery service that owns fan out,

    retries, signing and the delivery log, and a destination is one place that

    service sends them: an HTTPS endpoint, or a queue, stream or object store

    for a consumer that would rather not run a web server.


    Reading the list is an operation here, and so is reading the delivery

    attempt log: what was handed to which destination, what came back, and

    asking for one to be handed over again.


    Changing the destinations themselves is not. `portal-session` mints a link

    into the delivery service''s own portal, where a creator adds an endpoint,

    disables one and rotates a signing secret. Asking for an attempt to be

    replayed is the one write here, and is the same action as the portal''s

    retry button.


    Needs `webhooks` throughout, since a destination is a private endpoint of

    the creator''s, the list of them says which systems a newsletter is wired

    into, and the attempt log says what those systems were told and when.

    '
- name: Webhooks
  description: 'The events Commune pushes to a consumer, rather than the resources a

    consumer pulls. Commune publishes state changes on 23 topics, each

    delivered as one HTTPS POST to an endpoint the consumer registered.


    Every message shares one envelope, so a consumer can route on `type` and

    dedupe on `id` without knowing anything about the specific event, and the

    same values arrive as `Commune-Event-Type` and `Commune-Event-Id` headers

    so both can be read before the body is parsed.


    Delivery is at least once and unordered. A non-2xx response or a timeout

    is retried with backoff, so a consumer has to treat `id` as the dedupe key

    and tolerate replays. `occurred_at` is the ordering field, not arrival

    time.


    Two envelope fields say where a change came from rather than what

    changed. `actor` names the credential when the change was made through

    this API''s write operations, and `idempotency_key` carries the key that

    write was made under. Both are `null` for a change made anywhere else,

    which is most of them.


    **If your consumer writes, read `idempotency_key` before you act.** A

    write through this API publishes an event, and that event is delivered to

    every endpoint registered for the newsletter, including yours. A consumer

    that reacts to events by writing therefore receives the echo of its own

    write, cannot tell it from a change somebody else made, and writes again.


    You already hold what breaks the loop: you generated the key you sent on

    the write, so keep it and skip any event whose `idempotency_key` is one of

    yours. `actor` is not the field for this. It names Commune''s own id for

    your credential, and no operation here tells you what that id is.


    Registering an endpoint happens in the delivery portal, which

    `POST /newsletters/{newsletter}/portal-session` mints a link into. The

    endpoints already registered are readable at

    `GET /newsletters/{newsletter}/destinations`.


    What happened to a particular message is readable.

    `GET /newsletters/{newsletter}/delivery-attempts` lists every handover

    Commune made, filterable by the `event_id` a consumer reads off its own

    `Commune-Event-Id` header, so "did that event reach me" is answerable from

    both sides of the same identifier.

    '
security:
- apiKey: []
x-deferred:
- resource: user_newsletters
  scope: partner
  reason: The newsletters a person owns or is on the team of. Public one profile at a time, but served
    in bulk it maps the network. A Partner API candidate.
- resource: user_subscriptions
  scope: partner
  reason: The newsletters a person subscribes to. The reader side of the same network graph, so it waits
    for a Partner API with it.
- resource: user_activity
  scope: public
  reason: The threads, highlights and articles sub resources of a public profile. Each filters a collection
    that has its own operation.
- resource: user_settings
  scope: reader
  reason: Theme, contrast and the rest of a person's account preferences. Personal, and of no use to an
    integration.
- resource: notification_preferences
  scope: reader
  reason: Personal account settings.
- resource: push_subscriptions
  scope: reader
  reason: Per device push endpoints. Credential shaped, and personal.
- resource: newsletter_settings
  scope: creator
  reason: Chat permissions, physical address and editor defaults. Split from the core object so the public
    schema stays frozen, and deferred with the write surface it exists to serve.
- resource: invitations
  scope: creator
  reason: Carries invitee email addresses and single use tokens, and is write shaped. This version of
    the API is reads only.
- resource: esp_connections
  scope: creator
  reason: Holds provider OAuth tokens and API keys. The connection becomes readable without them; the
    credentials never do.
- resource: esp_imports
  scope: creator
  reason: Import and migration runs are long running writes against an outside provider. This version
    of the API is reads only.
- resource: esp_share_audiences
  scope: creator
  reason: The provider side allow list that decides what Commune ingests. Import configuration, not a
    resource an integration reads.
- resource: rss_authors
  scope: creator
  reason: The feed author to team member mapping. Import configuration, wired to one provider path.
- resource: newsletter_exports
  scope: never
  reason: An admin only operation, not part of the creator catalog.
- resource: article_drafts
  scope: creator
  reason: Commune's editor stores its own document format, and pinning it in a public contract would stop
    the editor evolving.
- resource: article_preview
  scope: creator
  reason: Renders an article to final email HTML. Worth exposing, and it would pin the merge tag engine
    and the block system while both are still moving.
- resource: article_compliance
  scope: creator
  reason: The pre send gate as a readable resource, answering "would this send?" without sending. Its
    blocker vocabulary is still growing, and freezing it now would freeze the gate; the send and schedule
    operations report the same refusals when they refuse.
- resource: article_move
  scope: creator
  reason: Moving a draft from one newsletter to another. A credential reads one newsletter, so both ends
    of the move cannot be named by one of them.
- resource: article_thread
  scope: public
  reason: An article's discussion, reachable as a sub resource. It is a thread and has an operation already;
    a second path to it is navigation.
- resource: article_comments
  scope: public
  reason: Dead table. An article's discussion is its chat thread, so the count is on `article.stats.comments`
    and the comments themselves are that thread's messages.
- resource: article_saved_event
  scope: creator
  reason: 'A topic for an article being saved or unsaved. Built alongside `article.liked` and `article.read`
    and then withdrawn before it shipped, on the ground that it is not the same kind of change they are.


    Those two ride a disclosure that already exists. A credential holding `insights: read` reads `GET
    /newsletters/{newsletter}/events` today, which names which subscriber viewed or liked which article,
    so a topic carrying the same facts tells a creator nothing they could not already fetch. A save has
    no counterpart anywhere: no entry in `EngagementEventType`, no tally on `Article.stats`, nothing in
    the product that shows a creator who saved what, and a row only its owner can read. The topic would
    therefore have been the first thing ever to tell a creator anything about saves, and the thing it
    told them would be who.


    That is a decision about what readers are told is private, not a gap in the catalog, and it is deferred
    until that decision is made rather than shipped as a side effect of building its two neighbours. `article_saves`
    itself is untouched: `GET /saved-articles` still returns a person their own list.'
- resource: article_shared_event
  scope: creator
  reason: 'A topic for an article being shared. Refused rather than queued, because Commune does not observe
    a share and cannot: the product hands the reader to the operating system''s own share sheet, which
    reports nothing back, so the only shares that could ever be counted are the ones that begin with a
    button inside Commune, and even those end somewhere Commune cannot see.


    Read `share` in `EngagementEventType` as the record of an earlier attempt rather than as a signal
    that exists. The value is declared, the insight scores weight it, and the collection at `GET /newsletters/{newsletter}/events`
    will return one if it ever finds one. None of that makes a share observable, and a `share` row is
    not something any newsletter has.


    Publishing a topic for it would put a channel in this catalog that can never carry a message, which
    is worse than an absence: an absence is visible, and a silent channel reads as a quiet week.'
- resource: article_read_state
  scope: reader
  reason: 'Per reader read and unread state, as a resource a client reads back and writes. Written on
    every read in the product, so exposing it invites the polling loop `article_views` is deferred for,
    on the same hot path. The `article.read` topic is not this resource arriving early: it is pushed rather
    than polled, which is the whole of what the objection was about, it reports one crossing per reader
    per article rather than a state a client can re-read, and it cannot be written.'
- resource: article_views
  scope: creator
  reason: 'A write on every read in the product. Exposing it as a readable counter invites polling loops
    against a hot path. Still deferred after `article.read` landed, and not made redundant by it: that
    topic deliberately reports neither anonymous reads nor repeat visits, so it is not the counter and
    a consumer cannot build the counter out of it.'
- resource: thread_demotion
  scope: creator
  reason: Taking a thread back off the global feed. Promoting one is an operation; the reverse has no
    topic and no considered answer to what a consumer already told about it should do.
- resource: article_schedule_cancelled_event
  scope: creator
  reason: A topic for a cancelled schedule. Cancelling is an operation; the event is not, for the reason
    directly above, and the article's own status is the authority until there is an answer.
- resource: thread_read_state
  scope: reader
  reason: Per user last read timestamps and mutes. A user token could hold it; a row names a thread, and
    handing one back would let an app walk into a private thread whose other participants consented to
    nothing.
- resource: thread_participants
  scope: public
  reason: Who spoke in a thread. Derivable from the thread's messages, which have an operation of their
    own.
- resource: moderation
  scope: creator
  reason: No moderation queue exists yet. An auditable log is worth having before write access rather
    than after it.
- resource: posts
  scope: public
  reason: Retired. Posts were folded into newsletter scoped chat threads, so the resource is `threads`,
    and modelling `posts` would put a dead stack into a contract with outside consumers.
- resource: post_replies
  scope: public
  reason: Retired with posts. A reply is a `message` in a thread.
- resource: reposts
  scope: public
  reason: 'Retired with posts, and never wired up: the internal surface returns a hardcoded zero.'
- resource: community_member
  scope: public
  reason: One person's place in a community, addressable on its own. The person has an operation and the
    place carries nothing but a date, so a second path to it is navigation rather than a resource.
- resource: suppressions
  scope: creator
  reason: Bounces, complaints and unsubscribes as one list. The data is spread across two tables and there
    is no single surface to freeze yet.
- resource: audience_count
  scope: creator
  reason: Commune's subscriber records are a partial cache of an outside provider's list, so any total
    derived from them would misstate the audience. Ask the provider.
- resource: article_deliveries
  scope: creator
  reason: Per recipient send results, including bounces. Deferred until the send pipeline's own shape
    is stable enough to freeze.
- resource: article_send_stats
  scope: creator
  reason: Opens and clicks come from the sending provider on the provider's schedule, so a number read
    here would be stale in a way the contract could not describe.
- resource: send_links
  scope: creator
  reason: Click breakdown per destination URL. Clicks are recorded as events and never aggregated by destination,
    so the rollup does not exist.
- resource: deliverability
  scope: creator
  reason: Rolling bounce and complaint health against thresholds. Derivable, and nothing computes it today.
- resource: delivery_retries
  scope: never
  reason: Re-sending a send's failed recipients. Commune retries transient failures itself; what still
    fails is followed up by its team, because some of it may already have been delivered.
- resource: network_metrics
  scope: never
  reason: Internal analytics, computed on a cron for Commune's own use.
- resource: feed
  scope: public
  reason: Public threads, articles and highlights unioned into one stream. A discriminated union whose
    member shapes and ranking are still moving.
- resource: newsletter_feed
  scope: public
  reason: The same union scoped to one newsletter. Deferred with `feed`.
- resource: discover
  scope: public
  reason: An editorial surface whose ranking is still being tuned. Freezing its shape now would freeze
    an experiment.
- resource: notifications
  scope: reader
  reason: A person's notification inbox. A user token is the right credential for it; every item points
    at a thread, message or article somewhere, and serving those references needs the subject registry
    to answer what an app may follow them to.
- resource: notification_stream
  scope: reader
  reason: The server sent events channel behind a person's notification inbox. Deferred with `notifications`
    above, and additionally because a stream is not a Path Item. It was described in a separate AsyncAPI
    document for a while, on the grounds that a stream is not a Path Item, but it was never built and
    that document was the only thing that document held which this one could not express. Both are gone.
    A stream that is worth publishing to API keys brings the second document back with it.
- resource: reader_digest
  scope: reader
  reason: The weekly roundup as data rather than as an email. Personal.
- resource: creator_digest
  scope: creator
  reason: The creator side weekly. Every number in it is readable from the Metrics operations, so it is
    a rendering rather than a resource.
- resource: billing
  scope: creator
  reason: Plan, usage and payment method. A money surface deserves its own contract and its own review,
    not a corner of the read catalog.
- resource: media
  scope: reader
  reason: Upload only, and this version of the API is reads only.
- resource: render_email
  scope: creator
  reason: 'Renders arbitrary editor JSON to email safe HTML. Same reason as `article_preview`: it would
    pin the block system in a public contract.'
- resource: oembed
  scope: public
  reason: oEmbed for articles, threads and highlights. A separately published spec with its own discovery
    rules, not a resource in this one.
- resource: api_key_mint
  scope: never
  reason: 'Minting a credential, which is refused rather than queued. A key that can mint keys outlives
    its own revocation: an intruder makes a second one, the creator revokes the first, and nothing they
    did stopped anything. A key is minted by a signed in person in Commune''s settings, where the secret
    is shown once. Listing and revoking keys are operations above.'
- resource: oauth
  scope: public
  reason: 'The authorize and token endpoints a third party app uses. Built, and on the authorization server
    rather than here: they live in the Commune app, because issuing a credential means showing a signed-in
    person a screen and this service has no sessions. `GET /.well-known/oauth-protected-resource` is how
    a client finds them, and the flow is walked through in full at `usecommune.dev/use-cases/build-an-integration`.
    Not to be confused with `oauth_protected_resource` below: that one is this service saying where tokens
    for *it* come from.'
- resource: oauth_protected_resource
  scope: public
  reason: '`GET /.well-known/oauth-protected-resource`, the RFC 9728 metadata document a client fetches
    after a `401` to find the authorization server. It is not a Commune resource and it is not versioned
    by `Commune-Version`: its shape is fixed by the RFC, it is the same bytes for every caller, and it
    is unauthenticated because discovery is what a caller does when it has no usable credential. The authorization
    server it names is not this API; it is the Commune app itself, where the creator''s session and the
    consent screen already are.'
- resource: spec_documents
  scope: public
  reason: This document, served as JSON and as YAML, each with `?version=`, `?profile=` and `?lang=`.
    Describing itself inside itself is circular.
- resource: mcp_server
  scope: creator
  reason: '`POST /mcp`, the Model Context Protocol endpoint. It is a JSON-RPC envelope over the operations
    declared above rather than a resource of its own: one tool is one Arazzo workflow, and every step
    of every workflow is one of these operations, dispatched through the same gateway with the caller''s
    own key. Declaring the envelope here would publish a second, untyped way to call operations that are
    already typed, and OpenAPI cannot describe what a `tools/call` body may contain without restating
    all twenty argument schemas the manifest already carries.'
- resource: webhooks
  scope: never
  reason: 'Inbound endpoints for outside services, authenticated by signature rather than by key. The
    outbound direction is not this resource: the events a consumer receives are the generated `webhooks`
    block.'
- resource: cron
  scope: never
  reason: Internal scheduled jobs, guarded by a shared secret.
- resource: admin
  scope: never
  reason: Commune staff surface. Never public.
paths:
  /status:
    get:
      operationId: getStatus
      summary: Service status
      description: 'Whether the API is serving, what it depends on to serve, and which

        contract version it is currently on. Reaching it at all proves the

        process is up and routing; `status` and `dependencies` say whether it is

        up in a useful sense.


        Every check is shallow. It proves that a dependency answers, not that it

        answers correctly, so read a `down` as a reason to stop retrying and

        never an `up` as a guarantee that a write elsewhere will land.


        The answer is coarse: capability names and states, no vendor and no

        free text, and no distinction between a dependency that failed its probe

        and one Commune cannot reach at all.


        **The one operation that takes no credential**, and the one that ignores

        `Commune-Version`. With no key to count against, the per-key budgets do

        not apply and no `RateLimit-*` headers are returned. Whatever sits in

        front of this service can still refuse a request, which is why `429`

        stays declared.

        '
      tags:
      - Platform
      security: []
      responses:
        '200':
          description: 'The service is serving traffic. Read `status` before trusting it to

            serve every operation: a `200` here reports a degradation rather

            than hiding it.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceStatus'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /rate-limit:
    parameters:
    - $ref: '#/components/parameters/CommuneVersion'
    get:
      operationId: getRateLimit
      summary: Retrieve the calling credential's rate limit state
      description: 'What this credential has left, on every budget that applies to it,

        measured after this request has been counted.


        Three budgets exist. `general` counts every request. `audience` counts

        only the operations that return subscriber or recipient email addresses.

        `write` counts only the operations that change something. The two narrow

        budgets are smaller than `general`, and the operations they cover are

        charged to both and have to pass both, so a credential that has

        exhausted one of them can still call everything else.


        Read this rather than inferring the whole picture from the `RateLimit-*`

        headers, which describe one budget at a time.


        This operation is itself counted against the `general` budget.

        '
      tags:
      - Platform
      security:
      - apiKey: []
      - oauth2: []
      responses:
        '200':
          description: 'The current window, limit and remaining for this credential.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimit'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /newsletters:
    parameters:
    - $ref: '#/components/parameters/CommuneVersion'
    get:
      operationId: listNewsletters
      summary: List newsletters
      description: 'The newsletters your credential reaches.


        This is the operation to call first. A credential is granted a list of

        newsletters, and everything else in this API is addressed by an

        identifier from that list: this is where those identifiers come from,

        and it is what an integration calls when it holds a credential and does

        not yet know which newsletters it is for.


        Most credentials reach exactly one, and this answers one item for them.

        A credential granted several answers several. A credential whose owner

        has lost their standing on a newsletter stops reaching it, and this

        answers one item fewer, or an empty page rather than an error.


        It is not a directory of Commune. There is no way to see a newsletter

        you were not granted, here or anywhere else in this API, and a filter

        below narrows this list rather than searching outside it.


        Ordered newest first, and paged like every other collection.

        '
      tags:
      - Newsletters
      security:
      - apiKey: []
      - oauth2: []
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Expand'
      - $ref: '#/components/parameters/Fields'
      - name: esp
        in: query
        required: false
        description: 'Return only newsletters published through this provider. Repeat the

          parameter to accept several.

          '
        schema:
          $ref: '#/components/schemas/Esp'
      - name: handle
        in: query
        required: false
        description: 'Return only the newsletter with this handle, **among the ones your

          credential reaches**. Zero or one item.


          A handle is unique across Commune, but this is a filter and not a

          lookup: a handle your credential was not granted answers an empty

          page, exactly as it would if no such newsletter existed.


          `GET /newsletters/{newsletter}` also accepts a handle and answers

          `404` rather than an empty page, which is what you want when you are

          after a single object.

          '
        schema:
          type: string
          maxLength: 200
      responses:
        '200':
          description: A page of newsletters.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ListEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      description: 'The newsletters this credential reaches, and nothing

                        else. Usually one entry, because a credential is

                        usually granted one newsletter; several when it was

                        granted several; none when its owner''s standing on

                        every one of them has gone. The length of this page is

                        never a count of anything on Commune.

                        '
                      items:
                        $ref: '#/components/schemas/Newsletter'
              examples:
                theKeysNewsletter:
                  summary: A credential granted one newsletter, reading which one.
                  value:
                    object: list
                    data:
                    - object: newsletter
                      id: 7d3f1c02-58a1-4a4e-9a0b-2f6d1c9e4411
                      handle: example-letter
                      name: The Example Letter
                      description: A weekly letter about how newsletters and communities fit together.
                      esp: commune
                      image_url: https://cdn.example.com/newsletters/example-letter/avatar.png
                      website_url: https://example.com
                      social_links:
                        twitter: https://x.com/exampleletter
                        bluesky: https://bsky.app/profile/exampleletter.bsky.social
                      language: en
                      chat_create_permission: subscribers
                      allow_non_subscriber_chat: false
                      owner:
                        object: user
                        id: usr_2Nf8Kq1pWc
                      featured_article:
                        object: article
                        id: 4c9e2f81-0b7a-4d13-8e55-1a2b3c4d5e6f
                      created_at: '2025-03-04T10:00:00Z'
                      updated_at: '2026-08-26T09:32:11Z'
                    pagination:
                      has_more: false
                      next_cursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
