    get:
      operationId: listSavedArticles
      summary: List the articles this account saved
      description: 'This account''s reading list: the articles this person put aside to come

        back to, most recently saved first. It is private to them, and no

        operation in this API reads somebody else''s.


        A save is never reported to the newsletter that published the article.

        Reads and likes are, as engagement records and as the `article.read` and

        `article.liked` topics; a save has no topic, no tally on

        `Article.stats`, and no engagement event type.


        **Needs `account: read`**, which either an API key or an OAuth token can

        carry.


        The two rules that gate every article this API serves gate this page

        too, applied against the person rather than against a newsletter. An

        article dated in the future is not returned until that moment passes. An

        article stamped with an audience is returned only while this person is

        entitled to it: the newsletter''s owner, one of its admins or editors, or

        a subscriber holding one of the article''s tags. Leave the segment an

        article was addressed to and it leaves this page.


        So a page can be shorter than the number of saves the person made, and

        an entry can disappear without the person having removed it. Neither is

        an error and nothing in the response marks it.


        `article` is a reference, and `?expand=article` replaces it with an

        `ArticleSummary`: title, preview line, cover and publication date,

        without the body.


        **Expanding cannot widen the page.** The two rules above are applied

        again when the article is resolved, so an entry the person may no longer

        read, or one whose article has been deleted, keeps its bare reference.

        Treat a reference that stayed a reference as "no detail available",

        never as an error.


        `GET /liked-articles` is the same page for likes and follows every rule

        above.

        '
      tags:
      - Articles
      security:
      - apiKey: []
      - oauth2:
        - account:read
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Expand'
      - $ref: '#/components/parameters/Fields'
