  /newsletters/{newsletter}/delivery-attempts:
    parameters:
    - $ref: '#/components/parameters/CommuneVersion'
    - $ref: '#/components/parameters/NewsletterPath'
    get:
      operationId: listNewsletterDeliveryAttempts
      summary: List what was delivered where, and how it went
      description: 'Every time Commune handed one of this newsletter''s events to one of its

        destinations, newest first: which event, which destination, what came

        back, and whether it was a first try or a retry. Needs `sending: read`.


        This is the answer to "my endpoint never received that event". Each row

        names an `event_id`, which is the same string the consumer sees in the

        `Commune-Event-Id` header and in the envelope''s `id`, so a line in your

        own logs and a row here can be matched up. `?event_id=` goes the other

        way: give it an id and get every attempt at delivering that one event.


        An event is delivered once per destination, so one event with three

        destinations produces at least three rows here. `?destination_id=`

        narrows to one of them, and `?status=failed` is the usual first read.


        **A retry is a new row, not an edit.** `attempt` is 1 on the first try

        and one higher on each retry, and the delivery service retries a failed

        delivery on its own with backoff, so a row with `status: failed` is not

        yet a lost event. `manual` says whether somebody asked for the attempt

        rather than it being automatic.


        Attempts are recorded shortly after delivery rather than instantly, so

        an attempt made a moment ago may not be on this page yet. Read again

        rather than concluding nothing was tried. The log is a recent record

        rather than an archive, so keep anything you need to hold on to.


        Two things are never returned: whatever a destination authenticates

        with, and the response body your endpoint answered with, since a

        refusing endpoint routinely echoes the request back inside it, headers

        included. `response_status` stands in for the body, and the delivery

        portal has the rest.

        '
      tags:
      - Event delivery
      security:
      - apiKey: []
      - oauth2:
        - sending:read
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Expand'
      - $ref: '#/components/parameters/Fields'
      - name: status
        in: query
        required: false
        description: 'Return only attempts that ended this way. Omit for both.

          '
        schema:
          $ref: '#/components/schemas/DeliveryAttemptStatus'
      - name: event_id
        in: query
        required: false
        description: 'Return only attempts at delivering this event, by the `id` from the

          envelope and from the `Commune-Event-Id` header.

          '
        schema:
          type: string
          maxLength: 128
      - name: destination_id
        in: query
        required: false
        description: 'Return only attempts at this destination, by the `id` from

          `GET /newsletters/{newsletter}/destinations`.

          '
        schema:
          type: string
          maxLength: 128
      responses:
        '200':
          description: A page of delivery attempts, most recent first.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ListEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      description: 'This page of handovers, most recent first, one entry

                        per attempt at one destination. A retry is a new

                        entry with a higher `attempt` rather than an edit to

                        the one before it, so a single event delivered to two

                        destinations and retried once at one of them is three

                        entries here. `status: failed` is not yet a lost

                        event: the delivery service retries on its own with

                        backoff. Attempts are recorded shortly after delivery

                        rather than instantly, so one made a moment ago may

                        not be here yet. Neither the destination''s

                        credentials nor the body it answered with is on an

                        entry.

                        '
                      items:
                        $ref: '#/components/schemas/DeliveryAttempt'
              examples:
                aFailureAndItsRetry:
                  summary: The same event failing and then succeeding on the next attempt, newest first.
                  value:
                    object: list
                    data:
                    - object: delivery_attempt
                      id: att_5Kd9Rb2mQx
                      newsletter:
                        object: newsletter
                        id: 7d3f1c02-58a1-4a4e-9a0b-2f6d1c9e4411
                      destination:
                        object: destination
                        id: des_4Nb8Fy1kLd
                      destination_type: webhook
                      event_id: 018f2a8b-6c4b-7d2e-9f11-6a1c3d5e7b90
