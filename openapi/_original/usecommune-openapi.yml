    post:
      operationId: createTag
      summary: Create a tag
      description: 'Makes a new segment of this newsletter''s audience. Needs

        `audience: write`, and is a write.


        The tag starts empty. Nobody holds it and no article is addressed to

        it, so creating one grants nobody access to anything. People are put in

