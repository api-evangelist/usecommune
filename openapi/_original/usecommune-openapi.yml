                - type: object
                  properties:
                    data:
                      type: array
                      description: 'The articles this account put aside to read later, most

                        recently saved first. An entry is present only while

                        this person may still read the article it names, so a

                        page can be shorter than the number of saves they

                        made and an entry can disappear without them having

                        removed it. Neither is an error and nothing in the

                        response marks it. Each `article` is a reference

                        unless `?expand=article` asks for the summary, and an

                        article this person may no longer read keeps its

                        reference either way.

