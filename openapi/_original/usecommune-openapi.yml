        object, so there is nothing in the path to work out which newsletter to

        look in: name it with `?newsletter=`. Leave it out if your credential

        reaches exactly one newsletter.


        **The body your endpoint answered with is not returned**, since a

        refusing server routinely echoes the request back inside it, credentials

        included. What came back is `response_status`, or `failure` when nothing

        answered at all; the full body is in the delivery portal.

