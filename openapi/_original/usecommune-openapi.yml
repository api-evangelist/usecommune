  /articles/{article}:
    parameters:
    - $ref: '#/components/parameters/CommuneVersion'
    - $ref: '#/components/parameters/ArticlePath'
    get:
      operationId: getArticle
      summary: Retrieve an article
      description: 'Read one article, including its `content`. This is the only operation

        that returns a body.


        The same two gates apply as on the list. An article stamped with an

        audience answers `404` to a credential that does not hold that

        audience, and a

        future dated article answers `404` until it goes live, including to the

        newsletter''s own team, so that a preview link cannot be shared early.


        For an article written in Commune, `content` is the email rendered to HTML

        with personalization placeholders resolved against an empty context, so

        a merge tag never leaks as raw text. For an imported article it is the

        body as it arrived from the provider.


        `?expand=content` adds `content_markdown`, the same body as Markdown.

        Ask for it when a model is going to read the article, and ask for

        `?fields=content_markdown` with it to leave the HTML behind entirely.

        '
      tags:
      - Articles
      security:
      - apiKey: []
      - oauth2:
        - content:read
      parameters:
      - $ref: '#/components/parameters/Expand'
      - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: The article, with `content`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleWithContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateArticle
      summary: Edit an article
      description: "Changes an article that already exists. Needs `content: write`, and is a\nwrite.\n\
        \n**Absent and null are different.** A property you leave out is left\nalone; a property you send\
        \ as `null` is cleared. Send at least one\nproperty: an empty object answers `400`.\n\n**`content_markdown`\
        \ replaces the article's text in full.** Send the\nwhole article, not just the part that changed.\
        \ It can't be `null`: an\narticle always has text. It takes the same Markdown as Create an\narticle\
        \ (`POST /newsletters/{newsletter}/articles`), which documents\nit, and is parsed as strictly:\
        \ text Commune cannot read answers `400`\nnaming the line, and nothing is written.\n\n**This never\
        \ moves the article's state.** There is no `status` here, no\n`posted_at`, no `scheduled_for`.\
        \ Queueing, cancelling, sending and\nretrying are their own operations. Neither is the byline:\
        \ who is\ncredited on an article cannot be changed here.\n\n## Which articles may be edited\n\n\
        A draft, a scheduled article, and one whose send failed. Everything\nelse answers `422` with a\
        \ message saying which case it is:\n\n* **being sent right now**: an edit mid send would reach\
        \ part of the\n  list and not the rest. Wait for it to finish.\n* **sent**: the email cannot be\
        \ recalled, so an edit would change only\n  the web page.\n* **archived**: unarchive it in Commune\
        \ first.\n* **imported**: the body is a copy of what the newsletter's provider\n  published and\
        \ cannot be edited here.\n\n**Only a newsletter Commune publishes.** Anything but a `commune`\n\
        newsletter has its articles written elsewhere, and answers `422` with\nthe code `not_commune_newsletter`,\
        \ carrying a `docs_url` of\n`https://usecommune.dev/errors/not_commune_newsletter`.\n\nEditing\
        \ the body clears the HTML `content` returns until the article is\nnext opened in Commune's editor.\
        \ `content_markdown` is rendered from the\narticle itself and is correct immediately.\n\nPublishes\
        \ no event. The article's `updated_at` is what says it changed.\n"
      tags:
      - Articles
      security:
      - apiKey: []
      - oauth2:
        - content:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
