  /api-keys/{key}:
    parameters:
    - $ref: '#/components/parameters/CommuneVersion'
    - $ref: '#/components/parameters/ApiKeyPath'
    get:
      operationId: getApiKey
      summary: Retrieve an API key
      description: 'One of this newsletter''s API keys, by `id`, revoked or not. Needs

        `settings: write`. Carries no secret: Commune stores none to return.


        A key belonging to another newsletter answers `404`, whichever

        newsletter the caller names.

        '
      tags:
      - Platform
      security:
      - apiKey: []
      - oauth2:
        - settings:write
      parameters:
      - $ref: '#/components/parameters/Expand'
      - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: The key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: revokeApiKey
      summary: Revoke an API key
      description: 'Stops this credential working. The next request made with it is refused

        the same way a string that was never issued is refused.


        **The row survives.** `DELETE` stamps the key as revoked rather than

        removing it, so it stays in the list with its `revoked_at`. Nothing in

        this API removes a key.


        **Revocation only goes one way.** No operation here revives a revoked

        key, and none mints a new one, so through this API the set of working

        credentials on a newsletter can only get smaller. Mint a replacement in

        Commune''s settings.


        **A key may revoke itself**, which is what an integration that knows it

        has leaked, or a job finished with its credential, should do. `self` on

        the list operation says which key that is.


        **A key may also revoke its siblings**: the other credentials belonging

        to the same person.


        **A credential belonging to somebody else answers `403`**, even when it

        reaches the same newsletter and `GET /api-keys/{key}` returns it.

        Cutting a credential off one newsletter rather than off everything is

        done in Commune''s settings instead.


        Revoking a key that is already revoked succeeds and returns it

        unchanged, with its original `revoked_at`, so a retry after a dropped

        response is not a failure.


        Never refused for payment, so no `402`. Publishes no event: the

        credential that was revoked learns it on its next request.

        '
      tags:
      - Platform
      security:
      - apiKey: []
      - oauth2:
        - settings:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 'The key, as it now stands. `revoked` is true, `live` is false, and

            `revoked_at` is when it was first turned off.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
