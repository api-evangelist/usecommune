              schema:
                $ref: '#/components/schemas/Tag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateTag
      summary: Rename a tag
      description: 'Changes what a segment is called. Needs `audience: write`, and is a

        write.


        `name` is the only thing about a tag that can be changed, and changing

        it moves nothing else. The people holding the tag still hold it, and

        every article addressed to it is still addressed to it, because an

        article names a tag by `id` rather than by name. A rename is a label,

        never a change of who may read what.


        The new name has to be free among this newsletter''s live tags; one a

        live tag already has answers `422`.


        **A retired tag cannot be renamed**, and answers `422`. A retirement is

        the surviving record of what an already sent article was addressed to,

        and renaming it would relabel an audience that has already gone out.


        Publishes no event.

        '
      tags:
      - Subscriber tags
      security:
      - apiKey: []
      - oauth2:
        - audience:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagUpdateRequest'
      responses:
        '200':
          description: 'The tag, as it now stands. `known_subscriber_count` is unchanged by

            a rename, which is the point.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteTag
      summary: Delete a tag
      description: "Removes a tag, or retires it. Which of the two happened is in\n`outcome`, and the\
        \ two are not the same act: one ends the tag, and the\nother does not. Needs `audience: write`,\
        \ and is a write.\n\n**`deleted`.** No article was ever addressed to this tag, so it is\nremoved\
        \ outright and its assignments go with it. Asking for it\nafterwards answers `404`. Creating a\
        \ tag and changing your mind leaves\nnothing behind.\n\n**`retired`.** An article was addressed\
        \ to this tag, so the tag is kept\nand marked retired instead, because the audience of an article\
        \ that has\nalready been sent does not change retroactively. That has four\nconsequences, and\
        \ the first is the one to read twice:\n\n* **Everyone holding the tag goes on holding it, and\
        \ goes on being able\n  to read every article it was addressed to**, on the web as well as in\n\
        \  the inbox, evaluated live on every read rather than settled at send\n  time. `tag.known_subscriber_count`\
        \ in the response is what it was, not\n  zero. **Retiring a tag revokes nobody's access to anything.**\n\
        * It stops being offered. It is absent from the tag list unless\n  `include_retired=true` asks\
        \ for it, and no new holder can be added,\n  because Apply a tag to a subscriber refuses a retired\
        \ tag.\n* It stays addressable. `GET /tags/{tag}` resolves it either way, so a\n  client rendering\
        \ the audience of an article sent last year still\n  finds the name behind the identifier.\n*\
        \ Its name is free for a new tag to take.\n\n**If what you want is to take access away, take the\
        \ tag off the people\nholding it** with Take a tag off a subscriber\n(`DELETE /subscribers/{subscriber}/tags/{tag}`),\
        \ one subscriber at a\ntime. That operation works on a retired tag for exactly this reason.\n\
        Deleting the tag is not that operation and cannot be made into it.\n\n**Retirement is final.**\
        \ Deleting a tag that is already retired answers\n`200` with the retirement it already made and\
        \ never removes the row:\nthe holders a retirement kept are the ones still deciding who may read\n\
        what the tag was addressed to.\n\nPublishes no event.\n"
      tags:
