    parameters:
    - $ref: '#/components/parameters/CommuneVersion'
    - $ref: '#/components/parameters/NewsletterPath'
    get:
      operationId: listNewsletterArticles
      summary: List a newsletter's articles
      description: 'The newsletter''s articles, most recently published first, ordered by

        `posted_at` descending with articles that never got a date last.


        Two gates apply and neither can be turned off. An article stamped with

        an audience is returned only to a credential that may read that

        audience: the

        newsletter''s owner, an admin or editor, or a subscriber holding one of

        the article''s tags. An article whose `posted_at` is in the future is not

        returned at all until that moment passes, so a scheduled article never

        leaks early through this collection.


        `content` is never included here, whatever `?fields=` asks for. An article

        body is large enough that returning a page of them is the wrong default,

        so read it from `GET /articles/{article}`.

        '
      tags:
      - Articles
      security:
      - apiKey: []
      - oauth2:
        - content:read
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Expand'
      - $ref: '#/components/parameters/Fields'
      - name: status
        in: query
        required: false
        description: 'Return only articles in this state. A credential holding only

          `read` permissions may ask for `sent` alone, since a draft or a

          failed send is not published. Repeat the parameter to accept

          several.

          '
        schema:
          $ref: '#/components/schemas/ArticleStatus'
      - name: imported
        in: query
        required: false
        description: '`true` returns only articles imported from the newsletter''s

          provider, `false` only articles written in Commune. Omit

          for both.

          '
        schema:
          type: boolean
      - name: tag
        in: query
        required: false
        description: 'Return only articles stamped with this subscriber tag, by tag `id`.

          Needs `content: read`, because the audience of an article is not public.

          '
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: A page of articles, each without `content`.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ListEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      description: 'This page of the newsletter''s articles, most recently

                        published first by `posted_at`, with articles that

                        never got a date last. Two gates remove rows before

                        the page is built, and neither is marked in the

                        response: an article dated in the future is absent

                        until that moment passes, and an article stamped with

                        an audience is absent unless the credential may read

                        that audience. A page shorter than expected is those gates

                        rather than an error. No entry carries `content`,

                        whatever `?fields=` asked for.

                        '
