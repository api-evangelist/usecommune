  /newsletters/{newsletter}/insights:
    parameters:
    - $ref: '#/components/parameters/CommuneVersion'
    - $ref: '#/components/parameters/NewsletterPath'
    get:
      operationId: listNewsletterInsights
      summary: List a newsletter's subscriber insights
      description: 'Per subscriber engagement scoring. Each row blends what a reader did in

        the newsletter''s community with what its email provider reported about

        them, carries a fourteen day over fourteen day velocity, and lands on a

        lifecycle status. This is what a CRM or a re engagement automation

        reads.


        Scores are recomputed by a scheduled pass rather than at read time, so a

        row is only as fresh as the last pass, and `last_action_at` can be newer

        than the score that reflects it.


        **Only people with a Commune account are scored.** Someone the

        newsletter knows only as an email address has no row here rather than a

        zero score, so the size of this collection is not the size of the

        audience.


        `status` is assigned by rank within the newsletter rather than by an

        absolute score, so it moves when the people around a reader move even if

        that reader did nothing.


        Ordered by `total_score` descending, so the first page is the

        newsletter''s most engaged readers. Needs `insights: read`, and is one of

        the reads Commune may put behind a plan: a credential whose newsletter

        is not entitled answers `402`.


        **`?expand=subscriber` saves a request per reader.** Each insight''s

        `subscriber` is a reference by default, and acting on the list (say,

        emailing the readers who are cooling off) would otherwise mean one

        `GET /subscribers/{subscriber}` per row. Expanded, every row carries

        the full `Subscriber`, the same object that operation returns,

        including `email` and `status`, in this one response. Accepted paths

        are `newsletter` and `subscriber`.


        Expanding `subscriber` puts email addresses in the response, so it also

        needs `audience: read` on this newsletter. A credential that holds

        `insights: read` without it is refused with `403`

        `insufficient_scope`, `param` set to `expand`, and `allowed_values`

        listing what it may expand instead; it is never handed references in

        place of the subscribers it asked for. A response that expands

        `subscriber` counts against the `audience` rate limit budget and is

        recorded in Commune''s audit log, like any other read of subscribers.

        '
      tags:
      - Engagement
      security:
      - apiKey: []
      - oauth2:
        - insights:read
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Expand'
      - $ref: '#/components/parameters/Fields'
      - name: status
        in: query
        required: false
        description: 'Return only subscribers in this lifecycle status. Repeat the

          parameter to accept several.

          '
        schema:
          $ref: '#/components/schemas/InsightStatus'
      - name: velocity
        in: query
        required: false
        description: 'Return only subscribers whose engagement is moving this way. Repeat

          the parameter to accept several.

          '
        schema:
          $ref: '#/components/schemas/InsightVelocity'
      responses:
        '200':
          description: A page of subscriber insights, highest scoring first.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ListEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      description: 'This page of scored readers, highest `total_score`

                        first. Only people with a Commune account are scored,

                        so somebody the newsletter knows only as an address

                        has no entry at all rather than an entry scoring

                        zero, and the length of this collection is not the

                        size of the audience. Scores come from a scheduled

                        pass rather than from read time, so `last_action_at`

                        can be newer than the scores beside it, and `status`

                        is assigned by rank within the newsletter, so it

                        moves when the people around a reader move.

                        '
                      items:
                        $ref: '#/components/schemas/SubscriberInsight'
              examples:
                aSuperfanAndADormantReader:
                  summary: The top of the ranking and a reader who has cooled, highest score first.
                  value:
                    object: list
                    data:
                    - object: subscriber_insight
                      newsletter:
