      summary: Retrieve one delivery attempt
      description: 'One attempt from the delivery log, by its `id`. Needs `sending: read`.

        The same shape a page of them carries, and what

        `POST /delivery-attempts/{attempt}/replay` acts on.


        An attempt belonging to another newsletter answers `404`, the same as

        one that does not exist.


