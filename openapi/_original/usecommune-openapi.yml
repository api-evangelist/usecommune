      summary: Article published
      description: 'An article became publicly readable on Commune. Two paths reach this

        state and both publish here, distinguished by `data.source`.


        `commune_send`: an article written in Commune finished sending. Its

        status moved from `sending` to `sent` and `posted_at` was stamped, which is what

        surfaces it in the feed.


