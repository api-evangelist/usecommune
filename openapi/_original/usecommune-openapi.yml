                    unsubscribed_at: '2026-08-26T13:41:52Z'
                    article_send_id: 9a8b7c6d-5e4f-4a3b-2c1d-0e9f8a7b6c5d
      responses:
        '200':
          description: 'The consumer accepted the delivery. Any 2xx acknowledges the message

            and it is not sent again.

            '
        4XX:
          description: 'The consumer rejected the delivery. Handled exactly like a 5xx: the

            message is retried with backoff, because a rejection cannot be told

            apart from a consumer that is briefly misconfigured.

            '
        5XX:
          description: 'The consumer failed to handle the delivery. Retried with backoff. A

            timeout is the same case and is retried too.

            '
  thread.created:
    post:
      operationId: onThreadCreated
      summary: Thread created
      description: 'A new top-level thread was started in a newsletter''s space

        (`thread_level = 0`).


        `data.visibility` decides where it appears: `public` puts it on the

        global feed and only team members may set it, `subscribers` keeps it

        inside the newsletter''s own space. `paid` exists in the enum and is not

        in use yet.


        A thread created public fires `thread.published` from the same write, so

        a consumer that only cares about the feed can subscribe to that topic

        alone and ignore this one.


        Delivered as a single HTTPS POST to the consumer''s registered endpoint,

        with the message as the JSON request body. Respond 2xx to acknowledge.

        Anything else, or a timeout, is retried with backoff, so acknowledge

        fast and do the work afterwards.

        '
      tags:
      - Webhooks
      security: []
      parameters:
      - $ref: '#/components/parameters/WebhookVersion'
      - $ref: '#/components/parameters/WebhookEventId'
      - $ref: '#/components/parameters/WebhookEventType'
      - $ref: '#/components/parameters/WebhookSignature'
      - $ref: '#/components/parameters/WebhookTimestamp'
      - $ref: '#/components/parameters/WebhookDeliveryAttempt'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreadCreatedEvent'
            examples:
              articleDiscussion:
                summary: A thread bound to an article, which is where comments live now.
                value:
                  id: 018f2a91-dddd-7000-8000-00000000000d
                  type: thread.created
                  api_version: '2026-08-26'
                  occurred_at: '2026-08-26T15:10:44Z'
                  newsletter_id: 7d3f1c02-58a1-4a4e-9a0b-2f6d1c9e4411
                  actor: null
                  idempotency_key: null
                  data:
                    thread_id: b1c2d3e4-f506-4718-8293-a4b5c6d7e8f9
                    short_id: k3n8qz
                    url: https://example.com/t/k3n8qz
                    author:
                      user_id: usr_2Nf8Kq1pWc
                      username: mira
                      display_name: Mira Okafor
                      avatar_url: https://cdn.example.com/avatars/mira.png
                    content: The bit about moderation load matched my experience exactly.
                    visibility: subscribers
                    article_id: 4c9e2f81-0b7a-4d13-8e55-1a2b3c4d5e6f
                    created_at: '2026-08-26T15:10:44Z'
      responses:
        '200':
          description: 'The consumer accepted the delivery. Any 2xx acknowledges the message

            and it is not sent again.

            '
        4XX:
          description: 'The consumer rejected the delivery. Handled exactly like a 5xx: the

            message is retried with backoff, because a rejection cannot be told

            apart from a consumer that is briefly misconfigured.

            '
        5XX:
          description: 'The consumer failed to handle the delivery. Retried with backoff. A

            timeout is the same case and is retried too.

            '
  thread.published:
    post:
      operationId: onThreadPublished
      summary: Thread published to the feed
      description: "A thread's `visibility` became `public`, which is what puts it on\nCommune's global\
        \ feed. This is the only way community content leaves one\nnewsletter's space and reaches everyone,\
        \ so it is the topic to watch for\nanything that mirrors, syndicates or moderates the feed.\n\n\
        Two paths reach `public` and both publish here, told apart by\n`data.source`:\n\n* `visibility_changed`:\
        \ a team member featured a thread that already\n  existed. `published_by` and `published_at` say\
        \ who and when.\n* `created_public`: the thread was born public, which a team member may\n  do\
        \ when starting a top-level thread. That write fires `thread.created`\n  and this topic together,\
        \ and carries no `published_by`.\n\nOnly an owner, admin or editor can reach `public`, and only\
        \ on a\ntop-level thread: featuring anything with a non-zero `thread_level` is\nrefused, and replies\
        \ inherit their thread's placement.\n\n**Going back to `subscribers` is a real change and has\
        \ no topic.** A\nconsumer mirroring the feed should reconcile against\n`GET /threads/{thread}`\
        \ rather than assume a thread it saw here is still\npublic.\n\nDelivered as a single HTTPS POST\
        \ to the consumer's registered endpoint,\nwith the message as the JSON request body. Respond 2xx\
        \ to acknowledge.\nAnything else, or a timeout, is retried with backoff, so acknowledge\nfast\
        \ and do the work afterwards.\n"
      tags:
      - Webhooks
      security: []
      parameters:
      - $ref: '#/components/parameters/WebhookVersion'
      - $ref: '#/components/parameters/WebhookEventId'
      - $ref: '#/components/parameters/WebhookEventType'
      - $ref: '#/components/parameters/WebhookSignature'
      - $ref: '#/components/parameters/WebhookTimestamp'
      - $ref: '#/components/parameters/WebhookDeliveryAttempt'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreadPublishedEvent'
            examples:
              featuredByTheTeam:
                summary: An existing subscribers-only thread was featured onto the feed.
                value:
                  id: 018f2a92-3030-7000-8000-000000000030
                  type: thread.published
                  api_version: '2026-08-26'
                  occurred_at: '2026-08-26T18:02:19Z'
                  newsletter_id: 7d3f1c02-58a1-4a4e-9a0b-2f6d1c9e4411
                  actor: null
                  idempotency_key: null
                  data:
                    thread_id: b1c2d3e4-f506-4718-8293-a4b5c6d7e8f9
                    short_id: k3n8qz
                    url: https://example.com/t/k3n8qz
                    author:
                      user_id: usr_2Nf8Kq1pWc
                      username: mira
                      display_name: Mira Okafor
                      avatar_url: https://cdn.example.com/avatars/mira.png
                    visibility: public
                    previous_visibility: subscribers
                    source: visibility_changed
                    published_by:
                      user_id: usr_5Qw8Hn2vFd
                      username: sam
                      display_name: Sam Ortega
                      avatar_url: null
                    article_id: 4c9e2f81-0b7a-4d13-8e55-1a2b3c4d5e6f
                    published_at: '2026-08-26T18:02:19Z'
              startedPublic:
                summary: A team member started the thread public, so this arrives alongside thread.created
                  from the same write.
                value:
                  id: 018f2a92-3131-7000-8000-000000000031
                  type: thread.published
                  api_version: '2026-08-26'
                  occurred_at: '2026-08-26T18:40:03Z'
                  newsletter_id: 7d3f1c02-58a1-4a4e-9a0b-2f6d1c9e4411
                  actor: null
                  idempotency_key: null
                  data:
                    thread_id: c3d4e5f6-0718-4920-a1b2-c3d4e5f60718
                    short_id: t9m4hx
                    url: https://example.com/t/t9m4hx
                    author:
                      user_id: usr_5Qw8Hn2vFd
                      username: sam
                      display_name: Sam Ortega
                      avatar_url: null
                    visibility: public
                    previous_visibility: null
                    source: created_public
                    published_by: null
                    article_id: null
                    published_at: '2026-08-26T18:40:03Z'
      responses:
        '200':
          description: 'The consumer accepted the delivery. Any 2xx acknowledges the message

            and it is not sent again.

            '
        4XX:
          description: 'The consumer rejected the delivery. Handled exactly like a 5xx: the

            message is retried with backoff, because a rejection cannot be told

            apart from a consumer that is briefly misconfigured.

            '
        5XX:
          description: 'The consumer failed to handle the delivery. Retried with backoff. A

            timeout is the same case and is retried too.

            '
components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: 'An OAuth access token, sent as `Authorization: Bearer <token>`. The

        walkthrough of the whole flow is at

        [usecommune.dev/use-cases/build-an-integration](https://usecommune.dev/use-cases/build-an-integration):

        discovery, registration, PKCE, the consent screen, the exchange, refresh

        and revocation.


        Ask for a family scope and the person picks which newsletter

        the token reaches; ask for `account:read` alone and it reaches no

        newsletter and reads only the account it belongs to.


        Each operation lists the scopes a token must carry to call it. An

        operation that lists none takes any token.


        Discover the URLs under `flows` at runtime from

        `GET /.well-known/oauth-authorization-server` rather than hardcoding

        them.

        '
      flows:
        authorizationCode:
          authorizationUrl: https://usecommune.com/api/oauth/authorize
          tokenUrl: https://usecommune.com/api/oauth/token
          refreshUrl: https://usecommune.com/api/oauth/token
          scopes:
            content:read: Read articles, threads and the rest of what a newsletter publishes.
            content:write: Create, edit and delete that content.
            audience:read: Read subscribers, tags and segments, including email addresses.
            audience:write: Add, tag and remove subscribers.
            insights:read: Read engagement, delivery and growth figures.
            insights:write: Write back an insight the newsletter owns.
            sending:read: Read sends, schedules and delivery outcomes.
            sending:write: Send an article, schedule one, and cancel a schedule.
            settings:read: Read a newsletter's configuration, senders and domains.
            settings:write: Change that configuration.
            webhooks:read: Read event destinations and their delivery history.
            webhooks:write: Create and remove event destinations.
            account:read: Read the person the credential belongs to, and nothing about any newsletter.
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: Commune API key
      description: 'A Commune API key, sent as `Authorization: Bearer <key>`. A key is

        granted one or more newsletters and carries six permission families on

        each, every one of them `none`, `read` or `write`. An operation names

        the family and the level it needs.


        A key is minted by a creator in Commune''s settings: no flow, no consent

        screen, no expiry. That is the whole difference from `oauth2`. An

        operation that declares both accepts either credential, and what each

        may do is what it was granted.

        '
  parameters:
    CommuneVersion:
      name: Commune-Version
      in: header
      required: false
      description: 'The contract version this request is written against. Every version

        published so far is a release date (`YYYY-MM-DD`), which is why the

        examples look like one, but the value is an opaque identifier: match it

        against the versions this API publishes rather than parsing it, because

        a future one may not be only a date. An unknown value answers `400`

        with `invalid_version`.


        Omitting the header pins the request to the version that was current

        when the API key was issued, so an integration keeps working when a

        newer version ships.

        '
      schema:
        type: string
        minLength: 1
        examples:
        - '2026-08-26'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'A value of your choosing naming the change this request is making.


        Send the same value again to retry the same request. Commune replays

        the answer the first attempt gave instead of making the change twice,

        and marks the replay with an `Idempotent-Replay: true` response header.

        Send a different value for a different change: a key reused for a

        request that differs in any way answers `409`, because replaying an

        answer to a question you did not ask is a wrong answer you could not

        detect.


        A UUID per change is the usual choice. Remembered for 24 hours, per

        credential, so two credentials choosing the same value never see each

        other''s answers.


        Required, not optional.

        '
      schema:
        type: string
        minLength: 1
        maxLength: 255
      examples:
        uuid:
          summary: A UUID per change
          value: 3f7c1a26-9b0e-4f5a-9a2c-2c8f1d6b4e77
    NewsletterChoice:
      name: newsletter
      in: query
      required: false
      description: 'Which newsletter this request is for, by `id` or by `handle`.


        Most operations never need this. A credential reaches a list of

        newsletters, and an operation that acts on one of them normally works

        out which from the object in its path: an article, a thread, a subscriber

        and a key each belong to a newsletter, so naming one is naming the

        other. This parameter is for the operations whose subject is **not** a

        Commune object, where there is nothing to work it out from.


        Leave it out if your credential reaches exactly one newsletter, which is

        the usual case: it is that one. If your credential reaches several and

        you leave it out, the answer is `400` naming this parameter, because

        picking one for you would be picking wrong most of the time.


        `GET /newsletters` lists the newsletters your credential reaches, and is

        where the value for this comes from.

        '
      schema:
        type: string
        maxLength: 200
      examples:
        byHandle:
          summary: By handle
          value: the-weekly
        byId:
          summary: By UUID
          value: 9a4c1c6e-0f2b-4f47-9d3f-6d1b1a2c3d4e
    NewsletterPath:
      name: newsletter
      in: path
      required: true
      description: 'The newsletter''s `id` (a UUID) or its `handle`. A handle is unique

        across Commune and is the identifier its public web profile uses, so it

        is the one to hardcode in an integration.

        '
      schema:
        type: string
      examples:
        byId:
          summary: By UUID
          value: 9a4c1c6e-0f2b-4f47-9d3f-6d1b1a2c3d4e
        byHandle:
          summary: By handle
          value: the-weekly
    ArticlePath:
      name: article
      in: path
      required: true
      description: 'The article''s `id` (a UUID) or its `short_id`, an eight character base62

        string that is unique across Commune. The `slug` is not accepted here

        because it is unique only within a newsletter.

        '
      schema:
        type: string
      examples:
        byShortId:
          summary: By short id
          value: k7Rm2xQp
    SenderPath:
      name: sender
      in: path
      required: true
      description: The sending address's `id`. It has no short id.
      schema:
        type: string
        format: uuid
    DomainPath:
      name: domain
      in: path
      required: true
      description: 'The website domain''s `id`, or the hostname itself. The hostname is

        unique across Commune, so either resolves.

        '
      schema:
        type: string
      examples:
        byHostname:
          summary: By hostname
          value: blog.example.org
    HighlightPath:
      name: highlight
      in: path
      required: true
      description: The highlight's `id`. A highlight has no short id.
      schema:
        type: string
        format: uuid
    ApiKeyPath:
      name: key
      in: path
      required: true
      description: 'The API key''s `id`. Never the secret itself: Commune does not store one

        and could not look a key up by one, and a credential that travelled in a

        URL would end up in access logs and browser history.

        '
      schema:
        type: string
        format: uuid
    TagPath:
      name: tag
      in: path
      required: true
      description: The tag's `id`. A tag has no short id.
      schema:
        type: string
        format: uuid
    DeliveryAttemptPath:
      name: attempt
      in: path
      required: true
      description: 'The delivery attempt''s `id`, as

        `GET /newsletters/{newsletter}/delivery-attempts` returned it. Opaque,

        and minted by the delivery service rather than by Commune, so it is not

        a UUID and must not be parsed as one.

        '
      schema:
        type: string
    SubscriberPath:
      name: subscriber
      in: path
      required: true
      description: 'The subscriber''s `id`. This identifies one person''s membership of one

        newsletter, not the person, and a subscriber has no short id.

        '
      schema:
        type: string
        format: uuid
    ThreadPath:
      name: thread
      in: path
      required: true
      description: 'The thread''s `id` (a UUID) or its `short_id`. A thread that Commune

        opened under an article has no `short_id`, because it is addressed on

        the web through the article''s own permalink, so use its `id`.

        '
      schema:
        type: string
      examples:
        byShortId:
          summary: By short id
          value: b3Xn8kTw
    MessagePath:
      name: message
      in: path
      required: true
      description: The message's `id` (a UUID) or its `short_id`.
      schema:
        type: string
    UserPath:
      name: user
      in: path
      required: true
      description: The user's `id` or their `username`, with or without a leading `@`.
      schema:
        type: string
      examples:
        byUsername:
          summary: By username
          value: '@ada'
    Cursor:
      name: cursor
      in: query
      required: false
      description: 'The `pagination.next_cursor` value from the previous page. Omit it to

        read the first page. A cursor is opaque, is only valid for the same

        operation with the same filters, and is not a durable identifier.

        '
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      description: 'How many items to return in this page. This is a page size, not an

        offset. Fewer items than requested may come back and that does not mean

        the collection is exhausted, only an absent `next_cursor` does.

        '
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Expand:
      name: expand
      in: query
      required: false
      description: 'Comma-separated list of relationship paths to inline in the response.

        Unexpanded relationships are returned as a reference object carrying

        only `id` and `object`. Each operation documents the paths it accepts,

        and an unknown path answers `400`. Nested paths use a dot, for example

        `article.newsletter`.

        '
      schema:
        type: string
      examples:
        singleRelation:
          summary: Inline the newsletter of each item
          value: newsletter
        nestedRelation:
          summary: Inline the newsletter of the article of each item
          value: article.newsletter
        secondRendition:
          summary: Add the Markdown rendition of an article body
          value: content
    Fields:
      name: fields
      in: query
      required: false
      description: 'Comma-separated allow-list of top level properties to return on each

        object, so a client can trim a response it does not need in full. `id`

        and `object` are always returned. An unknown property name answers

        `400`. Properties omitted by an operation, such as `content` on any

        article list, cannot be brought back with `fields`.

        '
      schema:
        type: string
      examples:
        trimmed:
          summary: Only the fields a link list needs
          value: title,slug,posted_at
    SendPath:
      name: send
      in: path
      required: true
      description: 'The send''s `id`, which is the `send_id` a `send.completed` or

        `send.failed` event carries. A send has no short id.

        '
      schema:
        type: string
        format: uuid
    StatsPeriod:
      name: period
      in: query
      required: false
      description: 'A named window, counted back from today in UTC. Defaults to `30d`.

        Ignored when `since` is given, so a request never has to reconcile two

        conflicting windows.

        '
      schema:
        type: string
        enum:
        - 7d
        - 14d
        - 30d
        - 90d
        - 6m
        - 1y
        - all
        default: 30d
    StatsSince:
      name: since
      in: query
      required: false
      description: 'Start of the window, inclusive, as a date or an RFC 3339 timestamp.

        Giving this overrides `period`. A `since` later than `until` answers

        `400`. Anything that is neither of those two shapes answers `400` as

        well, rather than being guessed at: a lenient parser would read

        `8/1/2026` as a date and give two callers different windows for the same

        string.

        '
      schema:
        type: string
        maxLength: 40
      examples:
        asDate:
          summary: A calendar day
          value: '2026-08-01'
    StatsUntil:
      name: until
      in: query
      required: false
      description: 'End of the window, exclusive, as a date or an RFC 3339 timestamp.

        Defaults to now. Only meaningful alongside `since`.

        '
      schema:
        type: string
        maxLength: 40
      examples:
        asDate:
          summary: A calendar day
          value: '2026-09-01'
    WebhookVersion:
      name: Commune-Version
      in: header
      required: true
      description: API version the payload conforms to. Same value as `api_version` in the envelope.
      schema:
        type: string
        examples:
        - '2026-08-26'
    WebhookEventId:
      name: Commune-Event-Id
      in: header
      required: true
      description: Same value as `id` in the envelope. The dedupe key.
      schema:
        type: string
        format: uuid
    WebhookEventType:
      name: Commune-Event-Type
      in: header
      required: true
      description: Same value as `type` in the envelope. The topic name.
      schema:
        type: string
    WebhookSignature:
      name: Commune-Signature
      in: header
      required: true
      description: HMAC-SHA256 over `Commune-Timestamp` as Unix seconds, a literal `.`, then the raw request
        body, keyed by the endpoint's signing secret. Lowercase hex, carried as `v0=` followed by one
        or more comma separated digests (more than one while a secret is being rotated). The header's
        timestamp is an RFC 3339 instant, so convert it to Unix seconds before signing. Verify against
        the raw bytes before parsing the JSON. The webhooks guide has the full procedure.
      schema:
        type: string
        examples:
        - v0=8501d20988a42e76a6f63c4aaabbca745b9ad6333c254c1665b970a7e3c39541
    WebhookTimestamp:
      name: Commune-Timestamp
      in: header
      required: true
      description: When this delivery attempt was made, as an RFC 3339 instant in UTC. It differs on every
        retry, and it IS covered by the signature, in Unix seconds, so a stale or altered one can be rejected.
        Enforce a tolerance window of a few minutes and dedupe on the event id as well, since a retry
        inside that window is legitimate.
      schema:
        type: string
        format: date-time
        examples:
        - '2026-08-26T09:32:14Z'
    WebhookDeliveryAttempt:
      name: Commune-Delivery-Attempt
      in: header
      required: false
      description: '1 on the first attempt, incremented on each retry. **Not sent today**: do not rely
        on it, and be idempotent regardless. The same number is readable after the fact as `attempt` on
        a `DeliveryAttempt`, so a consumer that needs to tell a retry from a first delivery can ask instead
        of being told.'
      schema:
        type: integer
        minimum: 1
  responses:
    BadRequest:
      description: "The request was malformed, and the same request will fail the same way\nuntil it is\
        \ changed. `param` names the parameter or header at fault\nwhen there is exactly one, and `allowed_values`\
        \ lists what it accepts\nwhen that is a finite set. The code is `bad_request` for every case\n\
        below except the last.\n\n* **A query parameter**: one the operation does not have, a value\n\
        \  outside its set, range or format (an unparseable cursor, an unknown\n  `expand` path or `fields`\
        \ name, an identifier that is not a UUID),\n  or a required one left out, such as `q` on a search\
        \ or `newsletter`\n  when the credential reaches more than one.\n* **The request body**: not JSON,\
        \ not the shape the operation reads,\n  a property it does not write, or a value of the wrong\
        \ type, length\n  or format. `param` is absent here, since the body is not a\n  parameter, and\
        \ the message names the property.\n* **The `Idempotency-Key` header**, on an operation that changes\n\
        \  something: missing, or a value this API will not store.\n* **An unrecognised `Commune-Version`**,\
        \ which answers with its own\n  code, `invalid_version`, because it is never fixed by changing\
        \ the\n  body.\n"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 'No credential was presented, or it is malformed, unknown, revoked or

        expired, or it is an access token minted for a different audience.


        Every one of these answers identically, down to the wording and the

        headers, so a refusal never confirms that a string was once real.

        '
      headers:
        WWW-Authenticate:
          description: 'The authentication scheme this API accepts, and where to find out

            how to get a credential for it. Always

            `Bearer realm="Commune API", resource_metadata="https://api.usecommune.com/.well-known/oauth-protected-resource"`.


            `resource_metadata` is the RFC 9728 pointer to this API''s protected

            resource metadata, which names the authorization server an OAuth

            client should send its user to. A client holding an API key can

            ignore it. The header carries no `error` parameter, not even

            `error="invalid_token"`, because it describes what this API accepts

            rather than what was wrong with the credential sent, and the

            reasons above are deliberately indistinguishable.


            There is no second scheme and no query-parameter fallback, because

            a credential that can travel in a URL ends up in access logs and

            referer headers.

            '
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 'The credential is valid but is not allowed to do this. Two codes answer

        with this status, and `error.code` says which.


        **`insufficient_scope`: it does not hold the permission.** The

        operation needs, say, `audience: read` on the newsletter addressed, and

        this credential holds less than that there. `allowed_values` carries

        the permission that was needed, and the message says what the

        credential does hold on that newsletter, because a credential granted

        the wrong family and a credential belonging to somebody whose standing

        on the team has narrowed look identical without it. The answer can

        differ per newsletter: the same credential may be allowed here and

        refused on the next one it reaches.


        The same code answers an operation that needs the **account

        permission** from a credential that does not carry it. That permission

        is about the person a credential belongs to rather than about any

        newsletter, so nothing granted on a newsletter adds up to it. It is

        granted on the credential itself, when a key is minted or when an

        authorization asks for `account:read`.


        And it answers a parameter the credential may send, but not with the

        value it sent: a filter a credential holding only `read` permissions

        may not use, or an `expand` path whose rows need a permission the

        operation does not. `param` names the parameter, and `allowed_values`

        carries what this credential may send instead, or is absent when it may

        send nothing there at all.


        **`forbidden`: it may not act here at all.** Either the credential does

        not reach the newsletter addressed, because it was never granted it or

        because the person it belongs to can no longer act on it, or it reaches

        no newsletter at all; `param` is `newsletter`, and `GET /newsletters`

        lists the ones it does reach. Or, on `DELETE /api-keys/{key}`, the

        credential named belongs to somebody else. Neither carries

        `allowed_values`, because there is no value to send instead.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 'No such resource, or the key is not allowed to know that it exists.

        Commune answers `404` rather than `403` where distinguishing the two

        would leak the existence of private content.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PaymentRequired:
      description: 'The credential is allowed to do this but the newsletter''s plan does not

        include it.


        Two surfaces can answer it: **insights**, the engagement and metrics

        operations, which are the only reads Commune reserves the right to

        meter, and **writing**, every operation that changes something.


        Every other read stays free on every plan, so a credential refused at

        one of these can still read everything else. The body names the plan the

        newsletter is on and the plans that would work.


        **This status is predictable and should not be how you discover it.**

        `GET /newsletters/{newsletter}/entitlements` answers the same question

        in advance, carrying the same plan list this puts in `allowed_values`

        and the same sentence it puts in `message`. Read it once at the start

        of a run rather than finding out in the middle of one.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 'The request collided with something. On a write this is always the

        `Idempotency-Key`, in one of two ways, and the message says which.


        Either the key was already used for a **different** request, which is

        refused rather than answered with the earlier request''s result. Or an

        earlier request using the same key has not finished, or never reported

        an outcome, in which case this one was not run and the key becomes

        usable again shortly.


        Nothing was changed by a request that answers this.

        '
      headers:
        Retry-After:
          description: 'Seconds to wait before retrying, on the second case only.

            '
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: 'The request is well formed and every value in it is legal, and the

        state of what it addresses refuses it anyway. The message says what

        about that state is in the way.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: 'Too many requests. Back off and retry after the interval named by the

        `Retry-After` response header.


        One of the budgets in `RateLimit-Policy` ran out, and the

        `RateLimit-*` headers on this response say which and when it resets.

        '
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    SendLimited:
      description: 'Too many requests. Back off and retry after the interval named by the

        `Retry-After` response header.


        Usually one of the budgets in `RateLimit-Policy` ran out, and the

        `RateLimit-*` headers on this response say which and when it resets.


        This operation can also reach a **daily send limit**, which is counted

        apart from those budgets and is not reported in them: how many times an

        article may be dispatched to a newsletter''s whole list in a day, or how

        many test copies a credential may send to addresses it names. Neither

        counts recipients, so the size of a send is never what refuses it. When

        one of these is what answered, the message says so by name and

        `Retry-After` is measured in hours rather than seconds, which is how to

        tell the two apart.

        '
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Something failed inside Commune. The request may be retried.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: 'A capability this operation depends on did not answer. Every other

        operation is unaffected, so back off on this one rather than on the API.


        Two parts of the API can answer this, because they are the only ones

        Commune cannot serve out of its own database.


        **Event delivery.** Destinations, the attempt log and the portal all

        live in the delivery service. It is never an empty answer instead,

        because a destination list or an attempt log that came back empty for

        this reason reads exactly like a newsletter that has registered no

        endpoints and sent nothing anywhere.


        **`sendArticleTest`.** A test copy is sent while the request is open,

        by Commune''s sending service, and this answers when that service could

        not be reached or when the sending provider refused every address on

        the test, so nothing arrived. Nothing about the article changes either

        way, and the message says which of the two happened.

        '
      headers:
        Retry-After:
          description: 'Seconds to wait before retrying. Absent in the one case that will

            not pass on its own, a deployment where event delivery is not

            available at all; the message says so, and retrying will not clear

            it.

            '
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Pagination:
      type: object
      title: Pagination
      description: 'Cursor pagination state. Commune never exposes an offset or a page

        number: a collection is a moving window, and an offset silently skips or

        repeats items when the window shifts between two requests.

        '
      additionalProperties: false
      required:
      - has_more
      - next_cursor
      properties:
        has_more:
          type: boolean
          description: 'Whether another page exists. When `false`, `next_cursor` is `null`.

            '
        next_cursor:
          type:
          - string
          - 'null'
          description: 'Pass this back as `?cursor=` to read the next page. `null` on the

            last page. Opaque, and valid only for the same operation with the

            same filters.

            '
          examples:
          - Y3Vyc29yOjE3NTY0MjM2MDAwMDA6MDE5MmM4
    ListEnvelope:
      type: object
      title: ListEnvelope
      description: 'The envelope every collection is returned in. `data` holds the page,

        `pagination` holds the cursor state.


        `data` is required here and typed by each list operation, as an array

        of the one thing that operation returns, so the item type is stated on

        the page you are reading.

        '
      required:
      - object
      - data
      - pagination
      properties:
        object:
          type: string
          const: list
          description: Always `list`, so a response is self describing.
        pagination:
          $ref: '#/components/schemas/Pagination'
    Ref:
      type: object
      title: Ref
      description: 'An unexpanded relationship. Ask for the relationship in `?expand=` to

        get the full object in its place.

        '
      additionalProperties: false
      required:
      - object
      - id
      properties:
        object:
          type: string
          description: The type of the referenced resource.
          examples:
          - newsletter
        id:
          type: string
          description: 'The referenced resource''s `id`, in whatever form that resource''s own

            schema declares. Most are UUIDs; a `Ref` whose `object` is `user`

            carries an account identifier, which is an opaque string and not a

            UUID. Compare it for equality and pass it back; do not parse it.

            '
          examples:
          - 9a4c1c6e-0f2b-4f47-9d3f-6d1b1a2c3d4e
    Error:
      type: object
      title: Error
      description: 'The error envelope. Every non `2xx` response from every operation has

        this shape, so a client can branch on `error.code` without knowing which

        operation produced it.

        '
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: 'A human readable sentence describing what went wrong. Written

                for a developer reading a log, not for an end user. Do not

                branch on it, branch on `code`.

                '
              examples:
              - Newsletter not found.
            param:
              type: string
              description: 'The query, path or body parameter the error is attributed to,

                when the error is attributable to exactly one. Absent otherwise.

                '
              examples:
              - cursor
            allowed_values:
              type: array
              description: 'Everything `param` would have accepted, when what it accepts is

                a finite set. Absent when it is not: a cursor, an identifier or

                a numeric range has nothing to enumerate, and an empty array

                would read as "nothing is allowed".


                It repeats what `message` says in prose, so a caller can correct

                a request from this one response: the array is what a program

                branches on, the sentence is what a person or a model reads.


                On an unknown parameter name rather than an unknown value, this

                carries the parameter names the operation does accept, since

                that is the set the caller has to pick from.


                On an `insufficient_scope` failure there is usually no

                parameter at fault and `param` is absent, and this carries the

                one permission that was needed, written the way the permission

                table writes it, such as `content: read`. The exception is a

                credential that may call the operation but not with one value

                of a parameter, such as `?expand=subscriber` on

                `listNewsletterInsights` without `audience: read`: then `param`

                names the parameter and this carries the values this credential

                may send instead.

                '
              items:
                type: string
              examples:
              - - subscribed
                - unsubscribed
                - bounced
                - complained
                - pending
            request_id:
              type: string
              description: 'Identifier for this request, echoed in the `Commune-Request-Id`

                response header. Quote it in support requests.

                '
              examples:
              - req_01j9c8h1q7m3n4p5r6s7t8u9v0
            docs_url:
              type: string
              format: uri
              description: 'Link to the documentation for this error code: always

                `https://usecommune.dev/errors/` followed by the code, a page

                on what the code means, what usually causes it and how to fix

                it.

                '
              examples:
              - https://usecommune.dev/errors/not_found
    ErrorCode:
      type: string
      title: ErrorCode
      description: 'The stable, machine readable reason a request failed. New codes may be

        added in a minor version, so treat an unrecognised code as a generic

        failure of its HTTP status class.


        Two of these share a status with a neighbour and exist because what a

        caller does next is different. `invalid_version` is a `400` that is

        never fixed by changing the request body. `not_commune_newsletter` is a

        `422` that is never fixed by changing the request at all: it says the

        newsletter''s articles are published somewhere else and mirrored into

        Commune afterwards, so Commune cannot write one. Its page at

        `https://usecommune.dev/errors/not_commune_newsletter`, like every

        code''s, is its `docs_url`, and it covers moving a newsletter onto

        Commune''s own publishing, which is the only thing that resolves it.

        '
      enum:
      - bad_request
      - invalid_version
      - unauthorized
      - forbidden
      - insufficient_scope
      - payment_required
      - not_found
      - conflict
      - unprocessable
      - not_commune_newsletter
      - rate_limited
      - internal_error
      - service_unavailable
    DependencyState:
      type: string
      title: DependencyState
      description: 'How a single dependency answered its last check. `up` is a successful

        answer, `degraded` is an answer that arrived but was slow or partial,

        and `down` is no usable answer at all.


        `down` covers every way a dependency can be unavailable to this

        deployment and does not distinguish between them. Read it as "not

        usable right now", never as a statement about why.

        '
      enum:
      - up
      - degraded
      - down
    Dependency:
      type: object
      title: Dependency
      description: 'One capability the API depends on, and how it answered. `required` is

        the field that matters when deciding what to do about a failure: a

        required dependency being down means no operation can be served, while

        an optional one being down costs only the operations that touch it.


        A dependency is named by the capability it provides, never by the

        vendor providing it, and carries no free text. `GET /status` is

        unauthenticated, so its body is held to answering whether the API can

        serve. Anything finer, including why a dependency is `down`, is an

        operator concern and is not published here.

        '
      additionalProperties: false
      required:
      - name
      - state
      - required
      - checked_at
      properties:
        name:
          type: string
          description: 'Which capability this is. Stable across versions, so it is safe to

            branch on: the name says what the dependency does, not who provides

            it, so changing a provider does not change the name.

            '
          enum:
          - database
        state:
          $ref: '#/components/schemas/DependencyState'
        required:
          type: boolean
          description: 'Whether the API can serve at all without it. Commune''s own store

            is required, and is currently the only dependency this API has: the

            capabilities behind sending, billing and domain provisioning are

            served by a different deployment and are not reported here. The

            field stays because an optional dependency may be added again, and

            a caller should already be branching on it rather than on the

            length of the list.

            '
        checked_at:
          type: string
          format: date-time
          description: 'When this dependency was last checked. Checks are cached for a few

            seconds, so this is usually a little behind the request. Always

            present, whatever the state.

            '
    RateLimitPolicy:
      type: object
      title: RateLimitPolicy
      description: 'One budget a key is measured against. A request is charged to every

        budget that applies to its operation, and has to pass all of them.

        '
      additionalProperties: false
      required:
      - name
      - limit
      - used
      - remaining
      - window_seconds
      - reset_at
      - description
      properties:
        name:
          type: string
          enum:
          - general
          - audience
          - write
          description: '`general` counts every request made with the key. `audience` counts

            only the operations that return subscriber or recipient email

            addresses. `write` counts only the operations that change

            something. Both of the narrow budgets are tighter than `general`,

            and an operation they apply to is charged to `general` as well and

            has to pass both.


            New budget names may be added in a minor version, so treat one you

            do not recognise as a budget that does not concern you rather than

            as an error.

            '
        limit:
          type: integer
          minimum: 1
          description: Requests this budget allows per window.
        used:
          type: integer
          minimum: 0
          description: 'Requests counted in the current window, including the one that asked.

            '
        remaining:
          type: integer
          minimum: 0
          description: 'Requests left in the current window. Zero means the next request

            charged to this budget answers `429`.

            '
        window_seconds:
          type: integer
          minimum: 1
          description: 'How long a window lasts. A window is anchored to the first request

            that opened it rather than to the clock, so it does not reset on the

            minute.

            '
        reset_at:
          type: string
          format: date-time
          description: 'When this budget''s window resets and `used` returns to zero. The

            same instant `RateLimit-Reset` reports as a number of seconds.

            '
        description:
          type: string
          description: What this budget counts, in one line.
    RateLimit:
      type: object
      title: RateLimit
      description: 'A key''s rate limit state. The top level fields repeat the `general`

        budget, which every request is charged to; `policies` carries every

        budget, which is what a client should read before deciding it has been

        cut off.

        '
      additionalProperties: false
      required:
      - object
      - limit
      - remaining
      - window_seconds
      - reset_at
      - policies
      properties:
        object:
          type: string
          const: rate_limit
          description: Always `rate_limit`.
        limit:
          type: integer
          minimum: 1
          description: The `general` budget's limit, repeated for convenience.
        remaining:
          type: integer
          minimum: 0
          description: Requests left on the `general` budget in this window.
        window_seconds:
          type: integer
          minimum: 1
          description: The `general` budget's window length.
        reset_at:
          type: string
          format: date-time
          description: When the `general` budget's window resets.
        policies:
          type: array
          description: 'Every budget this key is measured against, `general` first. A budget

            that does not apply to any operation the key may call is still

            listed, because what it counts is a property of the API rather than

            of the key.

            '
          items:
            $ref: '#/components/schemas/RateLimitPolicy'
    ServiceStatus:
      type: object
      title: ServiceStatus
      description: 'The service''s own health, the state of what it depends on, and the

        contract version it is currently serving.

        '
      additionalProperties: false
      required:
      - object
      - status
      - version
      - dependencies
      properties:
        object:
          type: string
          const: service_status
          description: Always `service_status`.
        status:
          type: string
          description: 'The whole service in one word, driven by the required dependencies

            alone. `ok` when every required dependency is up, `degraded` when

            one answered slowly or partially, and `down` when one is

            unreachable. A `degraded` service still answers `200` here, because

            the point of this operation is to say so.


            An optional dependency being `down` would not move this: the

            operations that need one refuse individually. There is no optional

            dependency today. Read `dependencies` for the individual states.

            '
          enum:
          - ok
          - degraded
          - down
        version:
          type: string
          minLength: 1
          description: 'The newest contract version this service serves. An opaque

            identifier rather than a date, even though every version published

            so far is one: compare it for equality with the version a request

            resolved to, and do not parse it.


            A request that sends no `Commune-Version` header is not necessarily

            on it: an existing key stays pinned to the version that was current

            when it was issued. Compare the two to find out whether an

            integration has a newer contract available to move to.

            '
          examples:
          - '2026-08-26'
        dependencies:
          type: array
          description: 'Every dependency the API checks, whatever its state. The set is

            fixed by this contract rather than by the deployment, so the list

            is the same length on every response from every environment. Order

            is not meaningful; match on `name` rather than on position, and do

            not assume a length: entries may be added or removed as what this

            API depends on changes.

            '
          items:
            $ref: '#/components/schemas/Dependency'
    Esp:
      type: string
      title: Esp
      description: 'Where a newsletter is published from. `commune` means Commune itself

        sends the email. Every other value is an email service provider whose

        posts Commune imports. `rss` covers any feed that is not one of the

        named providers.

        '
      enum:
      - commune
      - beehiiv
      - buttondown
      - ghost
      - kit
      - mailchimp
      - mailerlite
      - rss
      - substack
    SocialLinks:
      type: object
      title: SocialLinks
      description: 'The creator''s other homes on the internet, stored as canonical profile

        URLs. Every key is optional and a newsletter that set none returns an

        empty object.

        '
      additionalProperties: false
      properties:
        twitter:
          type: string
          format: uri
          description: X or Twitter profile URL.
        bluesky:
          type: string
          format: uri
          description: Bluesky profile URL.
        linkedin:
          type: string
          format: uri
          description: LinkedIn profile URL.
        mastodon:
          type: string
          format: uri
          description: Mastodon profile URL, including the instance host.
        youtube:
          type: string
          format: uri
          description: YouTube channel URL.
        instagram:
          type: string
          format: uri
          description: Instagram profile URL.
        threads:
          type: string
          format: uri
          description: Threads profile URL.
        github:
          type: string
          format: uri
          description: GitHub profile URL.
    Newsletter:
      type: object
      title: Newsletter
      description: 'A newsletter and its public profile. Nothing operational is exposed:

        ESP credentials, OAuth tokens, group and audience ids, feed polling

        state and language detection bookkeeping all stay server side.

        '
      additionalProperties: false
      required:
      - object
      - id
      - handle
      - name
      - esp
      - created_at
      properties:
        object:
          type: string
          const: newsletter
          description: Always `newsletter`.
        id:
          type: string
          format: uuid
          description: Stable identifier.
        handle:
          type: string
          description: 'The short, unique, URL safe name. Resolves the public profile at

            `/n/{handle}` and is accepted anywhere `{newsletter}` is.

            '
          examples:
          - the-weekly
        name:
          type: string
          description: Display name, as the creator writes it.
        description:
          type:
          - string
          - 'null'
          description: 'The profile blurb. Sanitised HTML, not plain text, because creators

            format it. Treat it as untrusted markup and render it in a

            sandboxed context.

            '
        esp:
          $ref: '#/components/schemas/Esp'
        image_url:
          type:
          - string
          - 'null'
          format: uri
          description: Square avatar for the newsletter.
        website_url:
          type:
          - string
          - 'null'
          format: uri
          description: The creator's own site, if they linked one.
        social_links:
          $ref: '#/components/schemas/SocialLinks'
        language:
          type:
          - string
          - 'null'
          description: 'Best known language of the newsletter''s writing as a BCP 47 tag.

            Detected from recent articles rather than declared, so treat it as a

            hint. Null before enough has been published to tell.

            '
          examples:
          - en
        chat_create_permission:
          type: string
          enum:
          - editors
          - subscribers
          - anyone
          description: 'Who may start a new chat thread in this community.

            '
        allow_non_subscriber_chat:
          type: boolean
          description: 'Whether people who have not subscribed may reply in existing

            threads.

            '
        owner:
          description: 'The account that owns the newsletter. A `Ref` unless `owner` is

            named in `?expand=`.

            '
          anyOf:
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/User'
        featured_article:
          description: 'The article the creator pinned to the top of the profile, or `null`

            when none is pinned. A `Ref` unless `featured_article` is named in

            `?expand=`.

            '
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/Article'
        created_at:
          type: string
          format: date-time
          description: When the newsletter was connected to or created on Commune.
        updated_at:
          type: string
          format: date-time
          description: When the profile last changed.
    ArticleStatus:
      type: string
      title: ArticleStatus
      description: 'Where an article is in its life. A credential holding only `read`

        permissions ever sees `sent` and nothing else. An imported article is

        always `sent`, since Commune sees it after the provider delivered it.

        '
      enum:
      - draft
      - scheduled
      - sending
      - sent
      - failed
      - archived
    ArticleStats:
      type: object
      title: ArticleStats
      description: 'Engagement counts for an article, computed at read time. These are

        Commune side counts, not provider side email metrics: opens, clicks and

        deliveries are not here.

        '
      additionalProperties: false
      required:
      - likes
      - comments
      - highlights
      properties:
        likes:
          type: integer
          minimum: 0
          description: How many people liked the article.
        comments:
          type: integer
          minimum: 0
          description: 'Replies in the article''s chat thread. Commune has no separate

            comments store: an article''s discussion is a thread like any other,

            so this counts the undeleted replies hanging off it. `0` when the

            article has no thread.

            '
        highlights:
          type: integer
          minimum: 0
          description: How many passages readers highlighted.
    Article:
      type: object
      title: Article
      description: 'One article of a newsletter, without its body. Every collection of

        articles returns this shape. `GET /articles/{article}` returns

        `ArticleWithContent`, which is this plus `content`.

        '
      required:
      - object
      - id
      - short_id
      - slug
      - newsletter
      - status
      - is_imported
      - created_at
      properties:
        object:
          type: string
          const: article
          description: Always `article`.
        id:
          type: string
          format: uuid
          description: Stable identifier.
        short_id:
          type: string
          description: 'Eight character base62 identifier, unique across Commune. Safe in a

            URL and accepted anywhere `{article}` is.

            '
          examples:
          - k7Rm2xQp
        slug:
          type: string
          description: 'URL segment under the newsletter, unique within it but not across

            Commune. The permalink is `/n/{handle}/a/{slug}`. Falls back to the

            `short_id` for an untitled article.

            '
        newsletter:
          description: 'The newsletter this article belongs to. A `Ref` unless `newsletter` is

            named in `?expand=`.

            '
          oneOf:
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/Newsletter'
        title:
          type:
          - string
          - 'null'
          description: Subject line of the article. Null for an untitled draft.
        preview_text:
          type:
          - string
          - 'null'
          description: 'The short line email clients show after the subject, and what

            Commune uses as the excerpt on a card.

            '
        image_url:
          type:
          - string
          - 'null'
          format: uri
          description: 'Cover image. When the creator set none, Commune stamps the first

            image in the body at send time, so this is usually populated for a

            sent article.

            '
        external_url:
          type:
          - string
          - 'null'
          format: uri
          description: 'The article''s canonical URL on the newsletter''s own provider, for an

            imported article. Null for one written in Commune.

            '
        status:
          $ref: '#/components/schemas/ArticleStatus'
        is_imported:
          type: boolean
          description: '`true` when the article came in from the newsletter''s provider,

            `false` when it was written and sent in Commune.

            '
        posted_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'When the article went out. An article dated in the future is not

            returned by any read operation until that moment passes, so this is

            never ahead of now in a response.

            '
        scheduled_for:
          type:
          - string
          - 'null'
          format: date-time
          description: 'When a queued article may go out. Set while `status` is `scheduled`

            and null otherwise.


            This is not `posted_at` and the difference matters: a queued article

            has no publication date yet, which is why it stays invisible on

            every reader surface until it really goes out. Commune dispatches

            in passes, so this is the moment from which the article may go rather

            than the moment it will.

            '
        authors:
          type: array
          description: 'The byline, in order. Each entry is a `Ref` unless `authors` is

            named in `?expand=`. Empty when no Commune account is credited.

            '
          items:
            anyOf:
            - $ref: '#/components/schemas/Ref'
            - $ref: '#/components/schemas/User'
        thread:
          description: 'The chat thread this article opened, where its discussion lives.

            `null` when the newsletter does not open a thread per article. A `Ref`

            unless `thread` is named in `?expand=`.

            '
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/Thread'
        stats:
          $ref: '#/components/schemas/ArticleStats'
        created_at:
          type: string
          format: date-time
          description: When the row was created in Commune.
        updated_at:
          type: string
          format: date-time
          description: When the article was last edited.
    ArticleWithContent:
      title: ArticleWithContent
      description: 'An article including its rendered body. Returned only by

        `GET /articles/{article}`. `content` cannot be requested on any list,

        including through `?fields=`.

        '
      allOf:
      - $ref: '#/components/schemas/Article'
      - type: object
        required:
        - content
        properties:
          content:
            type: string
            description: 'The body as HTML. For an article written in Commune this is the

              email rendered for the web, with personalization placeholders

              resolved against an empty context so no raw merge tag is ever

              served. For an imported article it is what the provider published.


              Treat it as untrusted markup from a third party and render it in

              a sandboxed context.

              '
          content_markdown:
            type:
            - string
            - 'null'
            description: 'The same body as Markdown, present only when `content` is named

              in `?expand=`. It is what a model should read: the HTML is

              mostly markup it will not use, and one article body can fill a

              context window on its own.


              It is a conversion of the body rather than of the HTML above.

              For an article written in Commune it comes from the document the

              author wrote, so a code block keeps its language and a table

              that declares a header becomes a Markdown table. For an

              imported article it comes from the provider''s HTML. Either way

              the words, the links, the images, the lists, the code and the

              quotes survive, and everything presentational does not.


              `null` means Commune holds no body it can convert faithfully.

              That happens when the only body it stored is a rendered email,

              whose words cannot be told apart from its layout. An empty

              string means the article has no body, which is different.


              No merge tag ever appears here, resolved or not.

              '
      unevaluatedProperties: false
    ArticleBodyMarkdown:
      type: string
      title: ArticleBodyMarkdown
      description: 'An article''s text, as Markdown. Create an article documents the

        Markdown Commune accepts.

        '
      examples:
      - '# What we learned in March


        Three things, and the **third** one surprised us.


        <Button href="https://example.com/read" alignment="center">Read the full piece</Button>


        <EmailOnly>

        [Unsubscribe]({{ unsubscribe_url }}) | {{ address }}

        </EmailOnly>

        '
    ThreadCreateRequest:
      type: object
      title: ThreadCreateRequest
      description: A new thread in a newsletter's community.
      additionalProperties: false
      anyOf:
      - required:
        - content
      - required:
        - media
      properties:
        content:
          type: string
          maxLength: 5000
          description: 'The opening message, as Markdown. Surrounding whitespace is trimmed.

            Optional when `media` attaches something: a post needs text,

            attachments, or both.

            '
        visibility:
          type: string
          enum:
          - subscribers
          - public
          default: subscribers
          description: '`subscribers` keeps the thread inside the newsletter. `public` also

            puts it on Commune''s global feed.

            '
        media:
          type: array
          maxItems: 10
          description: Images or videos to attach, by URL.
          items:
            $ref: '#/components/schemas/MediaCreateRequest'
    MessageCreateRequest:
      type: object
      title: MessageCreateRequest
      description: A reply in a thread.
      additionalProperties: false
      anyOf:
      - required:
        - content
      - required:
        - media
      properties:
        content:
          type: string
          maxLength: 5000
          description: 'The reply, as Markdown. Surrounding whitespace is trimmed.

            Optional when `media` attaches something: a post needs text,

            attachments, or both.

            '
        parent:
          type: string
          description: 'The reply this answers, by `id` or `short_id`. Leave it out to

            reply to the thread itself. It has to be a direct reply to this

            thread.

            '
        quoted:
          type: string
          description: 'The thread or a message in it to quote, by `id` or `short_id`.

            '
        media:
          type: array
          maxItems: 10
          description: Images or videos to attach, by URL.
          items:
            $ref: '#/components/schemas/MediaCreateRequest'
    MediaCreateRequest:
      type: object
      title: MediaCreateRequest
      description: 'An attachment, by URL. Commune does not copy it: the URL is shown as

        given, so it has to stay reachable.

        '
      additionalProperties: false
      required:
      - url
      properties:
        url:
          type: string
          format: uri
          maxLength: 2000
          description: Where the attachment is served from. `http` or `https`.
        type:
          type: string
          enum:
          - image
          - video
          description: 'What it is. Leave it out and Commune decides from the URL''s

            extension: `.mp4`, `.webm` and `.mov` are videos, anything else an

            image.

            '
        alt:
          type: string
          maxLength: 500
          description: A description for people who cannot see it.
    ArticleCreateRequest:
      type: object
      title: ArticleCreateRequest
      description: 'A new article. Every property is optional: `{}` creates an empty

        untitled draft.


        What is created is always a **draft**. There is no `status` here, no

        `posted_at` and no `scheduled_for`: an article reaches anybody through

        Schedule an article (`POST /articles/{article}/schedule`) or

        Send an article to the list (`POST /articles/{article}/send`), both of which run the gates

        that keep a non-compliant article out of an inbox.

        '
      additionalProperties: false
      properties:
        title:
          type:
          - string
          - 'null'
          maxLength: 300
          description: 'The subject line. Null or absent leaves the article untitled, which

            is legal: a draft is often started before it is named.

            '
        preview_text:
          type:
          - string
          - 'null'
          maxLength: 500
          description: 'The short line email clients show after the subject.

            '
        image_url:
          type:
          - string
          - 'null'
          format: uri
          maxLength: 2000
          description: 'The cover image. Leave it out and Commune stamps the first image in

            the body when the article is sent.

            '
        slug:
          type: string
          maxLength: 60
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          description: 'The article''s URL segment, unique within the newsletter. Lowercase

            letters, digits and single hyphens.


            Leave it out and Commune derives one from the title, adding a

            numeric suffix if that one is taken. An untitled article falls back to

            its `short_id`. A slug you choose yourself is never renamed for you:

            one that is already taken answers `422` rather than quietly becoming

            something else, because a permalink you did not choose is worse than

            an error you can act on.

            '
        content_markdown:
          $ref: '#/components/schemas/ArticleBodyMarkdown'
      examples:
      - title: What we learned in March
        preview_text: The third one surprised us.
        content_markdown: '# What we learned in March


          Three things, and the **third** one surprised us.


          <EmailOnly>

          [Unsubscribe]({{ unsubscribe_url }}) | {{ address }}

          </EmailOnly>

          '
    ArticleUpdateRequest:
      type: object
      title: ArticleUpdateRequest
      description: 'The properties of an article to change. Send at least one; an empty object

        answers `400` rather than doing nothing.


        **Absent and null are different.** A property you leave out is left

        alone. A property you send as `null` is cleared. An empty string is the

        same as null, because a title that is present and empty reads as a

        missing one everywhere it is shown.


        `slug` is the exception: it can be changed but not cleared, since every

        article has to have one.


        This never moves the article''s state and never changes its byline. The

        state moves through `POST /articles/{article}/schedule`,

        `/unschedule` and `/send`; the byline is not in this contract.

        '
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type:
          - string
          - 'null'
          maxLength: 300
          description: The subject line. Null clears it.
        preview_text:
          type:
          - string
          - 'null'
          maxLength: 500
          description: 'The short line email clients show after the subject. Null clears it.

            '
        image_url:
          type:
          - string
          - 'null'
          format: uri
          maxLength: 2000
          description: The cover image. Null clears it.
        slug:
          type: string
          maxLength: 60
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          description: 'The article''s URL segment. Changing it moves the article''s permalink,

            and nothing forwards the old one, so change it knowing that.


            It is not re-derived when you change the title. A slug that already

            belongs to another article of this newsletter answers `422`.

            '
        content_markdown:
          $ref: '#/components/schemas/ArticleBodyMarkdown'
      examples:
      - title: What we learned in March, revisited
      - image_url: null
    ArticleImageRequest:
      type: object
      title: ArticleImageRequest
      description: 'Exactly one of `source_url` or `content_type`.

        '
      additionalProperties: false
      properties:
        source_url:
          type: string
          format: uri
          maxLength: 2000
          description: 'A public http or https URL of the image for Commune to download

            and store.

            '
          examples:
          - https://example.com/chart.png
        content_type:
          type: string
          enum:
          - image/jpeg
          - image/png
          - image/webp
          - image/gif
          description: 'The type of the file you will upload yourself. The answer carries

            the upload URL.

            '
      examples:
      - source_url: https://example.com/chart.png
      - content_type: image/png
    ArticleImage:
      type: object
      title: ArticleImage
      description: 'An image stored for an article, at a URL that does not change. The

        article does not show it until its URL is in the body or `image_url`.

        '
      additionalProperties: false
      required:
      - object
      - url
      - content_type
      - size_bytes
      - source_url
      - upload
      properties:
        object:
          type: string
          const: article_image
          description: Always `article_image`.
        url:
          type: string
          format: uri
          description: 'Where the image is served. Use it in the article''s Markdown or as

            its `image_url`. For an upload, it answers `404` until the file is

            uploaded.

            '
        content_type:
          type: string
          enum:
          - image/jpeg
          - image/png
          - image/webp
          - image/gif
          description: 'The image''s type. For a download, read from the bytes themselves,

            whatever the source said.

            '
        size_bytes:
          type:
          - integer
          - 'null'
          minimum: 1
          description: 'How large the stored image is. Null for an upload, whose size is

            not known until the file arrives.

            '
        source_url:
          type:
          - string
          - 'null'
          description: The URL the image was downloaded from. Null for an upload.
        upload:
          description: 'Where to send the file, when the request named a `content_type`.

            Null when the image was downloaded.

            '
          oneOf:
          - $ref: '#/components/schemas/ArticleImageUpload'
          - type: 'null'
    ArticleImageUpload:
      type: object
      title: ArticleImageUpload
      description: 'A one-time upload. Send the file''s bytes as the request body, with

        these headers, before it expires; for example

        `curl -X PUT -H "Content-Type: image/png" --data-binary @chart.png "<url>"`.

        '
      additionalProperties: false
      required:
      - url
      - method
      - headers
      - max_bytes
      - expires_at
      properties:
        url:
          type: string
          format: uri
          description: Where to send the file. It works once.
        method:
          type: string
          const: PUT
          description: Always `PUT`.
        headers:
          type: object
          description: The headers the upload has to carry.
          additionalProperties:
            type: string
        max_bytes:
          type: integer
          description: The largest file the upload accepts.
        expires_at:
          type: string
          format: date-time
          description: When the upload URL stops working.
    TestSendRequest:
      type: object
      title: TestSendRequest
      description: 'Where a test copy of an article goes. Empty, or no body at all, sends

        it to the person the credential belongs to.

        '
      additionalProperties: false
      properties:
        to:
          type: array
          description: 'The addresses to send the test to. Leave it out to send it to

            yourself. A repeated address is sent to once. Five at most, because

            this is a look before you send rather than a way to reach a group.

            '
          minItems: 1
          maxItems: 5
          items:
            type: string
            format: email
          examples:
          - - editor@example.com
            - proofreader@example.com
    TestSend:
      type: object
      title: TestSend
      description: 'What one test send attempted and what the sending provider accepted.

        Nothing about the article changed and nobody on the list was touched.

        '
      additionalProperties: false
      required:
      - object
      - article
      - recipients
      - sent_to_owner
      - sent
      - failed
      properties:
        object:
          type: string
          const: test_send
          description: Always `test_send`.
        article:
          description: 'The article a copy of which was sent. Always a `Ref`: a test changes

            nothing about the article, so there is nothing on it to read back.

            '
          $ref: '#/components/schemas/Ref'
        recipients:
          type: array
          description: 'Where the test went, deduplicated and in the order given. These are

            the addresses sent in the request; Commune adds none and reveals

            none, so this is empty when the copy went to the credential''s

            owner.

            '
          items:
            type: string
            format: email
        sent_to_owner:
          type: boolean
          description: 'True when the request named no addresses and the copy went to the

            person the credential belongs to, whose address is not echoed.

            '
        sent:
          type: integer
          minimum: 0
          description: How many of them the sending provider accepted.
        failed:
          type: integer
          minimum: 0
          description: 'How many it refused. `sent` plus `failed` is always the number of

            `recipients`, or one when `sent_to_owner` is true. A test where

            every address failed answers `502` rather than this shape.

            '
    ScheduleRequest:
      type: object
      title: ScheduleRequest
      description: 'When an article should go out.

        '
      additionalProperties: false
      required:
      - scheduled_for
      properties:
        scheduled_for:
          type: string
          format: date-time
          description: 'The moment from which the article may go out. Has to be in the

            future. Commune dispatches queued articles in passes, so this is the

            earliest it will go rather than the exact moment it does.

            '
          examples:
          - '2026-10-01T09:00:00Z'
        acknowledge_broken_images:
          type: boolean
          default: false
          description: 'Schedule even though an image in the body will not load. See the

            same field on the send operation for what this acknowledges and how

            long it lasts.

            '
    SendRequest:
      type: object
      title: SendRequest
      description: 'Options for a send. Every field is optional, and sending no body at all

        is the ordinary case.

        '
      additionalProperties: false
      properties:
        acknowledge_broken_images:
          type: boolean
          default: false
          description: 'Send even though an image in the body will not load for a reader.


            Without this, an image Commune could definitively not fetch refuses

            the send. With it, the send proceeds and the acknowledgement is

            recorded against the article as it currently reads, so the dispatch

            that happens a few minutes later honours the same decision. Any

            edit to the body clears it, which keeps it scoped to the images

            that were actually looked at.


            It does not suppress anything else. An unreadable image is still

            reported on the article, and the footer gate is not escapable at all.

            '
    DnsRecord:
      type: object
      title: DnsRecord
      description: 'A record the creator has to publish in their own DNS before Commune can

        send from an address or serve a domain. These are public by nature: they

        end up in a zone anyone can query.

        '
      additionalProperties: false
      required:
      - type
      - name
      - value
      properties:
        type:
          type: string
          description: The record type.
          examples:
          - CNAME
        name:
          type: string
          description: The host the record goes on.
          examples:
          - mail._domainkey.example.org
        value:
          type: string
          description: What the record must resolve to.
        priority:
          type:
          - integer
          - 'null'
          description: Priority, for a record type that takes one. Null otherwise.
        status:
          type:
          - string
          - 'null'
          description: 'What Commune last observed for this record, when it checked it

            individually. Null when only the address as a whole was checked.

            '
    SenderKind:
      type: string
      title: SenderKind
      description: '`commune` is an address Commune provisioned on a domain it owns, which

        works without the creator touching DNS. `custom` is an address on the

        creator''s own domain, which does not work until they publish the

        records.

        '
      enum:
      - commune
      - custom
    SenderVerificationStatus:
      type: string
      title: SenderVerificationStatus
      description: 'How far along the address is. Only `verified` can send. `provisioning`

        means Commune is still setting it up and the creator has nothing to do

        yet.

        '
      enum:
      - provisioning
      - pending
      - verified
      - failed
    Sender:
      type: object
      title: Sender
      description: 'An address a newsletter sends from. Nothing about the underlying email

        infrastructure is exposed: the provider''s own identifiers for the domain

        stay server side, because they are an implementation detail Commune

        reserves the right to change.

        '
      additionalProperties: false
      required:
      - object
      - id
      - newsletter
      - kind
      - from_email
      - verification_status
      - is_default
      - created_at
      properties:
        object:
          type: string
          const: sender
          description: Always `sender`.
        id:
          type: string
          format: uuid
          description: Stable identifier.
        newsletter:
          description: 'The newsletter that sends from this address. A `Ref` unless

            `newsletter` is named in `?expand=`.

            '
          oneOf:
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/Newsletter'
        kind:
          $ref: '#/components/schemas/SenderKind'
        from_email:
          type: string
          format: email
          description: The full address articles are sent from.
        from_name:
          type:
          - string
          - 'null'
          description: The display name shown beside the address in an inbox.
        reply_to_email:
          type:
          - string
          - 'null'
          format: email
          description: 'Where replies go, when the creator wants them somewhere other than

            `from_email`.

            '
        domain:
          type: string
          description: The domain part of the address.
        local_part:
          type: string
          description: The part before the at sign.
        verification_status:
          $ref: '#/components/schemas/SenderVerificationStatus'
        verification_records:
          type: array
          description: 'The DNS records the creator must publish. Empty for a `commune`

            address, where Commune owns the domain and has already done it.

            '
          items:
            $ref: '#/components/schemas/DnsRecord'
        verification_error:
          type:
          - string
          - 'null'
          description: 'Why verification last failed, in a form the creator can act on. Null

            when it has not failed.

            '
        is_default:
          type: boolean
          description: 'Whether this is the address the newsletter sends from unless told

            otherwise. Exactly one address per newsletter has this.

            '
        verified_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the address was first verified. Null if it never was.
        last_checked_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'When Commune last looked at the DNS. Verification is re checked on a

            schedule, so this moves without the creator doing anything.

            '
        created_at:
          type: string
          format: date-time
          description: When the address was added.
        updated_at:
          type: string
          format: date-time
          description: When the row last changed.
    DomainVerificationStatus:
      type: string
      title: DomainVerificationStatus
      description: 'Whether ownership of the domain was proved and a certificate issued.

        `active` does not by itself mean the site is reachable, see

        `routing_ok`.

        '
      enum:
      - pending
      - active
      - failed
    Domain:
      type: object
      title: Domain
      description: 'A creator''s own domain serving their Commune site. The certificate

        provider''s internal identifier for it is not exposed.

        '
      additionalProperties: false
      required:
      - object
      - id
      - newsletter
      - domain
      - verification_status
      - created_at
      properties:
        object:
          type: string
          const: domain
          description: Always `domain`.
        id:
          type: string
          format: uuid
          description: Stable identifier.
        newsletter:
          description: 'The newsletter the domain serves. A `Ref` unless `newsletter` is

            named in `?expand=`.

            '
          oneOf:
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/Newsletter'
        domain:
          type: string
          description: The hostname, unique across Commune.
          examples:
          - blog.example.org
        verification_status:
          $ref: '#/components/schemas/DomainVerificationStatus'
        ssl_status:
          type:
          - string
          - 'null'
          description: 'Where the certificate stands, as reported by the provider that

            issues it. Free text rather than an enum, because the vocabulary is

            the provider''s and Commune passes it through.

            '
        dns_target:
          type:
          - string
          - 'null'
          description: What the creator must point the hostname at.
        verification_records:
          type: array
          description: The records the creator must publish to prove ownership.
          items:
            $ref: '#/components/schemas/DnsRecord'
        verification_error:
          type:
          - string
          - 'null'
          description: Why verification last failed. Null when it has not failed.
        routing_ok:
          type:
          - boolean
          - 'null'
          description: 'Whether the domain actually resolves to Commune, from an end to end

            request rather than from certificate state. Null before the first

            probe. This is the field that catches a domain whose certificate is

            fine but whose DNS points somewhere else.

            '
        routing_checked_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When that probe last ran.
        verified_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When ownership was first proved. Null if it never was.
        last_checked_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When Commune last reconciled the domain with its provider.
        created_at:
          type: string
          format: date-time
          description: When the domain was added.
    Destination:
      type: object
      title: Destination
      description: 'One place a newsletter''s published events are delivered to.


        **Nothing a destination authenticates with is on this shape**, and

        neither is its full configuration, which for an HTTPS endpoint can

        include request headers holding an API key. `target` is what this shape

        carries in their place, and the portal is where the person who set the

        destination up can read the rest.

        '
      additionalProperties: false
      required:
      - object
      - id
      - newsletter
      - type
      - topics
      - enabled
      - created_at
      properties:
        object:
          type: string
          const: destination
          description: Always `destination`.
        id:
          type: string
          description: 'The delivery service''s identifier for this destination. Opaque, and

            not a UUID: it is minted on the other side of the portal and is the

            value that identifies the same destination there.

            '
        newsletter:
          description: 'The newsletter whose events go here. A `Ref` unless `newsletter` is

            named in `?expand=`.

            '
          oneOf:
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/Newsletter'
        type:
          type: string
          description: 'What kind of target this is. `webhook` is an HTTPS endpoint and is

            the common case; the rest are queues, streams and object stores, for

            a consumer that would rather not run a web server.


            Free text rather than an enumeration, because the vocabulary belongs

            to the delivery service and grows there. Treat an unrecognised value

            as a destination this client does not know how to describe, never as

            an error.

            '
          examples:
          - webhook
        target:
          type:
          - string
          - 'null'
          description: 'A short, human readable summary of where this destination points:

            the host of an endpoint, or the name of a queue, stream or bucket.

            Enough to tell two destinations apart in a list, and never a full

            URL, because a URL can carry a token in its query string.

            '
          examples:
          - hooks.example.org
        topics:
          type: array
          description: 'The event types delivered here, by name, matching the keys of the

            `webhooks` block of this document. A single entry of `*` means every

            topic, including ones added after the destination was created.

            '
          items:
            type: string
          examples:
          - - article.published
            - subscriber.created
          - - '*'
        enabled:
          type: boolean
          description: 'Whether this destination is receiving events. The same fact as

            `disabled_at` being null, stated as the boolean a caller actually

            wants, and derived from it so the two cannot disagree.

            '
        disabled_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'When delivery to this destination was switched off. Null while it is

            enabled. A disabled destination is skipped rather than queued, so

            events published while it is off are not delivered when it comes

            back on.

            '
        created_at:
          type: string
          format: date-time
          description: When the destination was added.
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When it was last changed. Null if it never has been.
    DeliveryAttemptStatus:
      type: string
      title: DeliveryAttemptStatus
      description: 'How one attempt ended. `succeeded` is a 2xx from the destination.

        `failed` is anything else, including no answer at all, and is not

        final: the delivery service retries on its own.

        '
      enum:
      - succeeded
      - failed
    DeliveryAttempt:
      type: object
      title: DeliveryAttempt
      description: 'One handover of one event to one destination, and what came of it.


        A record of something that happened rather than a thing with a state:

        it never changes after it is written, and a retry is a second

        `DeliveryAttempt` with a higher `attempt` rather than an edit to this

        one.


        **Two fields a reader might expect are not here.** The body your

        endpoint answered with is never returned, since a refusing endpoint

        routinely writes the request back into its own response, credentials

        included. Neither is the event''s payload: several topics carry a

        subscriber''s email address, and returning it here would make every read

        of this log a read of audience data. `event_id` names the event,

        `event_type` says which

        topic it was, and `response_status` says what the endpoint answered.

        '
      additionalProperties: false
      required:
      - object
      - id
      - newsletter
      - destination
      - event_id
      - event_type
      - status
      - response_status
      - failure
      - attempt
      - manual
      - created_at
      properties:
        object:
          type: string
          const: delivery_attempt
          description: Always `delivery_attempt`.
        id:
          type: string
          description: 'The delivery service''s identifier for this attempt. Opaque, and not

            a UUID: it is minted on the other side of the handover.

            '
        newsletter:
          description: 'The newsletter whose event this was. A `Ref` unless `newsletter` is

            named in `?expand=`.

            '
          oneOf:
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/Newsletter'
        destination:
          allOf:
          - $ref: '#/components/schemas/Ref'
          description: 'Where this was delivered. Always a `Ref`, whose `id` matches a row

            from `GET /newsletters/{newsletter}/destinations`. A destination

            deleted since the attempt was made still appears here, because the

            attempt happened; it will not be in that list any more.

            '
        destination_type:
          type: string
          description: 'What kind of target it was, as the delivery service named it at the

            time. Free text for the same reason `Destination.type` is: the

            vocabulary belongs to the delivery service and grows there.

            '
          examples:
          - webhook
        event_id:
          type: string
          description: 'The event that was being delivered, by the `id` on its envelope.

            The same string the consumer receives in the `Commune-Event-Id`

            header, which makes it the one identifier both sides share and the

            thing worth logging on yours.

            '
        event_type:
          type:
          - string
          - 'null'
          description: 'The topic, matching the keys of the `webhooks` block of this

            document. Null only if the delivery service no longer holds the

            event this attempt belonged to.

            '
          examples:
          - article.published
        status:
          allOf:
          - $ref: '#/components/schemas/DeliveryAttemptStatus'
          description: How this attempt ended.
        response_status:
          type:
          - integer
          - 'null'
          description: 'The HTTP status the destination answered with. Null when it did not

            answer at all, in which case `failure` says why.

            '
          examples:
          - 200
          - 500
        failure:
          type:
          - string
          - 'null'
          description: 'Why there was no answer, when there was none: `timeout` is the

            common one. Null whenever `response_status` is set, and the two are

            never both set or both null. Free text, so treat an unrecognised

            value as a reason this client does not know how to describe.

            '
          examples:
          - timeout
        attempt:
          type: integer
          minimum: 1
          description: '1 on the first delivery of this event to this destination, and one

            higher on each retry of it. The number the

            `Commune-Delivery-Attempt` header would carry if it were sent.

            '
        manual:
          type: boolean
          description: 'Whether somebody asked for this attempt rather than the delivery

            service making it on its own. True for one made by

            `POST /delivery-attempts/{attempt}/replay` or by the retry button in

            the portal, and false for a first delivery or an automatic retry.

            '
        created_at:
          type: string
          format: date-time
          description: When the attempt was made.
    DeliveryReplay:
      type: object
      title: DeliveryReplay
      description: 'The acknowledgement that a replay was accepted.


        Not an attempt: the attempt this produces does not exist yet when the

        response is written. What it carries is enough to find that attempt once

        it appears, by reading the delivery log filtered to the same event.

        '
      additionalProperties: false
      required:
      - object
      - attempt
      - event_id
      - destination
      properties:
        object:
          type: string
          const: delivery_replay
          description: Always `delivery_replay`.
        attempt:
          allOf:
          - $ref: '#/components/schemas/Ref'
          description: 'The attempt that was replayed, not the one this makes. Always a

            `Ref`, and it is unchanged: it is a record of a delivery that

            already happened.

            '
        event_id:
          type: string
          description: 'The event being delivered again. Filter the delivery attempt log by

            it to find the new attempt once the delivery service has made it.

            '
        destination:
          allOf:
          - $ref: '#/components/schemas/Ref'
          description: Where it is being delivered again. Always a `Ref`.
    PortalSession:
      type: object
      title: PortalSession
      description: 'A link into the delivery portal, and the moment it stops working.


        Not a resource: it has no identifier, nothing addresses it, and it

        cannot be fetched again. It is a credential that was minted for one

        person to follow once, and the only copy of it is the one in this

        response.

        '
      additionalProperties: false
      required:
      - object
      - url
      - expires_at
      properties:
        object:
          type: string
          const: portal_session
          description: Always `portal_session`.
        url:
          type: string
          format: uri
          description: 'Where to send the creator. The token in the query string is a bearer

            credential scoped to this newsletter, so treat the whole URL as one:

            redirect, do not store, do not log, and mint another when another is

            needed.

            '
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'When the credential in `url` stops being accepted. Advisory, and

            null when the delivery service did not say: it is there so a caller

            can decide whether a link it is holding is still worth following,

            and never something to schedule against.

            '
    MeteredFeature:
      type: string
      title: MeteredFeature
      description: 'Something in this API that can be put behind a plan. There are two:

        reads are free, with one exception.


        `writes` covers every operation that changes something. `insights`

        covers the engagement and metrics reads, which are the only reads

        Commune reserves the right to meter.


        New members may be added in a minor version. Treat one you do not

        recognise as a capability that does not concern you, the same way an

        unrecognised `ErrorCode` or rate limit budget name is treated.

        '
      enum:
      - insights
      - writes
    Entitlement:
      type: object
      title: Entitlement
      description: 'One capability, and whether this newsletter''s key has it.


        `granted` answers "will my next call work". `included` answers "does

        this plan carry the capability at all". They differ only while Commune

        is not charging for the feature, which is what `metered` reports.

        '
      additionalProperties: false
      required:
      - object
      - feature
      - granted
      - included
      - metered
      - plans
      - reason
      properties:
        object:
          type: string
          const: entitlement
          description: Always `entitlement`.
        feature:
          $ref: '#/components/schemas/MeteredFeature'
        granted:
          type: boolean
          description: 'Whether a call needing this capability would be allowed right now.

            This is the field to branch on. `false` means the same call answers

            `402`, with `reason` as its message.

            '
        included:
          type: boolean
          description: 'Whether the newsletter''s plan carries the capability, whether or not

            Commune is charging for it yet. `granted` without `included` is a

            capability that works today and would stop working the day metering

            is switched on, which is the case worth warning a creator about.

            '
        metered:
          type: boolean
          description: 'Whether Commune charges for this capability right now.

            '
        plans:
          type: array
          description: 'The plans that include this capability. The same list a `402`

            carries in `allowed_values`.

            '
          items:
            type: string
        reason:
          type:
          - string
          - 'null'
          description: 'Why a call would be refused, word for word as the `402` would say

            it: what the capability is, the plan this newsletter is on, the

            plans that would work, and what stays free. Null when `granted`.

            '
    Entitlements:
      type: object
      title: Entitlements
      description: 'What this newsletter''s plan includes, and what a key bound to it may

        call. Read it before the first write of a reconciliation rather than

        after the `402` that stops one halfway.

        '
      additionalProperties: false
      required:
      - object
      - newsletter
      - plan
      - status
      - api_access
      properties:
        object:
          type: string
          const: entitlements
          description: Always `entitlements`.
        newsletter:
          description: 'The newsletter this describes, which is always the one the key is

            bound to. A `Ref` unless `newsletter` is named in `?expand=`.

            '
          oneOf:
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/Newsletter'
        plan:
          type:
          - string
          - 'null'
          description: 'The Commune plan this newsletter is on, or null when it has none on

            record. Most newsletters connected to an outside provider have

            none, which is not an error and is why this is nullable rather than

            absent.


            Not an enum. Plan names are a commercial decision that moves faster

            than a contract version, and a client that switched on this value

            would break on the next one Commune offers. What to branch on is

            `api_access`, which answers the question a plan name is a proxy for.

            '
        status:
          type:
          - string
          - 'null'
          description: 'The state of the newsletter''s subscription, or null alongside a null

            `plan`. Also not an enum, for the same reason. A subscription whose

            payment is merely late still carries every capability its plan does,

            so do not infer a refusal from this field: read `granted`.

            '
        api_access:
          type: array
          description: 'One entry per capability this API can meter, so the set is the

            `MeteredFeature` enum and nothing else. It is a list rather than a

            map keyed by feature so that a client that does not recognise a

            member can skip it without the shape changing.

            '
          items:
            $ref: '#/components/schemas/Entitlement'
    PermissionLevel:
      type: string
      title: PermissionLevel
      description: 'How much of one family a credential holds on one newsletter.


        `none` is no access at all. `read` reads that part of the newsletter as

        it has been published. `write` adds changing it, and with it the

        newsletter as it is being made: a credential that can change something

        about a newsletter also sees its drafts, its scheduled articles and the

        threads addressed to one segment, because those are unpublished rather

        than secret and the people who may see them are the people who may

        change them.


        `write` implies `read` **within its own family and nowhere else**.

        There is no hierarchy across families: `content: write` is no claim at

        all on `audience`.

        '
      enum:
      - none
      - read
      - write
    NewsletterPermissions:
      type: object
      title: NewsletterPermissions
      description: 'What a credential may do on one newsletter, family by family.


        Every family is always present, so a client never has to decide what an

        absent one means. What a credential holds is granted per newsletter, so

        the same credential can carry different permissions on each of the

        newsletters it reaches.


        These are what was **granted**. What a credential can actually do is

        that intersected with what the person it belongs to can do on the

        newsletter at the moment of the request, which moves when a team does:

        a grant is a ceiling and never an independent authority. Demote its

        holder from admin to editor and the credential narrows on its next

        request, with nothing to revoke and nothing to wait for. A `403` says

        which of the two refused.

        '
      additionalProperties: false
      required:
      - content
      - audience
      - sending
      - insights
      - settings
      - webhooks
      properties:
        content:
          allOf:
          - $ref: '#/components/schemas/PermissionLevel'
          description: Articles, the passages readers marked in them, threads and messages.
        audience:
          allOf:
          - $ref: '#/components/schemas/PermissionLevel'
          description: Subscribers, the segments they are in, and the community roster. The one family
            whose rows carry email addresses.
        sending:
          allOf:
          - $ref: '#/components/schemas/PermissionLevel'
          description: Sending an article, the addresses it goes out from, the domains behind them, and
            the log of what was delivered where.
        insights:
          allOf:
          - $ref: '#/components/schemas/PermissionLevel'
          description: Engagement scores, events and the computed metrics over them.
        settings:
          allOf:
          - $ref: '#/components/schemas/PermissionLevel'
          description: The newsletter's configuration, its team and its credentials. Reading the credential
            list is the first half of turning one off, so the credential operations need `write` here
            rather than `read`.
        webhooks:
          allOf:
          - $ref: '#/components/schemas/PermissionLevel'
          description: Event destinations and the portal session that edits them.
    ApiKey:
      type: object
      title: ApiKey
      description: 'A credential, as it can be described without its secret.


        The secret is not here and no parameter brings it back. Commune stores a

        digest of it and shows the plaintext once, to the person who minted it;

        after that only `key_prefix` survives. Use this object to recognise a

        key, see whether anything is still calling with it, and turn it off.


        **A key belongs to a person, not to a newsletter.** It carries a list of

        the newsletters that person granted it, each with its own permissions,

        and what it can actually reach is that list intersected with what its

        owner can do on each of them at the moment of the request. So a key

        loses a newsletter the day its owner leaves that team, with nothing to

        revoke, and reaches nothing once the account behind it is gone.


        A key can also be granted **every newsletter its owner runs**, now and

        in future, rather than a named list. Such a key appears on the list of

        each newsletter it reaches.


        This object describes the key **as it stands on one newsletter**:

        `newsletter` is the one the grant being read belongs to, and

        `permissions` is what that grant carries. Reading the same key through

        another newsletter''s list reports that newsletter and its own

        permissions, which may be different.

        '
      additionalProperties: false
      required:
      - object
      - id
      - newsletter
      - name
      - key_prefix
      - permissions
      - pinned_version
      - live
      - revoked
      - self
      - created_at
      properties:
        object:
          type: string
          const: api_key
          description: Always `api_key`.
        id:
          type: string
          format: uuid
          description: 'Stable identifier. This is what addresses the key in a path; the

            secret never appears in a URL and never will.

            '
        newsletter:
          description: 'The newsletter this projection describes: the one whose grant

            `permissions` was read from. A key may hold several, so this is not

            "the key''s newsletter" but the one it is being listed under. A `Ref`

            unless `newsletter` is named in `?expand=`.

            '
          oneOf:
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/Newsletter'
        name:
          type: string
          description: 'What the creator called it when they minted it. Not unique: two

            keys called `staging` are a creator''s problem and not an error.

            '
        key_prefix:
          type: string
          description: 'The leading fifteen characters of the secret, which is all of it

            that Commune keeps. Enough to recognise which key an integration is

            configured with, and short enough that it is not itself usable.

            '
          examples:
          - cmn_sk_7Qd2xLpA
        permissions:
          allOf:
          - $ref: '#/components/schemas/NewsletterPermissions'
          description: 'What this key was granted **on the newsletter above**. Six families,

            each `none`, `read` or `write`.


            A key can be granted more than one newsletter and can carry

            different permissions on each, so this is the grant for the

            newsletter this row is being served under and not a property of the

            key on its own. An operation this key does not hold the family for

            answers `403` naming the family and the level it needed.

            '
        pinned_version:
          type: string
          format: date
          description: 'The contract version a request made with this key resolves to when

            it sends no `Commune-Version` header. Stamped when the key was

            minted, so a newer contract shipping does not move an existing

            integration.

            '
          examples:
          - '2026-08-26'
        live:
          type: boolean
          description: 'Whether a request made with this key right now would be

            authenticated. False once it has been revoked, and false once it

            has expired. Computed against Commune''s own clock with the same

            test the authentication path applies, so it is a more reliable

            answer than comparing `expires_at` to a client''s clock.

            '
        revoked:
          type: boolean
          description: 'Whether somebody turned this key off. A revoked key never becomes

            live again: nothing in this API can revive one.

            '
        revoked_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'When it was turned off, or null while it is not. A second

            revocation does not move it.

            '
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'When the key stops working on its own, or null for one that never

            does. Expiry and revocation are separate: an expired key has not

            been revoked and reports `revoked` false.

            '
        last_used_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'The last time a request was authenticated with this key, or null if

            none ever has been. Written at most once a minute, so it is

            accurate to the minute rather than to the request, which is the

            resolution the question behind it needs: is anything still calling

            with this, and can it be revoked.

            '
        self:
          type: boolean
          description: 'True for the one key the current request was made with, and false

            for every other. A caller holds a secret rather than an id, so this

            is the only way it can tell which of these rows is itself, which is

            what it needs before revoking any of them. False on every row for a

            request made with an OAuth access token, since no key is that

            credential.

            '
        created_by:
          description: 'The team member who minted it, or null if that account has since

            been removed. The key belongs to the newsletter rather than to the

            person, so it keeps working either way. A `Ref` unless `created_by`

            is named in `?expand=`.

            '
          anyOf:
          - type: 'null'
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/User'
        created_at:
          type: string
          format: date-time
          description: When the key was minted.
    SearchResultType:
      type: string
      title: SearchResultType
      description: 'What a search result points at. There is no post or comment kind: a

        discussion result is a `thread` or a `message`.

        '
      enum:
      - newsletter
      - article
      - thread
      - message
    SearchResult:
      type: object
      title: SearchResult
      description: 'One hit. It always carries enough to render a row without a second

        request, and points at the full resource through `resource`.

        '
      additionalProperties: false
      required:
      - object
      - type
      - resource
      properties:
        object:
          type: string
          const: search_result
          description: Always `search_result`.
        type:
          $ref: '#/components/schemas/SearchResultType'
        title:
          type:
          - string
          - 'null'
          description: 'The heading for the row: a newsletter''s name, an article''s title, a

            person''s display name. Null for a chat hit, which has no title.

            '
        snippet:
          type:
          - string
          - 'null'
          description: 'A fragment of the matching text with the query terms in it, as plain

            text. Null when the match was on the title alone.

            '
        url:
          type: string
          format: uri
          description: Where the hit lives on the web.
        score:
          type: number
          minimum: 0
          description: 'How well the hit matched, higher being better. Results come back

            ordered by it, so use it to compare hits within one response and to

            draw a relevance cutoff. It is not comparable across queries or

            across contract versions, and the scale is undefined.

            '
        resource:
          description: 'The object itself. A `Ref` unless `resource` is named in `?expand=`,

            in which case it is the full object of the kind named by `type`.

            '
          anyOf:
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/Newsletter'
          - $ref: '#/components/schemas/Article'
          - $ref: '#/components/schemas/Thread'
          - $ref: '#/components/schemas/Message'
    Highlight:
      type: object
      title: Highlight
      description: 'A passage of an article a reader marked. Highlights are the anchor for

        an inline comment, which is why one can carry a link to the message it

        started.

        '
      additionalProperties: false
      required:
      - object
      - id
      - article
      - quote
      - start_offset
      - end_offset
      - owner_key
      - created_at
      properties:
        object:
          type: string
          const: highlight
          description: Always `highlight`.
        id:
          type: string
          format: uuid
          description: Stable identifier.
        article:
          description: 'The article the passage is in. A `Ref` unless `article` is named in

            `?expand=`.

            '
          oneOf:
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/Article'
        quote:
          type: string
          maxLength: 5000
          description: The marked text itself, as plain text.
        prefix:
          type: string
          description: 'Up to two hundred characters of the text immediately before the

            quote. Together with `suffix` this re anchors the highlight when the

            body changed and the offsets no longer line up.

            '
        suffix:
          type: string
          description: Up to two hundred characters of the text immediately after the quote.
        start_offset:
          type: integer
          minimum: 0
          description: 'Where the passage starts, as a character offset into the article''s

            plain text. Always less than `end_offset`.

            '
        end_offset:
          type: integer
          minimum: 1
          description: Where the passage ends, as a character offset into the plain text.
        owner_key:
          type: string
          description: 'An opaque, stable per highlighter value, scoped to this one article.

            Group by it to tell one reader''s marks apart from another''s, and

            count distinct values for a distinct highlighter count. It cannot be

            resolved to a person and does not correlate across articles: Commune

            does not attribute a highlight to a named reader.

            '
          examples:
          - 4f2a9c1e7b3d6a05
        message:
          description: 'The chat message the reader wrote from this passage, when they wrote

            one. `null` otherwise. A `Ref` unless `message` is named in

            `?expand=`.

            '
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/Message'
        created_at:
          type: string
          format: date-time
          description: When the passage was marked.
    Tag:
      type: object
      title: Tag
      description: 'A segment of a newsletter''s audience. A tag is what makes an article

        audience scoped: sending to a tag stamps the article, and from then on

        only holders of that tag and the newsletter''s team can read it.

        '
      additionalProperties: false
      required:
      - object
      - id
      - newsletter
      - name
      - retired
      - created_at
      properties:
        object:
          type: string
          const: tag
          description: Always `tag`.
        id:
          type: string
          format: uuid
          description: Stable identifier.
        newsletter:
          description: 'The newsletter the tag belongs to. A tag never spans newsletters. A

            `Ref` unless `newsletter` is named in `?expand=`.

            '
          oneOf:
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/Newsletter'
        name:
          type: string
          description: 'What the creator calls the segment. Unique among the newsletter''s

            live tags, and freed for reuse once a tag is retired.

            '
        known_subscriber_count:
          type: integer
          minimum: 0
          description: 'How many currently subscribed people Commune knows of who hold this

            tag. Counted at read time from Commune''s own record of the

            audience, which for a newsletter connected to an outside provider

            is a partial cache of that provider''s list. Named `known_` for that

            reason: it is a floor, never the segment''s true size, and it must

            not be presented as one.

            '
        retired:
          type: boolean
          description: '`true` when the creator removed the tag but an already sent article is

            still addressed to it. Retired tags keep their assignments, because

            the audience of a sent article does not change retroactively. Excluded

            from the tag list unless `include_retired=true`.

            '
        retired_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the tag was retired. Null while it is live.
        created_at:
          type: string
          format: date-time
          description: When the tag was created.
    TagName:
      type: string
      title: TagName
      minLength: 1
      maxLength: 60
      description: 'What the creator calls the segment. Leading and trailing spaces are

        trimmed, and what is left has to be between 1 and 60 characters and

        unique among the newsletter''s live tags.

        '
    TagCreateRequest:
      type: object
      title: TagCreateRequest
      description: A new, empty segment of the newsletter's audience.
      additionalProperties: false
      required:
      - name
      properties:
        name:
          $ref: '#/components/schemas/TagName'
      examples:
      - name: Founding member
    TagUpdateRequest:
      type: object
      title: TagUpdateRequest
      description: 'A tag''s new name. The only thing about a tag that can be changed: who

        holds it is moved by applying it to subscribers and taking it off them,

        and whether it is retired is decided by deleting it.

        '
      additionalProperties: false
      required:
      - name
      properties:
        name:
          $ref: '#/components/schemas/TagName'
      examples:
      - name: Founding members
    TagDeletion:
      type: object
      title: TagDeletion
      description: 'What became of a tag that was deleted, which is one of two things.


        Not a tag: a tag that was removed outright no longer exists, and one

        that was retired instead is still live enough to decide who may read

        the articles it was addressed to. A single shape that could mean either

        would let a caller read a retirement as an ending, which it is not.

        '
      additionalProperties: false
      required:
      - object
      - id
      - outcome
      - tag
      properties:
        object:
          type: string
          const: tag_deletion
          description: Always `tag_deletion`.
        id:
          type: string
          format: uuid
          description: 'The tag that was deleted. Still resolvable through

            `GET /tags/{tag}` when `outcome` is `retired`, and a `404` when it

            is `deleted`.

            '
        outcome:
          type: string
          enum:
          - deleted
          - retired
          description: '`deleted` means no article was ever addressed to the tag, so it was

            removed and its assignments went with it.


            `retired` means an article was, so the tag was kept. Everyone

            holding it goes on holding it and goes on being able to read every

            article it was addressed to; what stops is the tag being offered

            and being possible to add a holder to. A retirement revokes

            nobody''s access. To take access away, take the tag off the people

            holding it one at a time.

            '
        tag:
          oneOf:
          - $ref: '#/components/schemas/Tag'
          - type: 'null'
          description: 'The retired tag, as it now stands, and null when the tag was

            removed outright. Its `known_subscriber_count` is the count the tag

            had before this call rather than zero, which is the plainest

            evidence that a retirement kept its holders.

            '
    TagAssignmentRequest:
      type: object
      title: TagAssignmentRequest
      description: 'The subscribers to put in a segment. The segment is the tag in the

        path.

        '
      additionalProperties: false
      required:
      - subscribers
      properties:
        subscribers:
          type: array
          minItems: 1
          maxItems: 500
          description: 'Subscriber ids, the `id` of each `Subscriber`: never email

            addresses. 1 to 500 of them, counted as sent. An id that appears

            more than once is applied and reported once.

            '
          items:
            type: string
            format: uuid
      examples:
      - subscribers:
        - 33445566-7788-4990-a1b2-c3d4e5f60718
        - 44556677-8899-4aa1-b2c3-d4e5f6071829
    TagAssignment:
      type: object
      title: TagAssignment
      description: 'What applying a tag to a list of subscribers did, subscriber by

        subscriber.


        `tagged`, `already_tagged` and `not_found` are disjoint, and together

        they hold every id the request named, once each, in the order the

        request named them. Only `tagged` changed anything.

        '
      additionalProperties: false
      required:
      - object
      - tag
      - tagged
      - already_tagged
      - not_found
      properties:
        object:
          type: string
          const: tag_assignment
          description: Always `tag_assignment`.
        tag:
          $ref: '#/components/schemas/Tag'
          description: 'The tag, as it now stands. Its `known_subscriber_count` is read

            after the change, so it includes everyone in `tagged` who is

            currently subscribed.

            '
        tagged:
          type: array
          description: 'Subscribers who hold the tag now and did not before. One

            `subscriber.tagged` event was published for each.

            '
          items:
            type: string
            format: uuid
        already_tagged:
          type: array
          description: 'Subscribers who already held the tag. Nothing changed for them and

            nothing was published.

            '
          items:
            type: string
            format: uuid
        not_found:
          type: array
          description: 'Ids that are not subscribers of the tag''s newsletter, whether they

            belong to another newsletter or to nobody. Nothing was written for

            them. Retrying will give the same answer; check where the ids came

            from instead.

            '
          items:
            type: string
            format: uuid
    MemberRole:
      type: string
      title: MemberRole
      description: 'What someone may do on behalf of a newsletter. `owner` is not a stored

        membership: it is the account the newsletter belongs to, surfaced here

        as a role so the team reads as one list.

        '
      enum:
      - owner
      - admin
      - editor
      - guest
    Member:
      type: object
      title: Member
      description: A person's place on a newsletter's team.
      additionalProperties: false
      required:
      - object
      - id
      - newsletter
      - user
      - role
      properties:
        object:
          type: string
          const: member
          description: Always `member`.
        id:
          type: string
          description: 'Stable identifier for the membership. For the owner, who has no

            membership row, this is the newsletter''s `id` prefixed with

            `owner_`.

            '
        newsletter:
          description: 'The newsletter. A `Ref` unless `newsletter` is named in `?expand=`.

            '
          oneOf:
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/Newsletter'
        user:
          description: 'The person. A `Ref` unless `user` is named in `?expand=`.

            '
          anyOf:
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/User'
        role:
          $ref: '#/components/schemas/MemberRole'
        created_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'When the person joined the team. Null for the owner, whose place

            predates the team.

            '
    SubscriberStatus:
      type: string
      title: SubscriberStatus
      description: 'Where a subscription stands. Source of truth for a `commune`

        newsletter. For a newsletter connected to an outside provider it

        reflects what Commune last saw of the provider''s state.

        '
      enum:
      - subscribed
      - unsubscribed
      - bounced
      - complained
      - pending
    Subscriber:
      type: object
      title: Subscriber
      description: 'One person''s membership of one newsletter. The same person subscribing

        to two newsletters is two subscribers, and one creator never sees the

        other''s row.


        A subscriber may or may not have a Commune account. Someone who joined

        by email, or who arrived in an import from the newsletter''s provider,

        has an `email` and no `user`. Someone who joined through Commune has

        both.

        '
      additionalProperties: false
      required:
      - object
      - id
      - newsletter
      - email
      - status
      - created_at
      properties:
        object:
          type: string
          const: subscriber
          description: Always `subscriber`.
        id:
          type: string
          format: uuid
          description: Stable identifier for this membership.
        newsletter:
          description: 'The newsletter subscribed to. A `Ref` unless `newsletter` is named

            in `?expand=`.

            '
          oneOf:
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/Newsletter'
        user:
          description: 'The Commune account behind the subscription, or `null` for someone

            who joined by email without one. A `Ref` unless `user` is named in

            `?expand=`.

            '
          anyOf:
          - type: 'null'
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/User'
        email:
          type: string
          format: email
          description: 'Where the newsletter reaches this person. Returned on every

            subscriber, including one with a Commune account behind them.


            For a subscriber with no account it is the address they subscribed

            with. For one with an account it is the address on that account,

            which is where the article is actually delivered. Never null.


            **This is the one place in the API an address appears.** It is a

            property of the subscription rather than of the person, so it is

            never on a public profile, never on an expanded author, and never

            reachable from a credential granted another newsletter. Reading it

            needs `audience: read`, counts against the tighter `audience` rate

            limit budget, and is recorded in Commune''s audit log with the

            credential and how many subscribers it read.

            '
        status:
          $ref: '#/components/schemas/SubscriberStatus'
        source:
          type: string
          enum:
          - commune
          - imported
          - unknown
          description: 'How the subscription was made. `commune` when the person subscribed

            through Commune itself, by pressing subscribe, finishing signup or

            accepting an invitation. `imported` when they arrived in an import

            of the newsletter''s provider list or a file.


            **Not the same question as whether Commune grew the list.** Somebody

            who subscribes through Commune to a newsletter whose provider

            already held their address is `commune` here, even though the

            creator''s list did not get longer.


            `unknown` for a subscription recorded before Commune kept this. It

            is stated rather than left out, so "Commune does not know" cannot be

            mistaken for `imported`.

            '
        tags:
          type: array
          description: 'The audience tags this subscriber holds, which is what decides which

            tag scoped articles reach them. Each entry is a `Ref` unless `tags` is

            named in `?expand=`.

            '
          items:
            oneOf:
            - $ref: '#/components/schemas/Ref'
            - $ref: '#/components/schemas/Tag'
        created_at:
          type: string
          format: date-time
          description: When Commune first recorded the subscription.
        synced_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'When this row was last reconciled with the newsletter''s provider.

            Null for a `commune` newsletter, which has no provider to reconcile

            with.

            '
    ThreadVisibility:
      type: string
      title: ThreadVisibility
      description: 'Where a thread is placed. `public` puts it on the global Commune feed

        and makes it readable by anyone. `subscribers` keeps it inside the

        newsletter. `paid` narrows it further to the paying part of the

        audience. Set and changed by the newsletter''s team.

        '
      enum:
      - public
      - subscribers
      - paid
    Media:
      type: object
      title: Media
      description: An image or file attached to a thread or a message.
      additionalProperties: false
      required:
      - url
      properties:
        url:
          type: string
          format: uri
          description: Where the attachment is served from.
        type:
          type:
          - string
          - 'null'
          description: 'The attachment''s media type when Commune recorded one, for example

            `image/png`. Null for an attachment old enough that none was

            recorded.

            '
        thumbnail:
          type:
          - string
          - 'null'
          format: uri
          description: A smaller rendition, when one was generated.
    Thread:
      type: object
      title: Thread
      description: 'A conversation in a newsletter''s community, together with the message

        that opened it. Its replies are a separate collection.

        '
      additionalProperties: false
      required:
      - object
      - id
      - newsletter
      - content
      - visibility
      - is_article_thread
      - created_at
      - last_activity_at
      properties:
        object:
          type: string
          const: thread
          description: Always `thread`.
        id:
          type: string
          format: uuid
          description: Stable identifier.
        short_id:
          type:
          - string
          - 'null'
          description: 'Eight character base62 identifier used by the thread''s own URL at

            `/n/{handle}/chat/{short_id}`. Null for a thread Commune opened

            under an article, which is reached through the article instead.

            '
        newsletter:
          description: 'The community this thread lives in. A `Ref` unless `newsletter` is

            named in `?expand=`.

            '
          oneOf:
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/Newsletter'
        author:
          description: 'Who opened the thread. A `Ref` unless `author` is named in

            `?expand=`.

            '
          anyOf:
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/User'
        content:
          type: string
          description: 'The opening message. HTML, since people format what they write.

            Treat it as untrusted markup and render it in a sandboxed context.

            '
        media:
          type: array
          description: Attachments on the opening message.
          items:
            $ref: '#/components/schemas/Media'
        visibility:
          $ref: '#/components/schemas/ThreadVisibility'
        is_article_thread:
          type: boolean
          description: '`true` when Commune opened this thread under an article rather than

            a person starting it. These are kept off the global feed, because

            the article card already represents the conversation there.

            '
        article:
          description: 'The article that opened this thread, when `is_article_thread` is

            `true`. `null` otherwise. A `Ref` unless `article` is named in

            `?expand=`.

            '
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/Article'
        reply_count:
          type: integer
          minimum: 0
          description: Undeleted replies in the thread, at any depth.
        view_count:
          type: integer
          minimum: 0
          description: How many times the thread was opened.
        created_at:
          type: string
          format: date-time
          description: When the thread was opened.
        updated_at:
          type: string
          format: date-time
          description: When the thread row last changed for any reason.
        edited_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'When the author last edited the opening message. Null when it was

            never edited, which is what drives the edited marker in the product.

            '
        last_activity_at:
          type: string
          format: date-time
          description: 'When the thread last received a reply, or when it was opened if it

            never did. This is the sort key for the thread list.

            '
    Message:
      type: object
      title: Message
      description: 'A reply inside a thread. Commune allows two levels: a reply to the

        thread, and a reply to that reply. A deleted message is omitted from

        every read rather than returned as a tombstone.

        '
      additionalProperties: false
      required:
      - object
      - id
      - thread
      - newsletter
      - content
      - depth
      - created_at
      properties:
        object:
          type: string
          const: message
          description: Always `message`.
        id:
          type: string
          format: uuid
          description: Stable identifier.
        short_id:
          type:
          - string
          - 'null'
          description: 'Eight character base62 identifier used by the message''s permalink.

            Null for a message old enough that none was assigned.

            '
        thread:
          description: 'The thread this reply belongs to. A `Ref` unless `thread` is named

            in `?expand=`.

            '
          oneOf:
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/Thread'
        newsletter:
          description: 'The community the thread lives in, denormalised so a client does not

            have to walk up to it. A `Ref` unless `newsletter` is named in

            `?expand=`.

            '
          oneOf:
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/Newsletter'
        author:
          description: 'Who wrote the reply. A `Ref` unless `author` is named in `?expand=`.

            '
          anyOf:
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/User'
        parent:
          description: 'The message this one replies to, or `null` when it replies to the

            thread itself. A `Ref` unless `parent` is named in `?expand=`.

            '
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/Message'
        quoted:
          description: 'The message this one quotes, when the author quoted rather than

            replied. `null` otherwise. A `Ref` unless `quoted` is named in

            `?expand=`.

            '
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/Message'
        depth:
          type: integer
          minimum: 1
          maximum: 2
          description: '`1` for a reply to the thread, `2` for a reply to a reply. Commune

            does not nest deeper, so a client can render the tree with a fixed

            two level layout.

            '
        content:
          type: string
          description: 'The message body as HTML. Treat it as untrusted markup and render it

            in a sandboxed context.

            '
        media:
          type: array
          description: Attachments on the message.
          items:
            $ref: '#/components/schemas/Media'
        highlight:
          description: 'The passage of an article this reply is anchored to, when the reader

            wrote it from a highlight. `null` otherwise. A `Ref` unless

            `highlight` is named in `?expand=`.

            '
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/Highlight'
        created_at:
          type: string
          format: date-time
          description: When the reply was written.
        updated_at:
          type: string
          format: date-time
          description: When the row last changed for any reason.
        edited_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'When the author last edited the text or attachments. Not touched by

            reactions or other side effects, so it is a faithful edited marker.

            '
        reactions:
          type: array
          description: 'The emoji reactions on this message, one entry per distinct emoji,

            most used first. Empty when there are none. Each entry carries

            `users`, who left it, only when `reactions` is named in `?expand=`.

            '
          items:
            $ref: '#/components/schemas/Reaction'
    Reaction:
      type: object
      title: Reaction
      description: 'One emoji on a message, and how many people left it.

        '
      additionalProperties: false
      required:
      - emoji
      - count
      properties:
        emoji:
          type: string
          description: The emoji itself, as the character rather than a shortcode.
          examples:
          - 🎉
        count:
          type: integer
          minimum: 1
          description: How many people left this emoji on the message.
        users:
          type: array
          description: 'Who left it, in the order they did. Present only when `reactions`

            is named in `?expand=`.

            '
          items:
            $ref: '#/components/schemas/Ref'
    User:
      type: object
      title: User
      description: 'A person''s public profile, and the whole of what this API returns about

        anybody other than the credential''s own owner. Email address, theme,

        notification preferences, push subscriptions, read state and saved

        articles are never carried.

        '
      additionalProperties: false
      required:
      - object
      - id
      properties:
        object:
          type: string
          const: user
          description: Always `user`.
        id:
          type: string
          description: Stable identifier.
        username:
          type:
          - string
          - 'null'
          description: 'The unique handle the profile resolves on at `/@{username}`. Null

            for an account that has not finished signing up.

            '
        display_name:
          type:
          - string
          - 'null'
          description: The name shown next to their messages and bylines.
        avatar:
          type:
          - string
          - 'null'
          format: uri
          description: 'Profile picture. Commune falls back to a generated avatar when the

            person never set one, so this is rarely null in practice.

            '
    Me:
      type: object
      title: Me
      description: 'The account behind the credential that asked.


        Everything `User` carries, plus the two properties a public profile

        withholds. A separate schema rather than `User` with optional fields, so

        a public profile cannot carry an email address at all. A client routing

        on `object` gets `me` here and `user` there, so an absent email is never

        ambiguous between "not served" and "not set".


        The account''s own edges are not properties of it. Which teams it is on,

        what it subscribes to, what it saved and what it liked are four

        collections of their own: `GET /memberships`, `GET /subscriptions`,

        `GET /saved-articles` and `GET /liked-articles`.


        Not carried: theme and contrast, notification preferences, push

        subscriptions and read state.

        '
      additionalProperties: false
      required:
      - object
      - id
      properties:
        object:
          type: string
          const: me
          description: Always `me`.
        id:
          type: string
          description: 'Stable identifier. The same value `User.id` carries, so a client

            can match itself against an author or a message it has already

            read.

            '
        username:
          type:
          - string
          - 'null'
          description: 'The unique handle the public profile resolves on at

            `/@{username}`. Null for an account that has not finished signing

            up.

            '
        display_name:
          type:
          - string
          - 'null'
          description: 'The name shown next to their messages and bylines. Null when it was

            never set; a blank name is reported as null rather than as an empty

            string.

            '
        avatar:
          type:
          - string
          - 'null'
          format: uri
          description: 'Profile picture. Commune falls back to a generated avatar when the

            person never set one, so this is rarely null in practice.

            '
        email:
          type:
          - string
          - 'null'
          format: email
          description: 'The address Commune sends this account''s own mail to. Only ever

            this account''s own, and never returned for anybody else.

            '
        email_verified:
          type: boolean
          description: 'Whether the address above has been confirmed.

            '
        created_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the account was created.
    Membership:
      type: object
      title: Membership
      description: 'One newsletter team this account belongs to, seen from the account''s

        side.


        Not `Member`, which is the same edge seen from the newsletter: that one

        carries an expandable `user` and is read with a newsletter permission,

        this one carries a bare `newsletter` reference and is read on the

        account axis. They are kept apart so neither surface declares a property

        the other must never serve.

        '
      additionalProperties: false
      required:
      - object
      - id
      - newsletter
      - role
      properties:
        object:
          type: string
          const: membership
          description: Always `membership`.
        id:
          type: string
          description: 'Stable identifier for the membership. The same value `Member.id`

            carries for the same edge, including the `owner_` prefixed form an

            owner gets.

            '
        newsletter:
          description: 'The newsletter this place is on. A `Ref` unless `newsletter` is

            named in `?expand=`, and then a `NewsletterSummary`: the public half

            of that newsletter, which is all the account axis reads about a

            publication the credential holds no grant on.


            Never a `Newsletter`, which carries facts about the business behind

            the publication. The two report different `object` values, so a

            client can tell them apart without inspecting properties.

            '
          anyOf:
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/NewsletterSummary'
        role:
          $ref: '#/components/schemas/MemberRole'
        created_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'When the account joined that team. Null for an owner, whose place

            predates the team.

            '
    Subscription:
      type: object
      title: Subscription
      description: 'One newsletter this account subscribes to, from the account''s side.


        The mirror of `Membership`. That one is a place on a newsletter''s team,

        this one is a place on its list; both are the same edge seen from the

        person, both carry a bare `newsletter` reference, and neither says

        anything about the newsletter beyond an identifier.


        Never a `Subscriber`, which is the same edge seen from the newsletter

        and carries an email address, a lifecycle status, the tags the

        newsletter has applied and where the subscriber was acquired. That is a

        newsletter''s record of a person; this is a person''s record of a

        newsletter.

        '
      additionalProperties: false
      required:
      - object
      - id
      - newsletter
      properties:
        object:
          type: string
          const: subscription
          description: Always `subscription`.
        id:
          type: string
          format: uuid
          description: 'Stable identifier for the subscription. The same value

            `Subscriber.id` carries for the same edge, so the newsletter''s side

            and the reader''s side name one subscription the same way.

            '
        newsletter:
          description: 'The newsletter this subscription is to. A `Ref` unless `newsletter`

            is named in `?expand=`, and then a `NewsletterSummary`, exactly as

            on `Membership`.

            '
          anyOf:
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/NewsletterSummary'
        created_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'When Commune recorded the subscription, which is the same value

            `Subscriber.created_at` carries. For a subscription Commune learned

            from a newsletter''s email provider this is when Commune first saw

            it, and that can be long after the person actually subscribed.

            '
    SavedArticle:
      type: object
      title: SavedArticle
      description: 'One article this account put aside to read later.


        It carries no identifier of its own, and that is the shape rather than

        an omission: a save has no identity apart from the pair of the person

        who made it and the article it points at, and the person is the

        credential that reads it. There is nothing to address it by, and no

        operation that would take one.


        An entry is present only while the person may still read the article it

        names, so a page of these is a live view rather than a log of what was

        ever saved.

        '
      additionalProperties: false
      required:
      - object
      - article
      properties:
        object:
          type: string
          const: saved_article
          description: Always `saved_article`.
        article:
          description: 'The article that was saved. A `Ref` unless `article` is named in

            `?expand=`, and then an `ArticleSummary`: the title, the preview

            line, the cover and the publication date, without the body.


            Expanding it can never widen the page. The same two rules that

            decide which saves appear at all are applied again when the article

            is resolved, so an entry whose article this person may no longer read

            stays a `Ref`. A `Ref` is also what a caller gets for an article that

            has since been deleted, so treat the reference as "no detail

            available" rather than as an error.

            '
          anyOf:
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/ArticleSummary'
        created_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the person saved it.
    LikedArticle:
      type: object
      title: LikedArticle
      description: 'One article this account liked.


        Property for property the same shape as `SavedArticle`, and a separate

        schema so a client routing on `object` can tell the two apart.


        **What they say differs.** A save is a list the person keeps for

        themselves, and nothing else in this API reveals one. A like is a signal

        the person gave a newsletter: its tally is public on `Article.stats`,

        and the newsletter it was aimed at reads who left it on its engagement

        stream and is pushed it as `article.liked`. Neither gesture is assembled

        across the newsletters a person reads anywhere but here.


        Carries no identifier of its own. A like has no identity apart from the

        person who left it and the article it points at.

        '
      additionalProperties: false
      required:
      - object
      - article
      properties:
        object:
          type: string
          const: liked_article
          description: Always `liked_article`.
        article:
          description: 'The article that was liked. A `Ref` unless `article` is named in

            `?expand=`, and then an `ArticleSummary`, under exactly the rules

            `SavedArticle.article` sets out: the expansion is gated the same way

            the page is, so it can never reveal an article the page withheld.

            '
          anyOf:
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/ArticleSummary'
        created_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the person liked it.
    NewsletterSummary:
      type: object
      title: NewsletterSummary
      description: 'A newsletter as anybody sees it: what expanding the `newsletter` on a

        membership or a subscription returns.


        **A different schema from `Newsletter`, not a trimmed one.**

        `Newsletter` carries things that belong to the business rather than to

        the publication: which email provider the creator pays, who owns the

        account, which article they have pinned. This schema holds the page a

        logged out person can already open: the handle, the name, the

        description, the artwork, the accent colour, the links and the language.

        A property added to `Newsletter` later is not served here unless it is

        added here too.


        `object` is `newsletter_summary` rather than `newsletter`, so a client

        routing on `object` never has to guess whether a missing property was

        withheld or unset.


        The identifier is the newsletter''s own, so it matches the `Ref` this

        replaced and any other `Ref` to the same newsletter in a response.

        '
      additionalProperties: false
      required:
      - object
      - id
      - handle
      - name
      properties:
        object:
          type: string
          const: newsletter_summary
          description: Always `newsletter_summary`.
        id:
          type: string
          format: uuid
          description: 'Stable identifier, the same value `Newsletter.id` and a `Ref` to

            this newsletter carry.

            '
        handle:
          type: string
          description: 'The unique handle the newsletter resolves on at `/n/{handle}`.

            '
        name:
          type:
          - string
          - 'null'
          description: The publication's name.
        description:
          type:
          - string
          - 'null'
          description: The one paragraph the newsletter introduces itself with.
        image_url:
          type:
          - string
          - 'null'
          format: uri
          description: Avatar, square.
        website_url:
          type:
          - string
          - 'null'
          format: uri
          description: The newsletter's own site, when it has one apart from Commune.
        social_links:
          $ref: '#/components/schemas/SocialLinks'
        language:
          type:
          - string
          - 'null'
          description: 'The language the newsletter publishes in, as a BCP-47 primary

            subtag.

            '
    ArticleSummary:
      type: object
      title: ArticleSummary
      description: 'An article as anybody sees it, without its body: what expanding the

        `article` on a save or a like returns.


        **The expansion is gated exactly as the collection is.** The two rules

        that decide whether an entry appears at all, that an article dated in

        the future is not served and that an article stamped with an audience is

        served only to the newsletter''s team and to subscribers holding one of

        its tags, are applied again when the article is resolved. An entry the

        person may no longer read keeps its `Ref`, so expanding a page can fill

        it in but can never lengthen it.


        **A different schema from `Article`, not a trimmed one.** `Article`

        carries a lifecycle a reader has no part in: what state the dispatch is

        in, when a queued article may go out, whether it was imported. The body

        is absent too, as it would be on any list.


        `object` is `article_summary` rather than `article`, so a client routing

        on `object` never has to guess whether a missing property was withheld

        or unset.

        '
      additionalProperties: false
      required:
      - object
      - id
      - short_id
      - slug
      - newsletter
      properties:
        object:
          type: string
          const: article_summary
          description: Always `article_summary`.
        id:
          type: string
          format: uuid
          description: 'Stable identifier, the same value `Article.id` and a `Ref` to this

            article carry.

            '
        short_id:
          type: string
          description: 'Eight character base62 identifier, unique across Commune and safe

            in a URL.

            '
          examples:
          - k7Rm2xQp
        slug:
          type: string
          description: 'URL segment under the newsletter. With the newsletter''s handle it

            makes the permalink, `/n/{handle}/a/{slug}`.

            '
        newsletter:
          $ref: '#/components/schemas/Ref'
          description: 'The newsletter that published it, always as a reference. There is

            no nested `?expand=article.newsletter`. Expand `newsletter` on

            `GET /memberships` or `GET /subscriptions` to put names to these

            identifiers.

            '
        title:
          type:
          - string
          - 'null'
          description: Subject line of the article.
        preview_text:
          type:
          - string
          - 'null'
          description: 'The short line email clients show after the subject, and what

            Commune uses as the excerpt on a card.

            '
        image_url:
          type:
          - string
          - 'null'
          format: uri
          description: Cover image.
        external_url:
          type:
          - string
          - 'null'
          format: uri
          description: 'The article''s canonical URL on the newsletter''s own provider, for an

            imported article. Null for one written in Commune.

            '
        posted_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'When the article went out. Never ahead of now in a response: an article

            dated in the future is not resolved at all.

            '
    InsightVelocity:
      type: string
      title: InsightVelocity
      description: 'Which way a reader''s engagement is moving, from the last fourteen days

        against the fourteen before them. `steady` also covers a reader with no

        activity in either window, so read it with `status`, where that reader

        is `dormant`.

        '
      enum:
      - rising
      - cooling
      - steady
    InsightStatus:
      type: string
      title: InsightStatus
      description: 'Where a reader sits in the newsletter''s engagement ladder, from

        `dormant` at the bottom to `superfan` at the top.


        Assigned by rank inside the newsletter rather than against an absolute

        score, so it is a statement about this audience and never comparable

        between two newsletters. It also means a reader can move without doing

        anything, because the people around them moved.

        '
      enum:
      - superfan
      - engaged
      - reader
      - dormant
    SubscriberInsight:
      type: object
      title: SubscriberInsight
      description: 'One reader''s engagement with one newsletter, scored across both the

        email and the community. Recomputed on a schedule, not at read time.


        Scores have no unit and no ceiling. They are sums of weighted actions,

        so they are meaningful ranked against each other inside one newsletter

        and meaningless compared between two.

        '
      additionalProperties: false
      required:
      - object
      - newsletter
      - subscriber
      - total_score
      - community_score
      - esp_score
      - t1_score
      - t2_score
      - velocity
      - status
      - share_points
      properties:
        object:
          type: string
          const: subscriber_insight
          description: Always `subscriber_insight`.
        newsletter:
          description: 'The newsletter the reader is scored against. A `Ref` unless

            `newsletter` is named in `?expand=`.

            '
          oneOf:
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/Newsletter'
        subscriber:
          description: 'The scored reader''s membership of this newsletter. A `Ref` unless

            `subscriber` is named in `?expand=`, and then the full `Subscriber`,

            `email` and `status` included, exactly as

            `GET /subscribers/{subscriber}` returns it. Expanding it needs

            `audience: read` as well as `insights: read`, because it puts an

            email address in the response. Scoring is attributed to a Commune

            account, so this is always a subscriber who has one.

            '
          oneOf:
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/Subscriber'
        total_score:
          type: integer
          minimum: 0
          description: 'The blended lifetime score, and the field this collection is ordered

            by. It is `community_score` plus `esp_score`.

            '
        community_score:
          type: integer
          minimum: 0
          description: 'The part of the score earned on Commune: reading, liking,

            highlighting, replying and sharing.

            '
        esp_score:
          type: integer
          minimum: 0
          description: 'The part of the score earned in the inbox, from what the

            newsletter''s email provider reported. Always `0` for a `commune`

            newsletter, whose email signal arrives through the send

            pipeline instead.

            '
        t1_score:
          type: integer
          minimum: 0
          description: Points earned in the last fourteen days.
        t2_score:
          type: integer
          minimum: 0
          description: 'Points earned in the fourteen days before those. `velocity` is the

            comparison of `t1_score` against this.

            '
        velocity:
          $ref: '#/components/schemas/InsightVelocity'
        status:
          $ref: '#/components/schemas/InsightStatus'
        share_points:
          type: integer
          minimum: 0
          description: 'The part of `total_score` earned by putting the newsletter in front

            of someone else rather than by consuming it. The signal a referral

            programme wants.

            '
        last_action_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'When this reader last did anything that earned points. May be newer

            than the scores beside it, because the scores are recomputed on a

            schedule and this is the raw event time. `null` for a reader who has

            never acted.

            '
        synced_to_esp_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'When Commune last wrote this reader''s status back to the

            newsletter''s email provider, so the creator can segment on it there.

            `null` when it has never been synced, and always `null` for a

            newsletter with no provider to sync to.

            '
    EngagementEventType:
      type: string
      title: EngagementEventType
      description: 'What a reader did. The first five happen on Commune and the last two are

        reported by the newsletter''s email provider, which is what `source`

        records.

        '
      enum:
      - view
      - like
      - link_click
      - comment
      - share
      - email_open
      - email_click
    EngagementEventSource:
      type: string
      title: EngagementEventSource
      description: 'Which side of the newsletter an event came from. `community` is

        behaviour Commune observed itself. `esp` is behaviour the newsletter''s

        email provider reported, so it arrives on that provider''s schedule and

        is only as complete as that provider''s reporting.

        '
      enum:
      - community
      - esp
    EngagementEvent:
      type: object
      title: EngagementEvent
      description: 'One scored action by one reader, unaggregated, so a consumer can build

        its own model rather than take Commune''s scores. The subscriber insight

        scores are summed from exactly these.


        They are engagement records, not the events Commune pushes to a

        consumer. What Commune pushes is the `webhooks` block of this

        document.

        '
      additionalProperties: false
      required:
      - object
      - id
      - newsletter
      - subscriber
      - event_type
      - source
      - points
      - created_at
      properties:
        object:
          type: string
          const: engagement_event
          description: Always `engagement_event`.
        id:
          type: string
          description: 'Monotonically increasing identifier, returned as a string because it

            outgrows a double before a busy newsletter is done with it. This

            collection is ordered by it and the cursor walks it, which is what

            makes tailing safe.

            '
          examples:
          - '4815162342'
        newsletter:
          description: 'The newsletter the action was aimed at. A `Ref` unless `newsletter`

            is named in `?expand=`.

            '
          oneOf:
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/Newsletter'
        subscriber:
          description: 'Who acted. A `Ref` unless `subscriber` is named in `?expand=`.

            Attribution needs a Commune account, so an event is never recorded

            against an address the newsletter knows only from an import.

            '
          oneOf:
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/Subscriber'
        event_type:
          $ref: '#/components/schemas/EngagementEventType'
        source:
          $ref: '#/components/schemas/EngagementEventSource'
        points:
          type: integer
          description: 'What this action contributed to the reader''s score. The weights are

            Commune''s own and may be retuned, so treat this as the value at the

            time the event was recorded rather than a constant per `event_type`.

            '
        metadata:
          type: object
          additionalProperties: true
          description: 'What the action was aimed at, which varies by `event_type`: an

            article id, a message id, a clicked URL. Loosely typed, and a key

            present today may be absent tomorrow, so read it defensively.

            '
        created_at:
          type: string
          format: date-time
          description: When the reader acted.
    NewsletterStats:
      type: object
      title: NewsletterStats
      description: 'A newsletter''s headline numbers over one window: audience movement, what

        was published, community activity and email performance.


        Nothing here is a running total. Every number describes the resolved

        window, which the response echoes so a client can label a chart without

        recomputing what it asked for.

        '
      additionalProperties: false
      required:
      - object
      - newsletter
      - period_start
      - period_end
      - audience
      - publishing
      - community
      - delivery
      properties:
        object:
          type: string
          const: newsletter_stats
          description: Always `newsletter_stats`.
        newsletter:
          description: 'The newsletter these numbers describe. A `Ref` unless `newsletter`

            is named in `?expand=`.

            '
          oneOf:
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/Newsletter'
        period_start:
          type: string
          format: date-time
          description: 'Start of the resolved window, inclusive. Echoed because `period`,

            `since` and `until` can each decide it.

            '
        period_end:
          type: string
          format: date-time
          description: End of the resolved window, exclusive.
        audience:
          type: object
          additionalProperties: false
          description: 'How the list moved. Every count here comes from Commune''s own

            subscriber records, which are the source of truth only for a

            `commune` newsletter.

            '
          required:
          - known_subscribers
          - net_change
          - by_status
          properties:
            known_subscribers:
              type: integer
              minimum: 0
              description: 'How many subscribers Commune has a record of at `period_end`.

                Not the newsletter''s subscriber count. For a newsletter

                connected to an outside provider, Commune''s records are a

                partial cache of that provider''s list, filled in by imports and

                by people who joined through Commune, so this is a floor and not

                a total. Ask the provider for the real number.

                '
            net_change:
              type: integer
              description: 'Subscribers gained minus subscribers lost inside the window,

                against the same partial record. Negative when the list shrank.

                '
            by_status:
              type: object
              additionalProperties: false
              description: 'How the known subscribers split across the subscription states

                at `period_end`. The keys are the `SubscriberStatus` values.

                '
              required:
              - subscribed
              - unsubscribed
              - bounced
              - complained
              - pending
              properties:
                subscribed:
                  type: integer
                  minimum: 0
                  description: Mailable.
                unsubscribed:
                  type: integer
                  minimum: 0
                  description: Opted out, and kept so the history survives.
                bounced:
                  type: integer
                  minimum: 0
                  description: Undeliverable, and suppressed by the send pipeline.
                complained:
                  type: integer
                  minimum: 0
                  description: Reported the email as spam, and suppressed.
                pending:
                  type: integer
                  minimum: 0
                  description: Recorded but not yet confirmed as mailable.
        publishing:
          type: object
          additionalProperties: false
          description: 'Cadence. These are counts of articles, never counts of emails.

            '
          required:
          - sent
          - scheduled
          properties:
            sent:
              type: integer
              minimum: 0
              description: 'Articles that went out inside the window and that Commune has a

                record of. Commune''s record is not exhaustive, so never present

                this as the number of emails the newsletter sent. That number

                lives on a send.


                For a key that holds only read permissions, only the articles it

                can read: published and not restricted to a tag.

                '
            scheduled:
              type:
              - integer
              - 'null'
              minimum: 0
              description: 'Articles queued to go out after `period_end`. A forward looking

                count, so it does not move when the window does.


                `null` for a key that holds only read permissions. Queued

                articles are unpublished, which such a key may not see, so it is

                not told how many there are. `null` is not a count of zero: the

                newsletter may well have articles queued.

                '
        community:
          type: object
          additionalProperties: false
          description: 'What happened in the newsletter''s community inside the window. All

            four are Commune side counts with no email equivalent.


            For a key that holds only read permissions, all four cover only

            what it can read: public conversations and the replies in them, and

            highlights on articles it can read. An article''s own discussion is

            visible to subscribers only, so it is not counted for such a key.

            '
          required:
          - threads
          - messages
          - highlights
          - reactions
          properties:
            threads:
              type: integer
              minimum: 0
              description: 'Conversations started, including the ones Commune opens under a

                published article.

                '
            messages:
              type: integer
              minimum: 0
              description: 'Replies posted inside those conversations. An article''s comments

                are replies in its thread, so they are counted here.

                '
            highlights:
              type: integer
              minimum: 0
              description: Passages readers marked inside an article.
            reactions:
              type: integer
              minimum: 0
              description: Emoji reactions added to a message.
        delivery:
          type:
          - object
          - 'null'
          additionalProperties: false
          description: 'How the email performed across the articles sent inside the window.

            `null` for a newsletter Commune does not send, because the provider

            that sent the mail holds those numbers and does not hand them over

            per article.

            '
          required:
          - open_rate
          - click_rate
          properties:
            open_rate:
              type:
              - number
              - 'null'
              minimum: 0
              maximum: 1
              description: 'Opens over deliveries, as a fraction between `0` and `1`.

                `null` when nothing was delivered in the window, which is not

                the same as a rate of zero. Open tracking is unreliable by

                nature: a mail client that prefetches images inflates it and one

                that blocks them suppresses it.

                '
            click_rate:
              type:
              - number
              - 'null'
              minimum: 0
              maximum: 1
              description: 'Recipients who clicked at least one link, over deliveries, as a

                fraction between `0` and `1`. `null` when nothing was delivered

                in the window.

                '
    NewsletterGrowth:
      type: object
      title: NewsletterGrowth
      description: 'Where a newsletter''s new subscribers came from inside one window.

        '
      additionalProperties: false
      required:
      - object
      - newsletter
      - period_start
      - period_end
      - by_source
      properties:
        object:
          type: string
          const: newsletter_growth
          description: Always `newsletter_growth`.
        newsletter:
          description: 'The newsletter that grew. A `Ref` unless `newsletter` is named in

            `?expand=`.

            '
          oneOf:
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/Newsletter'
        period_start:
          type: string
          format: date-time
          description: Start of the resolved window, inclusive.
        period_end:
          type: string
          format: date-time
          description: End of the resolved window, exclusive.
        by_source:
          type: array
          description: 'One entry per acquisition source that produced at least one

            subscriber inside the window, largest first. A source that produced

            none is omitted rather than returned as a zero.

            '
          items:
            type: object
            additionalProperties: false
            required:
            - source
            - known_subscribers
            properties:
              source:
                type:
                - string
                - 'null'
                description: 'Which import brought these people in: the provider''s slug, or

                  `csv` for a file.


                  `null` is the ordinary outcome for anyone who subscribed

                  through Commune rather than arriving in an import, because

                  only an import stamps this. It also covers rows written

                  before Commune recorded anything here, which cannot be

                  attributed after the fact. The two are not told apart, so a

                  null bucket is not a count of Commune arrivals; the

                  subscriber''s own `source` is.


                  Two further values, `commune` and `imported`, appear only on

                  rows labelled once when the field was introduced and are

                  written by nothing today.

                  '
                examples:
                - kit
              known_subscribers:
                type: integer
                minimum: 0
                description: 'How many subscriptions Commune recorded from this source

                  inside the window. It counts arrivals Commune saw, so for a

                  newsletter connected to an outside provider it misses anyone

                  who joined at the provider between two imports.

                  '
    TimeseriesMetric:
      type: string
      title: TimeseriesMetric
      description: 'Which quantity a series buckets. Each value is a count of things that

        happened inside a bucket, never a running total, so a client that wants

        a cumulative line adds them up itself.

        '
      enum:
      - subscribers
      - sends
      - opens
      - clicks
      - threads
      - messages
    TimeseriesInterval:
      type: string
      title: TimeseriesInterval
      description: 'How wide each bucket is. A week starts on Monday and a month on the

        first, both in UTC, so buckets line up across two newsletters in

        different time zones.

        '
      enum:
      - day
      - week
      - month
    Timeseries:
      type: object
      title: Timeseries
      description: 'One metric bucketed over a window. The shape a chart consumes, and the

        only operation in this domain that is not a snapshot.

        '
      additionalProperties: false
      required:
      - object
      - newsletter
      - metric
      - interval
      - period_start
      - period_end
      - buckets
      properties:
        object:
          type: string
          const: timeseries
          description: Always `timeseries`.
        newsletter:
          description: 'The newsletter the series describes. A `Ref` unless `newsletter` is

            named in `?expand=`.

            '
          oneOf:
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/Newsletter'
        metric:
          $ref: '#/components/schemas/TimeseriesMetric'
        interval:
          $ref: '#/components/schemas/TimeseriesInterval'
        period_start:
          type: string
          format: date-time
          description: 'Start of the resolved window, inclusive. The first bucket starts

            here.

            '
        period_end:
          type: string
          format: date-time
          description: End of the resolved window, exclusive.
        buckets:
          type: array
          description: 'The series, oldest first. Buckets are contiguous and cover the whole

            window, so an empty bucket is returned with a `value` of `0` rather

            than omitted and a client never has to fill gaps.

            '
          items:
            type: object
            additionalProperties: false
            required:
            - ts
            - value
            properties:
              ts:
                type: string
                format: date-time
                description: 'The instant the bucket opens, in UTC. A bucket covers `ts` up

                  to the next bucket''s `ts`.

                  '
              value:
                type: integer
                minimum: 0
                description: 'How much of `metric` fell inside this bucket. A count for that

                  bucket alone, not a running total.

                  '
    ArticlePerformance:
      type: object
      title: ArticlePerformance
      description: 'One article measured on both sides at once: what the email did, and what

        the community did with it afterwards.


        Not to be confused with `ArticleStats`, the small public tally that

        hangs off an article itself. This is the `insights` report.

        '
      additionalProperties: false
      required:
      - object
      - article
      - email
      - community
      properties:
        object:
          type: string
          const: article_stats
          description: Always `article_stats`.
        article:
          description: 'The article measured. A `Ref` unless `article` is named in `?expand=`.

            '
          oneOf:
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/Article'
        email:
          type:
          - object
          - 'null'
          additionalProperties: false
          description: 'What happened in the inbox, counted per recipient from Commune''s own

            send records.


            `null` for an article Commune did not send: one imported from an

            outside provider, which mailed it without handing Commune the

            outcome, and one that has not been sent yet.


            These are counts of recipients, not rates. Divide by `delivered`

            rather than by `recipients` to get the rates a provider quotes.

            '
          required:
          - recipients
          - delivered
          - opened
          - clicked
          - bounced
          - unsubscribed
          properties:
            recipients:
              type: integer
              minimum: 0
              description: 'Addresses the dispatch was aimed at. For a tag scoped article this

                is the size of that segment, not of the whole list.

                '
            delivered:
              type: integer
              minimum: 0
              description: Recipients the provider accepted and delivered to.
            opened:
              type: integer
              minimum: 0
              description: 'Recipients who opened at least once, not the number of opens.

                Undercounts readers whose mail client blocks the tracking pixel

                and overcounts the ones whose client prefetches it.

                '
            clicked:
              type: integer
              minimum: 0
              description: 'Recipients who clicked at least one link, not the number of

                clicks. Which links they clicked is not on this report.

                '
            bounced:
              type: integer
              minimum: 0
              description: 'Recipients the provider could not deliver to. A hard bounce also

                suppresses that subscriber for later sends.

                '
            unsubscribed:
              type: integer
              minimum: 0
              description: 'Recipients who opted out from this article, where the opt out

                carried enough to attribute it. Best effort: someone who

                unsubscribed inside the app instead is not counted here.

                '
        community:
          type: object
          additionalProperties: false
          description: 'What happened on Commune. Computed at read time and still moving, so

            two reads a week apart legitimately disagree.

            '
          required:
          - views
          - likes
          - saves
          - highlights
          - thread_messages
          - participants
          properties:
            views:
              type: integer
              minimum: 0
              description: 'People who opened the article on Commune, counted once each rather

                than once per visit.

                '
            likes:
              type: integer
              minimum: 0
              description: People who liked the article.
            saves:
              type: integer
              minimum: 0
              description: 'People who put the article in their own reading list. Who they are

                stays private.

                '
            highlights:
              type: integer
              minimum: 0
              description: 'Passages readers marked inside the body. The sentences worth

                reading before writing the next article.

                '
            thread_messages:
              type: integer
              minimum: 0
              description: 'Replies in the article''s discussion. Commune has no separate

                comments store: an article''s discussion is a chat thread like any

                other, so this counts the undeleted replies hanging off it, and

                it is `0` for an article nobody has discussed.

                '
            participants:
              type: integer
              minimum: 0
              description: 'Distinct people who replied, so a reader who posted six times

                counts once. The number that says whether an article started a

                conversation or an argument between two people.

                '
    Actor:
      type:
      - object
      - 'null'
      description: 'Who caused the change, and `null` when nobody outside Commune did.


        Populated on a change made through this API''s write operations, and null on every other change:
        an edit a creator made in the product, an import arriving from a provider, a scheduled job, a
        delivery result reported by the sending provider. Null is therefore the common case and stays
        a legitimate value. Read it as "this change came in through the API under this credential", never
        as "nothing caused this".


        It never names a person, only the credential.


        It answers "did this change come in through the API, and under which credential". It is **not**
        the field to drop the echo of your own write with: use `idempotency_key`, which you chose and
        therefore already know, whereas `id` here is Commune''s own identifier for your credential and
        no operation reports it back to you. A creator can read that identifier in Commune, but it changes
        when the credential is replaced, so matching on it puts the loop back silently after a rotation.'
      additionalProperties: false
      required:
      - type
      - id
      properties:
        type:
          type: string
          enum:
          - user
          - api_key
          - system
          description: '`api_key` for a change made through this API, which is the only value emitted
            today. `user` is reserved for a change a named person made through an authenticated session
            and `system` for an unattended job; neither is emitted.


            An OAuth access token reports as `api_key` as well. The two credentials are interchangeable
            everywhere else in this API, and a separate value here would be a distinction a consumer cannot
            act on.'
        id:
          type: string
          description: Identifier of the actor within its `type`. For `api_key` it is the credential's
            own id and never its secret, and it is the same value that appears in a creator's list of
            credentials, so an event can be traced back to the integration that caused it.
        label:
          type:
          - string
          - 'null'
          description: Human-readable name for display. Best effort, may be null.
    ArticleLikedData:
      type: object
      title: Article like changed body
      description: Body of `article.liked`. Which article, who, which way the like moved, and the tally
        afterwards.
      required:
      - article_id
      - title
      - reader
      - direction
      - like_count
      - changed_at
      properties:
        article_id:
          type: string
          format: uuid
        title:
          type: string
        url:
          type:
          - string
          - 'null'
          format: uri
          description: Canonical public URL. Follows the newsletter's custom website domain when it has
            an active one, otherwise the Commune-hosted path.
        reader:
          $ref: '#/components/schemas/UserRef'
          description: The person who gave or withdrew the like. A like requires a Commune account, so
            this is null only in the case `UserRef` describes, an account that has since been deleted.
        direction:
          type: string
          enum:
          - added
          - removed
          description: '`added` when the like was given, `removed` when it was taken back.'
        like_count:
          type: integer
          minimum: 0
          description: The article's whole like tally after this change, counted in the same transaction
            that made it. The same number `Article.stats.likes` reports. Carried on both directions, so
            a consumer never has to add or subtract to stay correct.
        changed_at:
          type: string
          format: date-time
          description: When the like was given or withdrawn. Equal to `occurred_at`.
    ArticleLikedEvent:
      title: Article like changed
      description: A reader liked an article, or took the like back.
      allOf:
      - $ref: '#/components/schemas/EventEnvelope'
      - type: object
        properties:
          type:
            const: article.liked
          data:
            $ref: '#/components/schemas/ArticleLikedData'
    ArticlePublishedData:
      type: object
      required:
      - article_id
      - title
      - published_at
      - source
      properties:
        article_id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type:
          - string
          - 'null'
        url:
          type:
          - string
          - 'null'
          format: uri
          description: Canonical public URL. Follows the newsletter's custom website domain when it has
            an active one, otherwise the Commune-hosted path.
        published_at:
          type: string
          format: date-time
          description: The article's own `posted_at`. Normally equal to `occurred_at`, but an import can
            backdate it to the original publication time.
        source:
          type: string
          enum:
          - commune_send
          - import
          description: '`commune_send` for an article Commune emailed itself, `import` for a post pulled
            in from a connected ESP or RSS feed.'
        audience_scoped:
          type: boolean
          description: True when the article is restricted to specific subscriber tags rather than the
            whole list. Which tags is not carried here; read `GET /articles/{article}` for that.
    ArticlePublishedEvent:
      title: Article published
      description: An article became publicly readable.
      allOf:
      - $ref: '#/components/schemas/EventEnvelope'
      - type: object
        properties:
          type:
            const: article.published
          data:
            $ref: '#/components/schemas/ArticlePublishedData'
    ArticleReadData:
      type: object
      title: Article read body
      description: 'Body of `article.read`. Which article, who read it, and when they crossed from unread
        to read. There is no count here and no way to build one: the topic reports first reads by signed-in
        people only.'
      required:
      - article_id
      - title
      - reader
      - read_at
      properties:
        article_id:
          type: string
          format: uuid
        title:
          type: string
        url:
          type:
          - string
          - 'null'
          format: uri
          description: Canonical public URL. Follows the newsletter's custom website domain when it has
            an active one, otherwise the Commune-hosted path.
        reader:
          $ref: '#/components/schemas/UserRef'
          description: 'The person who read it. Never a stand-in for an anonymous reader: an anonymous
            read produces no message at all rather than one with this field empty, because Commune records
            nothing durable for it and a message built from nothing would be a message the reader could
            fabricate. Null only in the case `UserRef` describes, an account that has since been deleted.'
        read_at:
          type: string
          format: date-time
          description: When the article became read for this person. Equal to `occurred_at`. It does not
            move afterwards, because this crossing happens once.
    ArticleReadEvent:
      title: Article read
      description: A reader stayed with an article long enough to have read it.
      allOf:
      - $ref: '#/components/schemas/EventEnvelope'
      - type: object
        properties:
          type:
            const: article.read
          data:
            $ref: '#/components/schemas/ArticleReadData'
    ArticleScheduledData:
      type: object
      required:
      - article_id
      - title
      - scheduled_for
      properties:
        article_id:
          type: string
          format: uuid
        title:
          type: string
        scheduled_for:
          type: string
          format: date-time
          description: When the send is due. Always in the future at the time of this event, and always
            on a five-minute boundary.
    ArticleScheduledEvent:
      title: Article scheduled
      description: An article written in Commune was queued for a future send.
      allOf:
      - $ref: '#/components/schemas/EventEnvelope'
      - type: object
        properties:
          type:
            const: article.scheduled
          data:
            $ref: '#/components/schemas/ArticleScheduledData'
    BillingSubscriptionUpdatedData:
      type: object
      required:
      - subscription_id
      - plan
      - status
      properties:
        subscription_id:
          type: string
          format: uuid
          description: Commune's own identifier for the newsletter's subscription, one per `commune` newsletter.
            Not a Stripe id; Stripe identifiers are never exposed.
        plan:
          type: string
          enum:
          - creator
          - enterprise
        status:
          type: string
          enum:
          - trialing
          - active
          - past_due
          - canceled
          - trial_expired
        previous_status:
          type:
          - string
          - 'null'
          enum:
          - trialing
          - active
          - past_due
          - canceled
          - trial_expired
          - null
          description: The state being left. Null when it could not be established, so treat this as a
            hint and the new `status` as the truth.
        trial_ends_at:
          type:
          - string
          - 'null'
          format: date-time
        current_period_start:
          type:
          - string
          - 'null'
          format: date-time
        current_period_end:
          type:
          - string
          - 'null'
          format: date-time
        cancel_at_period_end:
          type: boolean
          description: 'The subscription is still active but will not renew. Distinct from `status: canceled`,
            which means it already stopped.'
    BillingSubscriptionUpdatedEvent:
      title: Billing subscription state changed
      description: The newsletter's own Commune subscription changed state.
      allOf:
      - $ref: '#/components/schemas/EventEnvelope'
      - type: object
        properties:
          type:
            const: billing.subscription.updated
          data:
            $ref: '#/components/schemas/BillingSubscriptionUpdatedData'
    CommunityMember:
      type: object
      title: CommunityMember
      description: 'One person''s public place in a newsletter''s community.


        The same membership a `Subscriber` describes, seen from outside, and the

        two share an `id`. A `Subscriber` carries an address; this carries a

        profile the person already publishes. Both need `audience: read`.


        **Only somebody with a Commune account is ever one of these.** A

        subscription that is an address and no account has no person to name, so

        it is left out of the collection rather than returned with a null

        `user`.

        '
      additionalProperties: false
      required:
      - object
      - id
      - newsletter
      - user
      - created_at
      properties:
        object:
          type: string
          const: community_member
          description: Always `community_member`.
        id:
          type: string
          format: uuid
          description: 'Stable identifier for the membership. The same value `Subscriber.id`

            carries for the same person on the same newsletter, so a creator

            holding both views can join them without a second lookup.

            '
        newsletter:
          description: 'The newsletter whose community this is. A `Ref` unless `newsletter`

            is named in `?expand=`.

            '
          oneOf:
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/Newsletter'
        user:
          description: 'The person. Never null: a membership with no account behind it is

            not returned at all. A `Ref` unless `user` is named in `?expand=`.

            '
          anyOf:
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/User'
        created_at:
          type: string
          format: date-time
          description: 'When they joined this newsletter''s community. Their account may be

            much older: this is the day they joined here, not the day they

            joined Commune.

            '
    DeliveryBouncedEvent:
      title: Delivery bounced
      description: The message could not be delivered.
      allOf:
      - $ref: '#/components/schemas/EventEnvelope'
      - type: object
        properties:
          type:
            const: delivery.bounced
          data:
            allOf:
            - $ref: '#/components/schemas/DeliveryEventData'
            - type: object
              required:
              - reason
              properties:
                reason:
                  type:
                  - string
                  - 'null'
                  maxLength: 1000
                  description: The provider's bounce message or type, whichever it supplied. Free text
                    for display. Hard and soft bounces are not distinguished today because Commune stores
                    only this string.
    DeliveryClickedEvent:
      title: Delivery link clicked
      description: The recipient clicked a tracked link.
      allOf:
      - $ref: '#/components/schemas/EventEnvelope'
      - type: object
        properties:
          type:
            const: delivery.clicked
          data:
            $ref: '#/components/schemas/DeliveryEventData'
    DeliveryComplainedEvent:
      title: Delivery marked as spam
      description: The recipient reported the message as spam.
      allOf:
      - $ref: '#/components/schemas/EventEnvelope'
      - type: object
        properties:
          type:
            const: delivery.complained
          data:
            allOf:
            - $ref: '#/components/schemas/DeliveryEventData'
            - type: object
              required:
              - reason
              properties:
                reason:
                  type:
                  - string
                  - 'null'
                  maxLength: 1000
                  description: Why the provider recorded a complaint. Providers rarely elaborate, so expect
                    a constant string.
    DeliveryDeliveredEvent:
      title: Delivery accepted
      description: The provider confirmed the message reached the recipient server.
      allOf:
      - $ref: '#/components/schemas/EventEnvelope'
      - type: object
        properties:
          type:
            const: delivery.delivered
          data:
            $ref: '#/components/schemas/DeliveryEventData'
    DeliveryEventData:
      type: object
      title: Delivery event body
      description: Shared body of the five `delivery.*` topics. One delivery to one recipient, identified
        by both Commune's ids and the provider's message id, so a consumer can reconcile with its own
        provider logs.
      required:
      - delivery_id
      - article_id
      - send_id
      - subscriber_id
      - email
      - status
      properties:
        delivery_id:
          type: string
          format: uuid
          description: Commune's identifier for this delivery.
        article_id:
          type: string
          format: uuid
        send_id:
          type: string
          format: uuid
          description: The send run this delivery belonged to.
        subscriber_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          description: The address as it was at send time. Snapshotted onto the delivery row, so it does
            not follow a later change to the subscriber.
        provider_message_id:
          type:
          - string
          - 'null'
          description: The email provider's id for this message, the correlator the inbound webhook matched
            on. Null only if the row was written without one.
        status:
          type: string
          enum:
          - queued
          - sent
          - delivered
          - opened
          - clicked
          - bounced
          - complained
          - failed
          description: 'The delivery row''s status after this event was applied. Because the state machine
            is forward-only, it is not always the event''s own name: an open recorded after a click leaves
            the row on `clicked`.'
    DeliveryOpenedEvent:
      title: Delivery opened
      description: The recipient opened the message.
      allOf:
      - $ref: '#/components/schemas/EventEnvelope'
      - type: object
        properties:
          type:
            const: delivery.opened
          data:
            $ref: '#/components/schemas/DeliveryEventData'
    DomainVerifiedData:
      type: object
      required:
      - domain_id
      - domain
      - verified_at
      properties:
        domain_id:
          type: string
          format: uuid
        domain:
          type: string
          description: 'The hostname now serving the newsletter''s site. Always a subdomain: apex domains
            cannot CNAME and are rejected before they get this far.'
        ssl_status:
          type:
          - string
          - 'null'
          description: The certificate authority's sub-status, kept for display. The aggregate `active`
            state is what Commune actually branches on.
        verified_at:
          type: string
          format: date-time
    DomainVerifiedEvent:
      title: Custom website domain verified
      description: A creator's custom website domain went live.
      allOf:
      - $ref: '#/components/schemas/EventEnvelope'
      - type: object
        properties:
          type:
            const: domain.verified
          data:
            $ref: '#/components/schemas/DomainVerifiedData'
    EventEnvelope:
      type: object
      title: Event envelope
      description: 'The shape every message on every topic shares. The concrete event schemas below narrow
        `type` and fill in `data`; nothing else varies.


        Two fields describe where a change came from rather than what changed: `actor` and `idempotency_key`.
        Both are filled in on a change made through this API''s write operations and are `null` on every
        other change, which is most of them. Null is the common case and is not a signal that something
        went missing.


        Deduping: `id` is unique per event and stable across redeliveries of that event, which makes it
        the correct dedupe key. `idempotency_key` is a second, different tool, and it answers two questions
        `id` cannot. It collapses the events caused by one retried write, because a retry that really
        did the work twice produces two ids and one key. And it tells a consumer which events its own
        writes caused, which is what stops a consumer that reacts by writing from reacting to itself for
        ever. See `idempotency_key` below.'
      required:
      - id
      - type
      - api_version
      - occurred_at
      - newsletter_id
      - actor
      - idempotency_key
      - data
      properties:
        id:
          type: string
          format: uuid
          description: Unique id for this event. Stable across redeliveries, so it is the dedupe key.
            Assigned when the state change is recorded rather than when the message is dispatched.
          examples:
          - 018f2a8b-6c4b-7d2e-9f11-6a1c3d5e7b90
        type:
          type: string
          description: The topic name, identical to the channel address. Route on this.
          examples:
          - article.published
        api_version:
          type: string
          description: The `Commune-Version` value this payload conforms to. Present on the message itself,
            not only on the request header, so an event persisted to a consumer's own store stays self-describing.
          examples:
          - '2026-08-26'
        occurred_at:
          type: string
          format: date-time
          description: RFC 3339 timestamp of the state change, not of the delivery attempt. Use it to
            order events, since delivery order is not guaranteed.
        newsletter_id:
          type:
          - string
          - 'null'
          format: uuid
          description: 'The newsletter the change belongs to. This is the tenant boundary: a consumer
            only ever receives events for newsletters its credential can read. Null only for events that
            are genuinely not newsletter-scoped, which none of the topics Commune publishes currently
            are.'
        actor:
          $ref: '#/components/schemas/Actor'
        idempotency_key:
          type:
          - string
          - 'null'
          maxLength: 255
          description: 'The `Idempotency-Key` of the API write that caused this change, so a consumer
            can tie an event back to its own request and collapse the duplicates a retried write would
            otherwise produce.


            **This is how a consumer that writes recognises its own work.** Keep the keys you send, and
            skip any event carrying one of them. You chose the value, so you know it before the event
            arrives. `actor` cannot do this job, because Commune''s id for your credential is not something
            this API reports to you.


            Null for every change that did not come in through this API, which is most of them: an edit
            made in Commune, an import, a scheduled job and a delivery result all have no originating
            request to key on.


            **It reaches every endpoint registered for the newsletter**, not only the one that made the
            write, so choose opaque keys such as UUIDs rather than keys carrying your own business identifiers.'
        data:
          type: object
          description: Event-specific body. Narrowed by each concrete event schema below.
    HighlightCreatedData:
      type: object
      title: Highlight created body
      description: 'Body of `highlight.created`. The passage, where it sits in the article, and an opaque
        owner token. No `user_id`: Commune does not attribute a highlight to a named reader.'
      required:
      - highlight_id
      - article_id
      - quote
      - start_offset
      - end_offset
      - owner_key
      - message_id
      - created_at
      properties:
        highlight_id:
          type: string
          format: uuid
          description: Commune's identifier for the highlight.
        article_id:
          type: string
          format: uuid
        quote:
          type: string
          maxLength: 5000
          description: The marked text itself, as plain text, capped at 5000 characters. The surrounding
            prefix and suffix that let a client re-anchor the range are not here; read `GET /highlights/{highlight}`
            for those.
        start_offset:
          type: integer
          minimum: 0
          description: Where the passage starts, as a character offset into the article's normalised plain
            text. Always less than `end_offset`.
        end_offset:
          type: integer
          minimum: 1
          description: Where the passage ends, in the same offsets.
        owner_key:
          type: string
          description: An opaque, stable per highlighter value, scoped to this one article. The same value
            `GET /highlights/{highlight}` returns. Group by it to tell one reader's marks apart from another's.
            It cannot be resolved to a person and does not correlate across articles.
          examples:
          - 4f2a9c1e7b3d6a05
        message_id:
          type:
          - string
          - 'null'
          format: uuid
          description: 'The chat message the reader wrote from this passage, when the highlight was created
            as a discussion. Null for a silent highlight, and it stays null on this topic: attaching a
            message later updates the row rather than creating one.'
        created_at:
          type: string
          format: date-time
    HighlightCreatedEvent:
      title: Highlight created
      description: A reader marked a passage of an article.
      allOf:
      - $ref: '#/components/schemas/EventEnvelope'
      - type: object
        properties:
          type:
            const: highlight.created
          data:
            $ref: '#/components/schemas/HighlightCreatedData'
    ImportCompletedData:
      type: object
      title: Import completed body
      description: Body of `import.completed`. Which kind of run finished, where its rows came from, and
        how much it moved.
      required:
      - kind
      - source
      - imported_count
      - completed_at
      properties:
        kind:
          type: string
          enum:
          - articles
          - subscribers
          - migration
          description: '`articles` and `subscribers` ingest rows. `migration` is the finalize step that
            makes a newsletter `commune`, which ingests nothing.'
        source:
          type:
          - string
          - 'null'
          description: 'Where the rows came from: an ESP slug such as `kit` or `beehiiv`, `csv` for an
            uploaded list, or `rss` for a feed. Null when the run has no single source, which is the `migration`
            case.'
          examples:
          - kit
        imported_count:
          type:
          - integer
          - 'null'
          minimum: 0
          description: 'Subscribers that actually landed. Not the size of what was offered: both import
            paths skip anybody already on the list and leave their existing status alone. Null for `migration`,
            which ingests nothing.


            Subscribers the run could not take are not reported. One bad entry never ends a run, and nothing
            counts the ones that failed, so a number here would be a guess.'
        started_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the run began. Null when it was not recorded, so treat the duration as best
            effort.
        completed_at:
          type: string
          format: date-time
          description: When the run ended. Equal to `occurred_at`.
    ImportCompletedEvent:
      title: Import finished
      description: An article, subscriber or migration run finished.
      allOf:
      - $ref: '#/components/schemas/EventEnvelope'
      - type: object
        properties:
          type:
            const: import.completed
          data:
            $ref: '#/components/schemas/ImportCompletedData'
    MessageCreatedData:
      type: object
      required:
      - message_id
      - thread_id
      - thread_level
      - content
      - created_at
      properties:
        message_id:
          type: string
          format: uuid
        short_id:
          type:
          - string
          - 'null'
        url:
          type:
          - string
          - 'null'
          format: uri
        thread_id:
          type: string
          format: uuid
          description: The top-level thread this reply belongs to.
        parent_id:
          type:
          - string
          - 'null'
          format: uuid
          description: The message being replied to. Equal to `thread_id` for a direct reply, a sibling
            message for a nested one.
        thread_level:
          type: integer
          enum:
          - 1
          - 2
          description: Nesting depth. 1 is a reply to the thread, 2 is a reply to a reply, and nesting
            stops there.
        author:
          $ref: '#/components/schemas/UserRef'
        content:
          type: string
          maxLength: 5000
        created_at:
          type: string
          format: date-time
    MessageCreatedEvent:
      title: Message created
      description: A reply was posted inside a thread.
      allOf:
      - $ref: '#/components/schemas/EventEnvelope'
      - type: object
        properties:
          type:
            const: message.created
          data:
            $ref: '#/components/schemas/MessageCreatedData'
    Send:
      type: object
      title: Send
      description: 'One dispatch of one article to a newsletter''s list.


        The three counts are a `send.completed` event''s three counts under the

        same names. `recipient_count` is the audience size fixed at the moment

        the run started, which is the stable denominator for any rate.

        `sent_count` is what the sending provider accepted at dispatch, which is

        **not** a confirmed delivery: confirmations arrive afterwards, one per

        recipient, as `delivery.delivered`, and are never counted back into this

        shape. `failed_count` is what the provider rejected outright.


        **Read `completed_at` before reading either count.** It is null while

        the run is still going, and until it is stamped `sent_count` and

        `failed_count` are both `0`. They are not a progress report: the

        dispatch settles them once, at the end.


        **The counts are what the run finished on, and they stay there.** A

        later re-attempt of the recipients this run could not reach does not

        move them, so this resource never disagrees with the `send.completed`

        event that announced it.


        **Opens and clicks are not here**, and neither is a `status`. Opens and

        clicks come from the sending provider on its own schedule. A run that

        broke is reported by the article''s own `status`.

        '
      additionalProperties: false
      required:
      - object
      - id
      - article
      - newsletter
      - recipient_count
      - sent_count
      - failed_count
      - created_at
      properties:
        object:
          type: string
          const: send
          description: Always `send`.
        id:
          type: string
          format: uuid
          description: 'Stable identifier for the run. The `send_id` on `send.completed`

            and on `send.failed` is this value.

            '
        article:
          description: 'The article that was dispatched. A `Ref` unless `article` is named in

            `?expand=`, and `null` when the article is one this credential may not

            read. An article dated in the future is hidden from everybody,

            including the newsletter''s own team, so its run reports `null` here

            rather than a reference whose own operation would answer `404`.

            '
          anyOf:
          - type: 'null'
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/Article'
        newsletter:
          description: 'The newsletter that sent it. A `Ref` unless `newsletter` is named in

            `?expand=`.

            '
          oneOf:
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/Newsletter'
        started_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the run began handing recipients to the provider.
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'When the run finished handing every recipient over. Null while it is

            still going, and null for a run that broke before it could finish.

            The counts below mean nothing until this is set.

            '
        recipient_count:
          type: integer
          minimum: 0
          description: Audience size fixed at the moment the run started. The stable denominator for any
            rate a consumer computes.
        sent_count:
          type: integer
          minimum: 0
          description: 'Recipients the provider accepted at dispatch. NOT confirmed deliveries: confirmation
            arrives later as `delivery.delivered`, one event per recipient.'
        failed_count:
          type: integer
          minimum: 0
          description: Recipients the provider rejected outright at dispatch.
        created_at:
          type: string
          format: date-time
          description: 'When the run was recorded, which is the same instant as

            `started_at` for every run Commune has made. The collection is

            ordered by this rather than by `started_at`, which can be absent.

            '
    SendCompletedData:
      type: object
      required:
      - article_id
      - send_id
      - started_at
      - completed_at
      - recipient_count
      - sent_count
      - failed_count
      properties:
        article_id:
          type: string
          format: uuid
        send_id:
          type: string
          format: uuid
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        recipient_count:
          type: integer
          minimum: 0
          description: Audience size fixed at the moment the run started. The stable denominator for any
            rate a consumer computes.
        sent_count:
          type: integer
          minimum: 0
          description: 'Recipients the provider accepted at dispatch. NOT confirmed deliveries: confirmation
            arrives later as `delivery.delivered`, one event per recipient.'
        failed_count:
          type: integer
          minimum: 0
          description: Recipients the provider rejected outright at dispatch.
    SendCompletedEvent:
      title: Send completed
      description: A send run finished handing every recipient to the provider.
      allOf:
      - $ref: '#/components/schemas/EventEnvelope'
      - type: object
        properties:
          type:
            const: send.completed
          data:
            $ref: '#/components/schemas/SendCompletedData'
    SendFailedData:
      type: object
      required:
      - article_id
      - failure_reason
      properties:
        article_id:
          type: string
          format: uuid
        send_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Null when the run broke before it was recorded, which is early enough that there
            is no run to point at.
        failure_reason:
          type: string
          maxLength: 1000
          description: Human-readable, truncated at 1000 characters on write. Meant for display, not for
            branching. Match on the topic, not this string.
    SendFailedEvent:
      title: Send failed
      description: A send run broke and the article was parked in failed.
      allOf:
      - $ref: '#/components/schemas/EventEnvelope'
      - type: object
        properties:
          type:
            const: send.failed
          data:
            $ref: '#/components/schemas/SendFailedData'
    SenderVerifiedData:
      type: object
      required:
      - sender_id
      - from_email
      - domain
      - kind
      - verified_at
      properties:
        sender_id:
          type: string
          format: uuid
        from_email:
          type: string
          format: email
          description: Ready-to-use From address.
        from_name:
          type: string
        reply_to_email:
          type:
          - string
          - 'null'
          format: email
        domain:
          type: string
          description: The sending domain that was verified.
        kind:
          type: string
          enum:
          - commune
          - custom
          description: '`commune` is a Commune-provisioned subdomain, `custom` is a domain the creator
            owns and pointed at Commune.'
        is_default:
          type: boolean
          description: Whether this is the newsletter's default sender, the one used when an article does
            not pin a specific one.
        verified_at:
          type: string
          format: date-time
    SenderVerifiedEvent:
      title: Sender verified
      description: A sending identity passed verification and can now send.
      allOf:
      - $ref: '#/components/schemas/EventEnvelope'
      - type: object
        properties:
          type:
            const: sender.verified
          data:
            $ref: '#/components/schemas/SenderVerifiedData'
    SubscriberCreatedData:
      type: object
      required:
      - subscriber_id
      - email
      - status
      - resubscribed
      - created_at
      properties:
        subscriber_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        status:
          type: string
          enum:
          - subscribed
          - unsubscribed
          - bounced
          - complained
          - pending
        user_id:
          type:
          - string
          - 'null'
          description: The Commune account behind this subscriber, when there is one. Null for an address
            imported from an ESP or CSV that never signed up.
        acquisition_source:
          type:
          - string
          - 'null'
          description: How a subscriber was imported, fixed when they were first recorded so a later migration
            between providers cannot relabel it. An ESP import stamps that provider's slug and a CSV upload
            stamps `csv`. Set only on those two paths, so it is null for a subscriber who subscribed in
            the Commune app, finished signup, or accepted an invitation. `commune` and `imported` appear
            on old subscribers labelled before this field existed; nothing writes either today.
        resubscribed:
          type: boolean
          description: True when an existing unsubscribed subscriber came back to `subscribed`, rather
            than a new subscriber being recorded.
        created_at:
          type: string
          format: date-time
          description: When the subscriber row was first created. On a resubscribe this is the ORIGINAL
            creation time, not the reactivation, which is `occurred_at`.
    SubscriberCreatedEvent:
      title: Subscriber created
      description: Someone became a subscriber, or an unsubscribed one came back.
      allOf:
      - $ref: '#/components/schemas/EventEnvelope'
      - type: object
        properties:
          type:
            const: subscriber.created
          data:
            $ref: '#/components/schemas/SubscriberCreatedData'
    SubscriberStatusChangedData:
      type: object
      description: 'Body of `subscriber.status_changed`. Identifiers plus what describes the crossing,
        and not the insight itself: read `GET /newsletters/{newsletter}/insights` for the full scored
        row.'
      required:
      - subscriber_id
      - user_id
      - email
      - previous_status
      - status
      - direction
      - total_score
      - velocity
      properties:
        subscriber_id:
          type: string
          format: uuid
          description: The subscriber this score belongs to, the same identifier the other `subscriber.*`
            topics carry.
        user_id:
          type: string
          description: 'The Commune account the score is attributed to. Insights are keyed on the account
            rather than on the subscription, because half the signal is community activity that belongs
            to a person and not to a mailing list entry. Always present: an unscored subscriber cannot
            cross a boundary.'
        email:
          type: string
          format: email
          description: Where the newsletter reaches this reader, so a consumer can match the event against
            its own records without a second call. Resolved from the Commune account when the subscription
            row itself carries no address.
        previous_status:
          oneOf:
          - $ref: '#/components/schemas/InsightStatus'
          - type: 'null'
          description: The status this reader held before the pass. Null the first time a reader is scored,
            which is a real crossing rather than missing data.
        status:
          $ref: '#/components/schemas/InsightStatus'
        direction:
          type: string
          enum:
          - promoted
          - demoted
          description: Which way along the ladder the reader moved, derived from the two statuses so a
            consumer does not have to hardcode their order. `promoted` the first time a reader is scored,
            because there is no earlier position they could have fallen from.
        total_score:
          type: integer
          description: The blended score at the moment of the crossing, summed across the community and
            the newsletter's email provider. It has no unit and no ceiling, and is meaningful only ranked
            against the other readers of the same newsletter.
        velocity:
          type: string
          enum:
          - rising
          - cooling
          - steady
          description: 'The last fourteen days of points against the fourteen before them. Read it with
            `direction`: a demotion while `rising` means the audience around this reader moved faster,
            not that the reader slowed down.'
        last_action_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the reader last did anything that earned points. The reader's own clock, not
            the scoring pass's, so it sits earlier than `occurred_at` by up to a full scoring interval.
            Null for a reader who has never acted.
    SubscriberStatusChangedEvent:
      title: Subscriber insight status changed
      description: A reader crossed a boundary in the newsletter's engagement ladder.
      allOf:
      - $ref: '#/components/schemas/EventEnvelope'
      - type: object
        properties:
          type:
            const: subscriber.status_changed
          data:
            $ref: '#/components/schemas/SubscriberStatusChangedData'
    SubscriberTaggedData:
      type: object
      title: Subscriber tagged body
      description: Body of `subscriber.tagged`. Which subscriber, which tag, and which way the membership
        moved.
      required:
      - subscriber_id
      - tag_id
      - tag_name
      - direction
      properties:
        subscriber_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        tag_id:
          type: string
          format: uuid
        tag_name:
          type: string
          description: The tag's name at the time of the change.
        direction:
          type: string
          enum:
          - assigned
          - removed
          description: 'Whether the subscriber joined the segment or left it. Branch on this: it is the
            only thing that differs between the two changes this topic carries.'
    SubscriberTaggedEvent:
      title: Subscriber tag added or removed
      description: A subscriber tag was applied or taken off.
      allOf:
      - $ref: '#/components/schemas/EventEnvelope'
      - type: object
        properties:
          type:
            const: subscriber.tagged
          data:
            $ref: '#/components/schemas/SubscriberTaggedData'
    SubscriberUnsubscribedData:
      type: object
      required:
      - subscriber_id
      - email
      - reason
      - unsubscribed_at
      properties:
        subscriber_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        reason:
          type: string
          enum:
          - self_service
          - bounced
          - complained
          description: '`self_service` is the reader opting out. `bounced` and `complained` are forced
            by delivery telemetry and arrive with the matching `delivery.*` event.'
        unsubscribed_at:
          type: string
          format: date-time
        article_send_id:
          type:
          - string
          - 'null'
          format: uuid
          description: 'The send whose email the reader acted on, when the unsubscribe link carried it.
            Best-effort attribution: null on an in-app unsubscribe, a link without the marker, or a bounce
            or complaint.'
    SubscriberUnsubscribedEvent:
      title: Subscriber unsubscribed
      description: A subscriber stopped being mailable.
      allOf:
      - $ref: '#/components/schemas/EventEnvelope'
      - type: object
        properties:
          type:
            const: subscriber.unsubscribed
          data:
            $ref: '#/components/schemas/SubscriberUnsubscribedData'
    ThreadCreatedData:
      type: object
      required:
      - thread_id
      - visibility
      - content
      - created_at
      properties:
        thread_id:
          type: string
          format: uuid
          description: The thread itself, which is the opening message of the conversation rather than
            a reply within one.
        short_id:
          type:
          - string
          - 'null'
          description: Short public identifier used in thread URLs.
        url:
          type:
          - string
          - 'null'
          format: uri
        author:
          $ref: '#/components/schemas/UserRef'
        content:
          type: string
          maxLength: 5000
          description: The opening message, capped at 5000 characters on write.
        visibility:
          type: string
          enum:
          - public
          - subscribers
          - paid
          description: '`public` puts the thread on the global feed and only team members may set it.
            `subscribers` keeps it in the newsletter''s own space. `paid` is reserved and unused.'
        article_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Set when the thread is an article's discussion. Comments on an article are messages
            in this thread; there is no separate comment resource.
        created_at:
          type: string
          format: date-time
    ThreadCreatedEvent:
      title: Thread created
      description: A new top-level thread was started in a newsletter's space.
      allOf:
      - $ref: '#/components/schemas/EventEnvelope'
      - type: object
        properties:
          type:
            const: thread.created
          data:
            $ref: '#/components/schemas/ThreadCreatedData'
    ThreadPublishedData:
      type: object
      title: Thread published body
      description: Body of `thread.published`. Which thread reached the feed, how it got there, and enough
        to render a feed row without a second call.
      required:
      - thread_id
      - visibility
      - previous_visibility
      - source
      - published_at
      properties:
        thread_id:
          type: string
          format: uuid
          description: The thread. The same id `thread.created` carried, so a consumer that stored that
            event can match on it directly.
        short_id:
          type:
          - string
          - 'null'
          description: Short public identifier used in thread URLs.
        url:
          type:
          - string
          - 'null'
          format: uri
        author:
          $ref: '#/components/schemas/UserRef'
        visibility:
          type: string
          const: public
          description: Always `public`. Present so a payload stays self-describing next to `thread.created`,
            which carries the same field and can carry other values.
        previous_visibility:
          type:
          - string
          - 'null'
          enum:
          - subscribers
          - paid
          - null
          description: What the thread was before. Null when it was created public, which is the case
            `source` also reports.
        source:
          type: string
          enum:
          - created_public
          - visibility_changed
          description: '`created_public` for a thread a team member started public, which fires `thread.created`
            from the same write. `visibility_changed` for one that was featured later.'
        published_by:
          allOf:
          - $ref: '#/components/schemas/UserRef'
          description: 'The team member who put it on the feed. Named `published_by` rather than `actor`
            because the envelope already has an `actor`, and the two mean different things: this is a
            person, and that is the credential a change arrived under.


            Null in two cases. On the `created_public` path a thread was public from the start and nobody
            featured it. On a promotion made through this API there is no person to name, because a credential
            is not one; the envelope''s `actor` carries the credential instead.'
        article_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Set when the thread is an article's discussion rather than a standalone one.
        published_at:
          type: string
          format: date-time
          description: '`visibility_changed_at` on the `visibility_changed` path, the thread''s `created_at`
            on the `created_public` path.'
    ThreadPublishedEvent:
      title: Thread published to the feed
      description: A thread's visibility became public and it hit the global feed.
      allOf:
      - $ref: '#/components/schemas/EventEnvelope'
      - type: object
        properties:
          type:
            const: thread.published
          data:
            $ref: '#/components/schemas/ThreadPublishedData'
    UserRef:
      type:
      - object
      - 'null'
      title: User reference
      description: A pointer to a Commune account, enough to attribute and render something without a
        second call. Null when there is no account to point at, either because there never was one or
        because the account was deleted. Content outlives its author, so a null here is expected rather
        than a sign the reference was lost.
      required:
      - user_id
      properties:
        user_id:
          type: string
        username:
          type:
          - string
          - 'null'
        display_name:
          type:
          - string
          - 'null'
        avatar_url:
          type:
          - string
          - 'null'
          format: uri
