  /tags/{tag}/subscribers:
    parameters:
    - $ref: '#/components/parameters/CommuneVersion'
    - $ref: '#/components/parameters/TagPath'
    post:
      operationId: addTagSubscribers
      summary: Apply a tag to many subscribers
      description: "Puts up to 500 subscribers in this segment in one request, and says\nwhat became of\
        \ each. Needs `audience: write`, and is a write.\n\n**Use this when you have a list**, such as\
        \ a weekly job tagging this\nweek's superfans from `GET /newsletters/{newsletter}/insights`. It\
        \ is\none request against your rate limit however many subscribers it\nnames, where Apply a tag\
        \ to a subscriber\n(`POST /subscribers/{subscriber}/tags/{tag}`) is one request per\nsubscriber.\
        \ Use that one for a single subscriber: it answers `404` for\nan id that is not there, which is\
        \ the clearer answer when there is\nonly one.\n\n**A tag decides what a person can read, not only\
        \ who receives what.**\nAn article addressed to a tag is readable by the people holding it and\n\
        by nobody else, on the web as well as in the inbox. Applying one grants\neach subscriber named\
        \ access to every article that segment was ever\naddressed to, including articles sent before\
        \ this call.\n\n**`subscribers` holds 1 to 500 subscriber ids**, the `id` of each\n`Subscriber`.\
        \ A list that is empty, longer than 500, or holds anything\nthat is not a UUID answers `400` and\
        \ changes nothing. An id repeated in\nthe list counts once and is reported once. The 500 counts\
        \ the list as\nsent, repeats included.\n\n**Outcomes are per subscriber, not all or nothing.**\
        \ Every id in the\nlist comes back in exactly one of three lists:\n\n* `tagged`: holds the tag\
        \ now and did not before.\n* `already_tagged`: held it already. Nothing changes for them, which\n\
        \  is a success, exactly as it is for the single operation.\n* `not_found`: not a subscriber of\
        \ the tag's newsletter. Nothing is\n  written for them and the rest of the list is unaffected.\
        \ An id from\n  another newsletter and an id that exists nowhere are reported the\n  same way.\
        \ Retrying them will not help: check where the ids came from.\n\nThe request is refused as a whole\
        \ only for something true of the whole\nrequest. **A retired tag answers `422`** and tags nobody:\
        \ a retirement\nstops a segment gaining members while it goes on deciding who may read\nthe articles\
        \ it was addressed to. A tag this credential cannot reach\nanswers `404`.\n\n**Retrying is safe.**\
        \ Send the same `Idempotency-Key` and the same list\nand you get the first answer back, replayed,\
        \ with nothing done twice.\nA new key with the same list is a new request: everyone the first\
        \ one\ntagged comes back in `already_tagged`, and nothing is published again.\n\n**The response\
        \ is the tag and three lists of ids**, never a\n`Subscriber`, so this operation never puts an\
        \ email address in a\nresponse.\n\nPublishes `subscriber.tagged` with `direction: assigned` once\
        \ for each\nsubscriber in `tagged`, each its own event, all carrying this request's\n`actor` and\
        \ `idempotency_key`. Nothing is published for\n`already_tagged` or `not_found`. The events are\
        \ written in the same\ntransaction as the tags, so they exist if and only if the tags do.\n"
      tags:
      - Subscriber tags
      security:
      - apiKey: []
      - oauth2:
        - audience:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagAssignmentRequest'
            examples:
              thisWeeksSuperfans:
                summary: Three subscribers to put in the Superfans segment.
                value:
                  subscribers:
                  - 33445566-7788-4990-a1b2-c3d4e5f60718
                  - 44556677-8899-4aa1-b2c3-d4e5f6071829
                  - 9f1e2d3c-4b5a-4c6d-8e7f-0a1b2c3d4e5f
      responses:
        '200':
          description: 'What became of each subscriber, and the tag as it now stands.

            `tagged`, `already_tagged` and `not_found` together hold every id

            the request named, once each, in the order they were sent.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagAssignment'
              examples:
                mixedOutcomes:
                  summary: One newly tagged, one who already held the tag, and one id that is not a subscriber
                    of this newsletter.
                  value:
                    object: tag_assignment
                    tag:
                      object: tag
                      id: cc33dd44-ee55-4f66-8a77-112233445566
                      newsletter:
                        object: newsletter
                        id: 7d3f1c02-58a1-4a4e-9a0b-2f6d1c9e4411
                      name: Superfans
                      known_subscriber_count: 38
                      retired: false
                      retired_at: null
                      created_at: '2026-09-29T09:15:00Z'
                    tagged:
                    - 33445566-7788-4990-a1b2-c3d4e5f60718
                    already_tagged:
                    - 44556677-8899-4aa1-b2c3-d4e5f6071829
                    not_found:
                    - 9f1e2d3c-4b5a-4c6d-8e7f-0a1b2c3d4e5f
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
