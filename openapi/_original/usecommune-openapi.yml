        '500':
          $ref: '#/components/responses/InternalError'
  /articles/{article}/send:
    parameters:
    - $ref: '#/components/parameters/CommuneVersion'
    - $ref: '#/components/parameters/IdempotencyKey'
    - $ref: '#/components/parameters/ArticlePath'
    post:
      operationId: sendArticle
      x-commune-destructive: Emails the article to the list. Mail that has left cannot be recalled, so
        a client should confirm with a person before calling this.
      summary: Send an article to the list
      description: "Sends this article to the newsletter's subscribers. Cannot be undone.\n\n**It answers\
        \ before the article has gone out.** The article is queued\nfor immediate dispatch and the answer\
        \ is `202` with the article as it\nnow stands: `status` is `scheduled` and `scheduled_for` is\
        \ the moment it\nwas queued. Commune begins sending within a few minutes.\n\nWatch `send.completed`\
        \ for the outcome and the counts, or `send.failed`\nif the dispatch broke. `article.published`\
        \ fires when the article goes\nlive on the web. All three carry the credential that asked for\
        \ the send\nand the idempotency key it was made under, so a consumer can tie them\nback to this\
        \ call.\n\n**Six gates.** Four are simple: there has to be an article, a verified\nsending address,\
        \ something in the body, and a status that can be sent\nfrom. An article that is already sending\
        \ or sent answers `422`. The\nother two are worth knowing about before you call this:\n\n* **`missing_footer`**\
        \ (`422`) when the body no longer carries an\n  unsubscribe link or a mailing address. Both are\
        \ seeded into a draft as\n  ordinary content and can be edited away, and commercial email is\n\
        \  required to carry them. The error names which half is gone.\n* **`broken_images`** (`422`)\
        \ when an image definitively will not load,\n  naming the URLs and why each one failed. An inbox\
        \ fetches images when\n  the reader opens the article, so a rotted image is broken for\n  everybody\
        \ and cannot be repaired after the send. Only a definite\n  answer refuses: a merely slow host\
        \ is reported and never blocks. Set\n  `acknowledge_broken_images` to send anyway. That acknowledgement\n\
        \  covers the body as it currently reads and any edit clears it.\n\nAn article addressed to a\
        \ tag goes only to the subscribers holding it.\nAn article with no subscribers to send to is still\
        \ published: it goes\nlive on the web and reports zero recipients.\n\n**Failed deliveries are\
        \ Commune's to follow up.** A recipient the\nsending provider turns away for a moment is retried\
        \ automatically\nduring the send. One that still fails is followed up by Commune's team\nrather\
        \ than re-sent blindly, because some of those may already have\nbeen delivered and a second copy\
        \ is worse than a late one.\n\nPublishes `article.scheduled` when the article is queued, then\n\
        `article.published` and `send.completed` or `send.failed` when the\ndispatch runs.\n"
      tags:
      - Articles
      security:
      - apiKey: []
      - oauth2:
        - sending:write
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendRequest'
      responses:
        '202':
          description: 'The article is queued. `status` is `scheduled` and `scheduled_for` is

            the moment it was queued; sending begins within a few minutes.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/SendLimited'
        '500':
          $ref: '#/components/responses/InternalError'
