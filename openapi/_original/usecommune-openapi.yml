  article.read:
    post:
      operationId: onArticleRead
      summary: Article read
      description: "A reader stayed with an article long enough to have read it. Commune\nrecords this\
        \ when someone has had the article open for ten seconds, or has\nscrolled through it, whichever\
        \ comes first.\n\n**Fires once per reader per article, ever.** It reports the one moment\nthe\
        \ pair crosses from unread to read, so a reader who comes back a year\nlater produces nothing.\
        \ It is a first-time signal, not a visit counter,\nand cannot be summed into one.\n\n**`data.reader`\
        \ names the person.** The same actions are readable as\nengagement records at\n`GET /newsletters/{newsletter}/events?event_type=view`.\n\
        \n**Three things this topic does not report, each of which will make a\ncount built from it wrong.**\n\
        \n* **A reader who is not signed in produces nothing**, so counting these\n  messages counts signed-in\
        \ readers and nothing else. Real readership is\n  higher by however much logged-out traffic the\
        \ newsletter gets, and\n  Commune records nothing durable for an anonymous read, so there is no\n\
        \  figure to correct the total by afterwards. On a newsletter with a\n  public archive that can\
        \ be most of the readership. Treat any number\n  derived from this topic as a floor, label it\
        \ as signed-in readers, and\n  do not call it an open rate or a view count.\n* **Marking articles\
        \ read in bulk produces nothing.** A reader clearing\n  a backlog with \"mark all as read\" is\
        \ declaring they are not going to\n  read those articles. Only reading reaches this topic.\n*\
        \ **A reader who opened an article and left produces nothing.** That is\n  a different fact, it\
        \ has no topic, and its absence is why this is not\n  an open rate.\n\nDelivered as a single HTTPS\
        \ POST to the consumer's registered endpoint,\nwith the message as the JSON request body. Respond\
        \ 2xx to acknowledge.\nAnything else, or a timeout, is retried with backoff, so acknowledge\n\
        fast and do the work afterwards.\n"
      tags:
      - Webhooks
      security: []
      parameters:
      - $ref: '#/components/parameters/WebhookVersion'
      - $ref: '#/components/parameters/WebhookEventId'
      - $ref: '#/components/parameters/WebhookEventType'
