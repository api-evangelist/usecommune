    post:
      operationId: createArticle
      summary: Create an article
      description: "Writes a new article and returns it. Needs `content: write`, and is a\nwrite.\n\n\
        The article's text goes in `content_markdown`, as Markdown: the same\nrendition `GET /articles/{article}`\
        \ returns as `content_markdown` under\n`?expand=content`, so what you read back is what you send.\
        \ HTML is not\naccepted. Commune parses it strictly: text it cannot read answers `400`\nnaming\
        \ the line, and nothing is written, rather than guessing at a\ndocument you did not write and\
        \ sending it to your list.\n\n**What you get is always a draft.** `status`, `posted_at` and\n\
        `scheduled_for` are not properties of the request. A draft is invisible\non every reader surface,\
        \ so nothing this operation does reaches anybody.\nIt goes out through Schedule an article\n(`POST\
        \ /articles/{article}/schedule`) or Send an article to the list (`POST /articles/{article}/send`),\n\
        each of which runs the six gates described on the second before its\nemail leaves Commune.\n\n\
        **Send no body at all and Commune seeds one.** `{}` creates an empty\nuntitled draft: two blank\
        \ lines and an editable unsubscribe line. Send a body and it is stored exactly as sent,\nwith\
        \ nothing appended. The send operations refuse an article whose body\ncarries no unsubscribe mechanism\
        \ and no postal address, so a body you\nintend to send should carry `{{ unsubscribe_url }}` and\
        \ `{{ address }}`.\n\n**Only a newsletter Commune publishes.** A newsletter whose `esp` is\nanything\
        \ but `commune` has its articles written elsewhere and mirrored\ninto Commune afterwards, so there\
        \ is nothing here to create. That\nanswers `422` with the code `not_commune_newsletter`, whose\
        \ `docs_url` is\n`https://usecommune.dev/errors/not_commune_newsletter`, the page on\nwhat the\
        \ refusal means and how to move a newsletter onto Commune.\n\nPublishes no event. A draft has\
        \ neither gone out nor been queued, and\n`status` is what says so until one of those happens.\n\
        \n## The Markdown `content_markdown` takes\n\nHeadings, paragraphs, bold, italic, strikethrough,\
        \ inline code, links,\nimages, blockquotes, bullet and ordered lists, fenced code blocks with\n\
        a language, tables and thematic breaks. A line ending in two spaces or\na backslash is a line\
        \ break; a code fence without a language is stored\nwithout one rather than guessed at.\n\nMerge\
        \ tags survive exactly as written. `{{ subscriber.first_name }}`\nand `{% if %}` are personalization\
        \ rather than Markdown, so nothing\ninside a Liquid construct is escaped or read as formatting.\n\
        \nRaw HTML is refused rather than passed through or dropped. Write a\nliteral `<` as `\\<`.\n\n\
        ## The five components\n\nFive things the editor can hold have no Markdown spelling, so they get\n\
        an MDX-shaped syntax. The set is closed: any other tag name is a `400`.\n\n* `<Section>` ... `</Section>`\
        \ wraps blocks in a styled band. Optional\n  `backgroundColor`, `textColor` (hex, with the `#`),\
        \ `fontFamily`\n  (`sans`, `serif`, `mono`), `fontSize` (a number, in px) and\n  `textAlign` (`left`,\
        \ `center`, `right`).\n* `<EmailOnly>` ... `</EmailOnly>` wraps blocks that belong in the\n  inbox\
        \ and not on the web. This is where the unsubscribe line and the\n  mailing address go: on the\
        \ website there is no subscriber, so the\n  link is dead and the address is noise. Commune seeds\
        \ exactly this\n  into a draft created with no body.\n* `<Button href=\"...\">Label</Button>`\
        \ is a call to action. `href` is\n  required; `alignment` is optional.\n* `<Socials items={[...]}\
        \ />` is a row of linked platform icons. `items`\n  is required and is a JSON array of\n  `{\"\
        platform\": \"...\", \"url\": \"...\", \"imageUrl\": null}`. Optional\n  `align`, `iconColor`\
        \ and `iconBgColor`.\n* `<YouTube url=\"...\" />` is a video. The URL has to be one Commune can\n\
        \  read a video id out of (`youtube.com/watch?v=`, `youtu.be/`,\n  `youtube.com/shorts/` or `youtube.com/embed/`),\
        \ because the email\n  shows a thumbnail built from that id rather than an iframe, which\n  every\
        \ major email client strips.\n\nAttributes are written `name=\"value\"` or `name={json}`. A component\n\
        that holds nothing is written self-closing; one that holds content is\nopened and closed on their\
        \ own lines.\n"
      tags:
      - Articles
      security:
      - apiKey: []
      - oauth2:
        - content:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleCreateRequest'
      responses:
        '201':
          description: 'The article, as created: a draft, with the `id`, `short_id` and `slug`

            every other operation addresses it by. Read it back with

            `GET /articles/{article}` to see the stored body.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
              examples:
                newDraft:
                  summary: A draft with a title and a body, not yet scheduled.
                  value:
                    object: article
                    id: 8f1b7c44-2a19-4d90-b7e2-51d6c3a8f012
                    short_id: Vn3Pq8Zt
                    slug: what-we-learned-in-march
                    newsletter:
                      object: newsletter
                      id: 7d3f1c02-58a1-4a4e-9a0b-2f6d1c9e4411
                    title: What we learned in March
                    preview_text: The third one surprised us.
                    image_url: null
                    external_url: null
                    status: draft
                    is_imported: false
                    posted_at: null
                    scheduled_for: null
                    authors:
                    - object: user
                      id: usr_2Nf8Kq1pWc
                    thread: null
                    stats:
