openapi: 3.2.0
info:
  title: Usecommune Subscriber tags API
  version: '2026-08-26'
  contact:
    name: Commune
    url: https://usecommune.com
    email: support@usecommune.com
  description: 'Operations tagged Subscriber tags across 2 of this provider''s published API definitions: usecommune-openapi.json, usecommune-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.usecommune.com
  description: 'Production. There is no separate sandbox host.

    '
security:
- apiKey: []
tags:
- name: Subscriber tags
  description: A tag segments a newsletter's audience.
paths:
  /newsletters/{newsletter}/tags:
    parameters:
    - $ref: '#/components/parameters/CommuneVersion'
    - $ref: '#/components/parameters/NewsletterPath'
    get:
      operationId: listNewsletterTags
      summary: List a newsletter's tags
      description: 'The newsletter''s live audience tags, alphabetical, each with a count of

        currently subscribed holders. Needs `audience: read`: how a creator segments

        their audience is not public.


        Retired tags are excluded by default. A tag that an already sent article

        was addressed to cannot be deleted outright, because the audience of a

        sent article does not change retroactively, so it is retired instead and

        keeps its assignments. Pass `include_retired=true` to see those when

        rendering the audience of a historical article.'
      tags:
      - Subscriber tags
      security:
      - apiKey: []
      - oauth2:
        - audience:read
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Expand'
      - $ref: '#/components/parameters/Fields'
      - name: include_retired
        in: query
        required: false
        description: 'Include tags that were retired. They still resolve the audience of

          articles sent before they were retired.

          '
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: A page of tags, alphabetical.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ListEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      description: 'The newsletter''s audience tags, alphabetical by

                        `name`, each with a count of how many currently

                        subscribed people hold it. Retired tags are absent

                        unless `include_retired=true` asked for them, so a

                        tag missing from a default read may still be

                        resolving the audience of an article that was already

                        sent.

                        '
                      items:
                        $ref: '#/components/schemas/Tag'
              examples:
                twoLiveTags:
                  summary: Two live tags, alphabetical, with their current holder counts.
                  value:
                    object: list
                    data:
                    - object: tag
                      id: aa11bb22-cc33-4d44-8e55-ff6677889900
                      newsletter:
                        object: newsletter
                        id: 7d3f1c02-58a1-4a4e-9a0b-2f6d1c9e4411
                      name: Founding member
                      known_subscriber_count: 214
                      retired: false
                      retired_at: null
                      created_at: '2025-06-11T08:45:00Z'
                    - object: tag
                      id: bb22cc33-dd44-4e55-9f66-001122334455
                      newsletter:
                        object: newsletter
                        id: 7d3f1c02-58a1-4a4e-9a0b-2f6d1c9e4411
                      name: Paid supporters
                      known_subscriber_count: 1180
                      retired: false
                      retired_at: null
                      created_at: '2025-09-02T14:12:30Z'
                    pagination:
                      has_more: false
                      next_cursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createTag
      summary: Create a tag
      description: 'Makes a new segment of this newsletter''s audience. Needs

        `audience: write`, and is a write.


        The tag starts empty. Nobody holds it and no article is addressed to

        it, so creating one grants nobody access to anything. People are put in

        it by Apply a tag to a subscriber

        (`POST /subscribers/{subscriber}/tags/{tag}`), or by Apply a tag to

        many subscribers (`POST /tags/{tag}/subscribers`) for a list, which are

        the calls that decide access, and an article is addressed to it when it

        is sent.


        `name` has to be unique among this newsletter''s live tags. A name a

        live tag already has answers `422`. A name freed by a retirement is

        available again, and taking it does not disturb the retired tag, which

        goes on resolving the audience of the articles it was addressed to.


        Publishes no event.'
      tags:
      - Subscriber tags
      security:
      - apiKey: []
      - oauth2:
        - audience:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagCreateRequest'
      responses:
        '201':
          description: 'The tag, as created. Empty, live, and addressable by `id`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
              examples:
                newSegment:
                  summary: A segment with nobody in it yet.
                  value:
                    object: tag
                    id: cc33dd44-ee55-4f66-8a77-112233445566
                    newsletter:
                      object: newsletter
                      id: 7d3f1c02-58a1-4a4e-9a0b-2f6d1c9e4411
                    name: Founding member
                    known_subscriber_count: 0
                    retired: false
                    retired_at: null
                    created_at: '2026-09-29T09:15:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    servers:
    - url: https://api.usecommune.com
      description: 'Production. There is no separate sandbox host.

        '
  /tags/{tag}:
    parameters:
    - $ref: '#/components/parameters/CommuneVersion'
    - $ref: '#/components/parameters/TagPath'
    get:
      operationId: getTag
      summary: Retrieve a tag
      description: 'Read one tag by `id`, retired or not. Needs `audience: read`, on a

        newsletter the credential reaches.'
      tags:
      - Subscriber tags
      security:
      - apiKey: []
      - oauth2:
        - audience:read
      parameters:
      - $ref: '#/components/parameters/Expand'
      - $ref: '#/components/parameters/Fields'
      responses:
        '200':
          description: The tag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateTag
      summary: Rename a tag
      description: 'Changes what a segment is called. Needs `audience: write`, and is a

        write.


        `name` is the only thing about a tag that can be changed, and changing

        it moves nothing else. The people holding the tag still hold it, and

        every article addressed to it is still addressed to it, because an

        article names a tag by `id` rather than by name. A rename is a label,

        never a change of who may read what.


        The new name has to be free among this newsletter''s live tags; one a

        live tag already has answers `422`.


        **A retired tag cannot be renamed**, and answers `422`. A retirement is

        the surviving record of what an already sent article was addressed to,

        and renaming it would relabel an audience that has already gone out.


        Publishes no event.'
      tags:
      - Subscriber tags
      security:
      - apiKey: []
      - oauth2:
        - audience:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagUpdateRequest'
      responses:
        '200':
          description: 'The tag, as it now stands. `known_subscriber_count` is unchanged by

            a rename, which is the point.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteTag
      summary: Delete a tag
      description: 'Removes a tag, or retires it. Which of the two happened is in

        `outcome`, and the two are not the same act: one ends the tag, and the

        other does not. Needs `audience: write`, and is a write.


        **`deleted`.** No article was ever addressed to this tag, so it is

        removed outright and its assignments go with it. Asking for it

        afterwards answers `404`. Creating a tag and changing your mind leaves

        nothing behind.


        **`retired`.** An article was addressed to this tag, so the tag is kept

        and marked retired instead, because the audience of an article that has

        already been sent does not change retroactively. That has four

        consequences, and the first is the one to read twice:


        * **Everyone holding the tag goes on holding it, and goes on being able

        to read every article it was addressed to**, on the web as well as in

        the inbox, evaluated live on every read rather than settled at send

        time. `tag.known_subscriber_count` in the response is what it was, not

        zero. **Retiring a tag revokes nobody''s access to anything.**

        * It stops being offered. It is absent from the tag list unless

        `include_retired=true` asks for it, and no new holder can be added,

        because Apply a tag to a subscriber refuses a retired tag.

        * It stays addressable. `GET /tags/{tag}` resolves it either way, so a

        client rendering the audience of an article sent last year still

        finds the name behind the identifier.

        * Its name is free for a new tag to take.


        **If what you want is to take access away, take the tag off the people

        holding it** with Take a tag off a subscriber

        (`DELETE /subscribers/{subscriber}/tags/{tag}`), one subscriber at a

        time. That operation works on a retired tag for exactly this reason.

        Deleting the tag is not that operation and cannot be made into it.


        **Retirement is final.** Deleting a tag that is already retired answers

        `200` with the retirement it already made and never removes the row:

        the holders a retirement kept are the ones still deciding who may read

        what the tag was addressed to.


        Publishes no event.'
      tags:
      - Subscriber tags
      security:
      - apiKey: []
      - oauth2:
        - audience:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 'What became of the tag. Read `outcome` before anything else: a

            `retired` tag is still deciding who may read the articles it was

            addressed to.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagDeletion'
              examples:
                removedOutright:
                  summary: No article was addressed to it, so it is gone and so are its assignments.
                  value:
                    object: tag_deletion
                    id: cc33dd44-ee55-4f66-8a77-112233445566
                    outcome: deleted
                    tag: null
                retiredInstead:
                  summary: An article was addressed to it, so it is kept and its 214 holders keep their access to that article.
                  value:
                    object: tag_deletion
                    id: aa11bb22-cc33-4d44-8e55-ff6677889900
                    outcome: retired
                    tag:
                      object: tag
                      id: aa11bb22-cc33-4d44-8e55-ff6677889900
                      newsletter:
                        object: newsletter
                        id: 7d3f1c02-58a1-4a4e-9a0b-2f6d1c9e4411
                      name: Founding member
                      known_subscriber_count: 214
                      retired: true
                      retired_at: '2026-09-29T09:15:00Z'
                      created_at: '2025-06-11T08:45:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    servers:
    - url: https://api.usecommune.com
      description: 'Production. There is no separate sandbox host.

        '
  /tags/{tag}/subscribers:
    parameters:
    - $ref: '#/components/parameters/CommuneVersion'
    - $ref: '#/components/parameters/TagPath'
    post:
      operationId: addTagSubscribers
      summary: Apply a tag to many subscribers
      description: 'Puts up to 500 subscribers in this segment in one request, and says

        what became of each. Needs `audience: write`, and is a write.


        **Use this when you have a list**, such as a weekly job tagging this

        week''s superfans from `GET /newsletters/{newsletter}/insights`. It is

        one request against your rate limit however many subscribers it

        names, where Apply a tag to a subscriber

        (`POST /subscribers/{subscriber}/tags/{tag}`) is one request per

        subscriber. Use that one for a single subscriber: it answers `404` for

        an id that is not there, which is the clearer answer when there is

        only one.


        **A tag decides what a person can read, not only who receives what.**

        An article addressed to a tag is readable by the people holding it and

        by nobody else, on the web as well as in the inbox. Applying one grants

        each subscriber named access to every article that segment was ever

        addressed to, including articles sent before this call.


        **`subscribers` holds 1 to 500 subscriber ids**, the `id` of each

        `Subscriber`. A list that is empty, longer than 500, or holds anything

        that is not a UUID answers `400` and changes nothing. An id repeated in

        the list counts once and is reported once. The 500 counts the list as

        sent, repeats included.


        **Outcomes are per subscriber, not all or nothing.** Every id in the

        list comes back in exactly one of three lists:


        * `tagged`: holds the tag now and did not before.

        * `already_tagged`: held it already. Nothing changes for them, which

        is a success, exactly as it is for the single operation.

        * `not_found`: not a subscriber of the tag''s newsletter. Nothing is

        written for them and the rest of the list is unaffected. An id from

        another newsletter and an id that exists nowhere are reported the

        same way. Retrying them will not help: check where the ids came from.


        The request is refused as a whole only for something true of the whole

        request. **A retired tag answers `422`** and tags nobody: a retirement

        stops a segment gaining members while it goes on deciding who may read

        the articles it was addressed to. A tag this credential cannot reach

        answers `404`.


        **Retrying is safe.** Send the same `Idempotency-Key` and the same list

        and you get the first answer back, replayed, with nothing done twice.

        A new key with the same list is a new request: everyone the first one

        tagged comes back in `already_tagged`, and nothing is published again.


        **The response is the tag and three lists of ids**, never a

        `Subscriber`, so this operation never puts an email address in a

        response.


        Publishes `subscriber.tagged` with `direction: assigned` once for each

        subscriber in `tagged`, each its own event, all carrying this request''s

        `actor` and `idempotency_key`. Nothing is published for

        `already_tagged` or `not_found`. The events are written in the same

        transaction as the tags, so they exist if and only if the tags do.'
      tags:
      - Subscriber tags
      security:
      - apiKey: []
      - oauth2:
        - audience:write
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagAssignmentRequest'
            examples:
              thisWeeksSuperfans:
                summary: Three subscribers to put in the Superfans segment.
                value:
                  subscribers:
                  - 33445566-7788-4990-a1b2-c3d4e5f60718
                  - 44556677-8899-4aa1-b2c3-d4e5f6071829
                  - 9f1e2d3c-4b5a-4c6d-8e7f-0a1b2c3d4e5f
      responses:
        '200':
          description: 'What became of each subscriber, and the tag as it now stands.

            `tagged`, `already_tagged` and `not_found` together hold every id

            the request named, once each, in the order they were sent.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagAssignment'
              examples:
                mixedOutcomes:
                  summary: One newly tagged, one who already held the tag, and one id that is not a subscriber of this newsletter.
                  value:
                    object: tag_assignment
                    tag:
                      object: tag
                      id: cc33dd44-ee55-4f66-8a77-112233445566
                      newsletter:
                        object: newsletter
                        id: 7d3f1c02-58a1-4a4e-9a0b-2f6d1c9e4411
                      name: Superfans
                      known_subscriber_count: 38
                      retired: false
                      retired_at: null
                      created_at: '2026-09-29T09:15:00Z'
                    tagged:
                    - 33445566-7788-4990-a1b2-c3d4e5f60718
                    already_tagged:
                    - 44556677-8899-4aa1-b2c3-d4e5f6071829
                    not_found:
                    - 9f1e2d3c-4b5a-4c6d-8e7f-0a1b2c3d4e5f
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    servers:
    - url: https://api.usecommune.com
      description: 'Production. There is no separate sandbox host.

        '
  /subscribers/{subscriber}/tags/{tag}:
    parameters:
    - $ref: '#/components/parameters/CommuneVersion'
    - $ref: '#/components/parameters/IdempotencyKey'
    - $ref: '#/components/parameters/SubscriberPath'
    - $ref: '#/components/parameters/TagPath'
    post:
      operationId: addSubscriberTag
      summary: Apply a tag to a subscriber
      description: 'Puts this subscriber in this segment. Needs `audience: write`.


        One subscriber per request. To tag a list of them, up to 500 at a

        time, use Apply a tag to many subscribers

        (`POST /tags/{tag}/subscribers`), which costs one request however many

        it names and reports what became of each.


        **A tag decides what a person can read, not only who receives what.** An

        article addressed to a tag is readable by the people holding it and by

        nobody else, on the web as well as in the inbox. Applying one grants

        access to every article that segment was ever addressed to, including

        articles sent before this call. Removing one revokes that access

        immediately.


        Applying a tag the subscriber already holds succeeds, changes nothing

        and publishes no event.


        **A retired tag answers `422`.** A retirement stops a segment gaining

        members while it goes on deciding who may read the articles it was

        addressed to. Removing a retired tag still works, since taking a tag off

        only ever narrows what somebody can read.


        **The response is the tag, not the subscriber**, so this operation never

        puts an email address in a response.


        Publishes `subscriber.tagged` with `direction: assigned`, unless the

        subscriber already held the tag.'
      tags:
      - Subscriber tags
      security:
      - apiKey: []
      - oauth2:
        - audience:write
      responses:
        '200':
          description: 'The tag, as it now stands. `known_subscriber_count` includes this

            subscriber if they are currently subscribed.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: removeSubscriberTag
      summary: Take a tag off a subscriber
      description: 'Removes this subscriber from this segment. Needs `audience: write`.


        A tag decides what a person can read, so taking one off revokes this

        person''s access to every article that segment was addressed to, with

        effect from the next page they load.


        Removing a tag the subscriber does not hold succeeds, changes nothing

        and publishes no event.


        **Works on a retired tag**, where applying one does not: taking a tag

        off can only ever narrow what somebody can read.


        Publishes `subscriber.tagged` with `direction: removed`, unless the

        subscriber did not hold the tag.'
      tags:
      - Subscriber tags
      security:
      - apiKey: []
      - oauth2:
        - audience:write
      responses:
        '200':
          description: 'The tag, as it now stands.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    servers:
    - url: https://api.usecommune.com
      description: 'Production. There is no separate sandbox host.

        '
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'A value of your choosing naming the change this request is making.


        Send the same value again to retry the same request. Commune replays

        the answer the first attempt gave instead of making the change twice,

        and marks the replay with an `Idempotent-Replay: true` response header.

        Send a different value for a different change: a key reused for a

        request that differs in any way answers `409`, because replaying an

        answer to a question you did not ask is a wrong answer you could not

        detect.


        A UUID per change is the usual choice. Remembered for 24 hours, per

        credential, so two credentials choosing the same value never see each

        other''s answers.


        Required, not optional.

        '
      schema:
        type: string
        minLength: 1
        maxLength: 255
      examples:
        uuid:
          summary: A UUID per change
          value: 3f7c1a26-9b0e-4f5a-9a2c-2c8f1d6b4e77
    Limit:
      name: limit
      in: query
      required: false
      description: 'How many items to return in this page. This is a page size, not an

        offset. Fewer items than requested may come back and that does not mean

        the collection is exhausted, only an absent `next_cursor` does.

        '
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Expand:
      name: expand
      in: query
      required: false
      description: 'Comma-separated list of relationship paths to inline in the response.

        Unexpanded relationships are returned as a reference object carrying

        only `id` and `object`. Each operation documents the paths it accepts,

        and an unknown path answers `400`. Nested paths use a dot, for example

        `article.newsletter`.

        '
      schema:
        type: string
      examples:
        singleRelation:
          summary: Inline the newsletter of each item
          value: newsletter
        nestedRelation:
          summary: Inline the newsletter of the article of each item
          value: article.newsletter
        secondRendition:
          summary: Add the Markdown rendition of an article body
          value: content
    Fields:
      name: fields
      in: query
      required: false
      description: 'Comma-separated allow-list of top level properties to return on each

        object, so a client can trim a response it does not need in full. `id`

        and `object` are always returned. An unknown property name answers

        `400`. Properties omitted by an operation, such as `content` on any

        article list, cannot be brought back with `fields`.

        '
      schema:
        type: string
      examples:
        trimmed:
          summary: Only the fields a link list needs
          value: title,slug,posted_at
    TagPath:
      name: tag
      in: path
      required: true
      description: The tag's `id`. A tag has no short id.
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      description: 'The `pagination.next_cursor` value from the previous page. Omit it to

        read the first page. A cursor is opaque, is only valid for the same

        operation with the same filters, and is not a durable identifier.

        '
      schema:
        type: string
        maxLength: 512
    CommuneVersion:
      name: Commune-Version
      in: header
      required: false
      description: 'The contract version this request is written against. Every version

        published so far is a release date (`YYYY-MM-DD`), which is why the

        examples look like one, but the value is an opaque identifier: match it

        against the versions this API publishes rather than parsing it, because

        a future one may not be only a date. An unknown value answers `400`

        with `invalid_version`.


        Omitting the header pins the request to the version that was current

        when the API key was issued, so an integration keeps working when a

        newer version ships.

        '
      schema:
        type: string
        minLength: 1
        examples:
        - '2026-08-26'
    NewsletterPath:
      name: newsletter
      in: path
      required: true
      description: 'The newsletter''s `id` (a UUID) or its `handle`. A handle is unique

        across Commune and is the identifier its public web profile uses, so it

        is the one to hardcode in an integration.

        '
      schema:
        type: string
      examples:
        byId:
          summary: By UUID
          value: 9a4c1c6e-0f2b-4f47-9d3f-6d1b1a2c3d4e
        byHandle:
          summary: By handle
          value: the-weekly
    SubscriberPath:
      name: subscriber
      in: path
      required: true
      description: 'The subscriber''s `id`. This identifies one person''s membership of one

        newsletter, not the person, and a subscriber has no short id.

        '
      schema:
        type: string
        format: uuid
  schemas:
    Error:
      type: object
      title: Error
      description: 'The error envelope. Every non `2xx` response from every operation has

        this shape, so a client can branch on `error.code` without knowing which

        operation produced it.

        '
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: 'A human readable sentence describing what went wrong. Written

                for a developer reading a log, not for an end user. Do not

                branch on it, branch on `code`.

                '
              examples:
              - Newsletter not found.
            param:
              type: string
              description: 'The query, path or body parameter the error is attributed to,

                when the error is attributable to exactly one. Absent otherwise.

                '
              examples:
              - cursor
            allowed_values:
              type: array
              description: 'Everything `param` would have accepted, when what it accepts is

                a finite set. Absent when it is not: a cursor, an identifier or

                a numeric range has nothing to enumerate, and an empty array

                would read as "nothing is allowed".


                It repeats what `message` says in prose, so a caller can correct

                a request from this one response: the array is what a program

                branches on, the sentence is what a person or a model reads.


                On an unknown parameter name rather than an unknown value, this

                carries the parameter names the operation does accept, since

                that is the set the caller has to pick from.


                On an `insufficient_scope` failure there is usually no

                parameter at fault and `param` is absent, and this carries the

                one permission that was needed, written the way the permission

                table writes it, such as `content: read`. The exception is a

                credential that may call the operation but not with one value

                of a parameter, such as `?expand=subscriber` on

                `listNewsletterInsights` without `audience: read`: then `param`

                names the parameter and this carries the values this credential

                may send instead.

                '
              items:
                type: string
              examples:
              - - subscribed
                - unsubscribed
                - bounced
                - complained
                - pending
            request_id:
              type: string
              description: 'Identifier for this request, echoed in the `Commune-Request-Id`

                response header. Quote it in support requests.

                '
              examples:
              - req_01j9c8h1q7m3n4p5r6s7t8u9v0
            docs_url:
              type: string
              format: uri
              description: 'Link to the documentation for this error code: always

                `https://usecommune.dev/errors/` followed by the code, a page

                on what the code means, what usually causes it and how to fix

                it.

                '
              examples:
              - https://usecommune.dev/errors/not_found
    Media:
      type: object
      title: Media
      description: An image or file attached to a thread or a message.
      additionalProperties: false
      required:
      - url
      properties:
        url:
          type: string
          format: uri
          description: Where the attachment is served from.
        type:
          type:
          - string
          - 'null'
          description: 'The attachment''s media type when Commune recorded one, for example

            `image/png`. Null for an attachment old enough that none was

            recorded.

            '
        thumbnail:
          type:
          - string
          - 'null'
          format: uri
          description: A smaller rendition, when one was generated.
    Article:
      type: object
      title: Article
      description: 'One article of a newsletter, without its body. Every collection of

        articles returns this shape. `GET /articles/{article}` returns

        `ArticleWithContent`, which is this plus `content`.

        '
      required:
      - object
      - id
      - short_id
      - slug
      - newsletter
      - status
      - is_imported
      - created_at
      properties:
        object:
          type: string
          const: article
          description: Always `article`.
        id:
          type: string
          format: uuid
          description: Stable identifier.
        short_id:
          type: string
          description: 'Eight character base62 identifier, unique across Commune. Safe in a

            URL and accepted anywhere `{article}` is.

            '
          examples:
          - k7Rm2xQp
        slug:
          type: string
          description: 'URL segment under the newsletter, unique within it but not across

            Commune. The permalink is `/n/{handle}/a/{slug}`. Falls back to the

            `short_id` for an untitled article.

            '
        newsletter:
          description: 'The newsletter this article belongs to. A `Ref` unless `newsletter` is

            named in `?expand=`.

            '
          oneOf:
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/Newsletter'
        title:
          type:
          - string
          - 'null'
          description: Subject line of the article. Null for an untitled draft.
        preview_text:
          type:
          - string
          - 'null'
          description: 'The short line email clients show after the subject, and what

            Commune uses as the excerpt on a card.

            '
        image_url:
          type:
          - string
          - 'null'
          format: uri
          description: 'Cover image. When the creator set none, Commune stamps the first

            image in the body at send time, so this is usually populated for a

            sent article.

            '
        external_url:
          type:
          - string
          - 'null'
          format: uri
          description: 'The article''s canonical URL on the newsletter''s own provider, for an

            imported article. Null for one written in Commune.

            '
        status:
          $ref: '#/components/schemas/ArticleStatus'
        is_imported:
          type: boolean
          description: '`true` when the article came in from the newsletter''s provider,

            `false` when it was written and sent in Commune.

            '
        posted_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'When the article went out. An article dated in the future is not

            returned by any read operation until that moment passes, so this is

            never ahead of now in a response.

            '
        scheduled_for:
          type:
          - string
          - 'null'
          format: date-time
          description: 'When a queued article may go out. Set while `status` is `scheduled`

            and null otherwise.


            This is not `posted_at` and the difference matters: a queued article

            has no publication date yet, which is why it stays invisible on

            every reader surface until it really goes out. Commune dispatches

            in passes, so this is the moment from which the article may go rather

            than the moment it will.

            '
        authors:
          type: array
          description: 'The byline, in order. Each entry is a `Ref` unless `authors` is

            named in `?expand=`. Empty when no Commune account is credited.

            '
          items:
            anyOf:
            - $ref: '#/components/schemas/Ref'
            - $ref: '#/components/schemas/User'
        thread:
          description: 'The chat thread this article opened, where its discussion lives.

            `null` when the newsletter does not open a thread per article. A `Ref`

            unless `thread` is named in `?expand=`.

            '
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/Thread'
        stats:
          $ref: '#/components/schemas/ArticleStats'
        created_at:
          type: string
          format: date-time
          description: When the row was created in Commune.
        updated_at:
          type: string
          format: date-time
          description: When the article was last edited.
    User:
      type: object
      title: User
      description: 'A person''s public profile, and the whole of what this API returns about

        anybody other than the credential''s own owner. Email address, theme,

        notification preferences, push subscriptions, read state and saved

        articles are never carried.

        '
      additionalProperties: false
      required:
      - object
      - id
      properties:
        object:
          type: string
          const: user
          description: Always `user`.
        id:
          type: string
          description: Stable identifier.
        username:
          type:
          - string
          - 'null'
          description: 'The unique handle the profile resolves on at `/@{username}`. Null

            for an account that has not finished signing up.

            '
        display_name:
          type:
          - string
          - 'null'
          description: The name shown next to their messages and bylines.
        avatar:
          type:
          - string
          - 'null'
          format: uri
          description: 'Profile picture. Commune falls back to a generated avatar when the

            person never set one, so this is rarely null in practice.

            '
    Esp:
      type: string
      title: Esp
      description: 'Where a newsletter is published from. `commune` means Commune itself

        sends the email. Every other value is an email service provider whose

        posts Commune imports. `rss` covers any feed that is not one of the

        named providers.

        '
      enum:
      - commune
      - beehiiv
      - buttondown
      - ghost
      - kit
      - mailchimp
      - mailerlite
      - rss
      - substack
    TagCreateRequest:
      type: object
      title: TagCreateRequest
      description: A new, empty segment of the newsletter's audience.
      additionalProperties: false
      required:
      - name
      properties:
        name:
          $ref: '#/components/schemas/TagName'
      examples:
      - name: Founding member
    Pagination:
      type: object
      title: Pagination
      description: 'Cursor pagination state. Commune never exposes an offset or a page

        number: a collection is a moving window, and an offset silently skips or

        repeats items when the window shifts between two requests.

        '
      additionalProperties: false
      required:
      - has_more
      - next_cursor
      properties:
        has_more:
          type: boolean
          description: 'Whether another page exists. When `false`, `next_cursor` is `null`.

            '
        next_cursor:
          type:
          - string
          - 'null'
          description: 'Pass this back as `?cursor=` to read the next page. `null` on the

            last page. Opaque, and valid only for the same operation with the

            same filters.

            '
          examples:
          - Y3Vyc29yOjE3NTY0MjM2MDAwMDA6MDE5MmM4
    TagUpdateRequest:
      type: object
      title: TagUpdateRequest
      description: 'A tag''s new name. The only thing about a tag that can be changed: who

        holds it is moved by applying it to subscribers and taking it off them,

        and whether it is retired is decided by deleting it.

        '
      additionalProperties: false
      required:
      - name
      properties:
        name:
          $ref: '#/components/schemas/TagName'
      examples:
      - name: Founding members
    Newsletter:
      type: object
      title: Newsletter
      description: 'A newsletter and its public profile. Nothing operational is exposed:

        ESP credentials, OAuth tokens, group and audience ids, feed polling

        state and language detection bookkeeping all stay server side.

        '
      additionalProperties: false
      required:
      - object
      - id
      - handle
      - name
      - esp
      - created_at
      properties:
        object:
          type: string
          const: newsletter
          description: Always `newsletter`.
        id:
          type: string
          format: uuid
          description: Stable identifier.
        handle:
          type: string
          description: 'The short, unique, URL safe name. Resolves the public profile at

            `/n/{handle}` and is accepted anywhere `{newsletter}` is.

            '
          examples:
          - the-weekly
        name:
          type: string
          description: Display name, as the creator writes it.
        description:
          type:
          - string
          - 'null'
          description: 'The profile blurb. Sanitised HTML, not plain text, because creators

            format it. Treat it as untrusted markup and render it in a

            sandboxed context.

            '
        esp:
          $ref: '#/components/schemas/Esp'
        image_url:
          type:
          - string
          - 'null'
          format: uri
          description: Square avatar for the newsletter.
        website_url:
          type:
          - string
          - 'null'
          format: uri
          description: The creator's own site, if they linked one.
        social_links:
          $ref: '#/components/schemas/SocialLinks'
        language:
          type:
          - string
          - 'null'
          description: 'Best known language of the newsletter''s writing as a BCP 47 tag.

            Detected from recent articles rather than declared, so treat it as a

            hint. Null before enough has been published to tell.

            '
          examples:
          - en
        chat_create_permission:
          type: string
          enum:
          - editors
          - subscribers
          - anyone
          description: 'Who may start a new chat thread in this community.

            '
        allow_non_subscriber_chat:
          type: boolean
          description: 'Whether people who have not subscribed may reply in existing

            threads.

            '
        owner:
          description: 'The account that owns the newsletter. A `Ref` unless `owner` is

            named in `?expand=`.

            '
          anyOf:
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/User'
        featured_article:
          description: 'The article the creator pinned to the top of the profile, or `null`

            when none is pinned. A `Ref` unless `featured_article` is named in

            `?expand=`.

            '
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/Article'
        created_at:
          type: string
          format: date-time
          description: When the newsletter was connected to or created on Commune.
        updated_at:
          type: string
          format: date-time
          description: When the profile last changed.
    TagDeletion:
      type: object
      title: TagDeletion
      description: 'What became of a tag that was deleted, which is one of two things.


        Not a tag: a tag that was removed outright no longer exists, and one

        that was retired instead is still live enough to decide who may read

        the articles it was addressed to. A single shape that could mean either

        would let a caller read a retirement as an ending, which it is not.

        '
      additionalProperties: false
      required:
      - object
      - id
      - outcome
      - tag
      properties:
        object:
          type: string
          const: tag_deletion
          description: Always `tag_deletion`.
        id:
          type: string
          format: uuid
          description: 'The tag that was deleted. Still resolvable through

            `GET /tags/{tag}` when `outcome` is `retired`, and a `404` when it

            is `deleted`.

            '
        outcome:
          type: string
          enum:
          - deleted
          - retired
          description: '`deleted` means no article was ever addressed to the tag, so it was

            removed and its assignments went with it.


            `retired` means an article was, so the tag was kept. Everyone

            holding it goes on holding it and goes on being able to read every

            article it was addressed to; what stops is the tag being offered

            and being possible to add a holder to. A retirement revokes

            nobody''s access. To take access away, take the tag off the people

            holding it one at a time.

            '
        tag:
          oneOf:
          - $ref: '#/components/schemas/Tag'
          - type: 'null'
          description: 'The retired tag, as it now stands, and null when the tag was

            removed outright. Its `known_subscriber_count` is the count the tag

            had before this call rather than zero, which is the plainest

            evidence that a retirement kept its holders.

            '
    Thread:
      type: object
      title: Thread
      description: 'A conversation in a newsletter''s community, together with the message

        that opened it. Its replies are a separate collection.

        '
      additionalProperties: false
      required:
      - object
      - id
      - newsletter
      - content
      - visibility
      - is_article_thread
      - created_at
      - last_activity_at
      properties:
        object:
          type: string
          const: thread
          description: Always `thread`.
        id:
          type: string
          format: uuid
          description: Stable identifier.
        short_id:
          type:
          - string
          - 'null'
          description: 'Eight character base62 identifier used by the thread''s own URL at

            `/n/{handle}/chat/{short_id}`. Null for a thread Commune opened

            under an article, which is reached through the article instead.

            '
        newsletter:
          description: 'The community this thread lives in. A `Ref` unless `newsletter` is

            named in `?expand=`.

            '
          oneOf:
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/Newsletter'
        author:
          description: 'Who opened the thread. A `Ref` unless `author` is named in

            `?expand=`.

            '
          anyOf:
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/User'
        content:
          type: string
          description: 'The opening message. HTML, since people format what they write.

            Treat it as untrusted markup and render it in a sandboxed context.

            '
        media:
          type: array
          description: Attachments on the opening message.
          items:
            $ref: '#/components/schemas/Media'
        visibility:
          $ref: '#/components/schemas/ThreadVisibility'
        is_article_thread:
          type: boolean
          description: '`true` when Commune opened this thread under an article rather than

            a person starting it. These are kept off the global feed, because

            the article card already represents the conversation there.

            '
        article:
          description: 'The article that opened this thread, when `is_article_thread` is

            `true`. `null` otherwise. A `Ref` unless `article` is named in

            `?expand=`.

            '
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/Article'
        reply_count:
          type: integer
          minimum: 0
          description: Undeleted replies in the thread, at any depth.
        view_count:
          type: integer
          minimum: 0
          description: How many times the thread was opened.
        created_at:
          type: string
          format: date-time
          description: When the thread was opened.
        updated_at:
          type: string
          format: date-time
          description: When the thread row last changed for any reason.
        edited_at:
          type:
          - string
          - 'null'
          format: date-time
          description: 'When the author last edited the opening message. Null when it was

            never edited, which is what drives the edited marker in the product.

            '
        last_activity_at:
          type: string
          format: date-time
          description: 'When the thread last received a reply, or when it was opened if it

            never did. This is the sort key for the thread list.

            '
    Ref:
      type: object
      title: Ref
      description: 'An unexpanded relationship. Ask for the relationship in `?expand=` to

        get the full object in its place.

        '
      additionalProperties: false
      required:
      - object
      - id
      properties:
        object:
          type: string
          description: The type of the referenced resource.
          examples:
          - newsletter
        id:
          type: string
          description: 'The referenced resource''s `id`, in whatever form that resource''s own

            schema declares. Most are UUIDs; a `Ref` whose `object` is `user`

            carries an account identifier, which is an opaque string and not a

            UUID. Compare it for equality and pass it back; do not parse it.

            '
          examples:
          - 9a4c1c6e-0f2b-4f47-9d3f-6d1b1a2c3d4e
    SocialLinks:
      type: object
      title: SocialLinks
      description: 'The creator''s other homes on the internet, stored as canonical profile

        URLs. Every key is optional and a newsletter that set none returns an

        empty object.

        '
      additionalProperties: false
      properties:
        twitter:
          type: string
          format: uri
          description: X or Twitter profile URL.
        bluesky:
          type: string
          format: uri
          description: Bluesky profile URL.
        linkedin:
          type: string
          format: uri
          description: LinkedIn profile URL.
        mastodon:
          type: string
          format: uri
          description: Mastodon profile URL, including the instance host.
        youtube:
          type: string
          format: uri
          description: YouTube channel URL.
        instagram:
          type: string
          format: uri
          description: Instagram profile URL.
        threads:
          type: string
          format: uri
          description: Threads profile URL.
        github:
          type: string
          format: uri
          description: GitHub profile URL.
    TagAssignment:
      type: object
      title: TagAssignment
      description: 'What applying a tag to a list of subscribers did, subscriber by

        subscriber.


        `tagged`, `already_tagged` and `not_found` are disjoint, and together

        they hold every id the request named, once each, in the order the

        request named them. Only `tagged` changed anything.

        '
      additionalProperties: false
      required:
      - object
      - tag
      - tagged
      - already_tagged
      - not_found
      properties:
        object:
          type: string
          const: tag_assignment
          description: Always `tag_assignment`.
        tag:
          $ref: '#/components/schemas/Tag'
          description: 'The tag, as it now stands. Its `known_subscriber_count` is read

            after the change, so it includes everyone in `tagged` who is

            currently subscribed.

            '
        tagged:
          type: array
          description: 'Subscribers who hold the tag now and did not before. One

            `subscriber.tagged` event was published for each.

            '
          items:
            type: string
            format: uuid
        already_tagged:
          type: array
          description: 'Subscribers who already held the tag. Nothing changed for them and

            nothing was published.

            '
          items:
            type: string
            format: uuid
        not_found:
          type: array
          description: 'Ids that are not subscribers of the tag''s newsletter, whether they

            belong to another newsletter or to nobody. Nothing was written for

            them. Retrying will give the same answer; check where the ids came

            from instead.

            '
          items:
            type: string
            format: uuid
    ArticleStats:
      type: object
      title: ArticleStats
      description: 'Engagement counts for an article, computed at read time. These are

        Commune side counts, not provider side email metrics: opens, clicks and

        deliveries are not here.

        '
      additionalProperties: false
      required:
      - likes
      - comments
      - highlights
      properties:
        likes:
          type: integer
          minimum: 0
          description: How many people liked the article.
        comments:
          type: integer
          minimum: 0
          description: 'Replies in the article''s chat thread. Commune has no separate

            comments store: an article''s discussion is a thread like any other,

            so this counts the undeleted replies hanging off it. `0` when the

            article has no thread.

            '
        highlights:
          type: integer
          minimum: 0
          description: How many passages readers highlighted.
    ErrorCode:
      type: string
      title: ErrorCode
      description: 'The stable, machine readable reason a request failed. New codes may be

        added in a minor version, so treat an unrecognised code as a generic

        failure of its HTTP status class.


        Two of these share a status with a neighbour and exist because what a

        caller does next is different. `invalid_version` is a `400` that is

        never fixed by changing the request body. `not_commune_newsletter` is a

        `422` that is never fixed by changing the request at all: it says the

        newsletter''s articles are published somewhere else and mirrored into

        Commune afterwards, so Commune cannot write one. Its page at

        `https://usecommune.dev/errors/not_commune_newsletter`, like every

        code''s, is its `docs_url`, and it covers moving a newsletter onto

        Commune''s own publishing, which is the only thing that resolves it.

        '
      enum:
      - bad_request
      - invalid_version
      - unauthorized
      - forbidden
      - insufficient_scope
      - payment_required
      - not_found
      - conflict
      - unprocessable
      - not_commune_newsletter
      - rate_limited
      - internal_error
      - service_unavailable
    ThreadVisibility:
      type: string
      title: ThreadVisibility
      description: 'Where a thread is placed. `public` puts it on the global Commune feed

        and makes it readable by anyone. `subscribers` keeps it inside the

        newsletter. `paid` narrows it further to the paying part of the

        audience. Set and changed by the newsletter''s team.

        '
      enum:
      - public
      - subscribers
      - paid
    TagAssignmentRequest:
      type: object
      title: TagAssignmentRequest
      description: 'The subscribers to put in a segment. The segment is the tag in the

        path.

        '
      additionalProperties: false
      required:
      - subscribers
      properties:
        subscribers:
          type: array
          minItems: 1
          maxItems: 500
          description: 'Subscriber ids, the `id` of each `Subscriber`: never email

            addresses. 1 to 500 of them, counted as sent. An id that appears

            more than once is applied and reported once.

            '
          items:
            type: string
            format: uuid
      examples:
      - subscribers:
        - 33445566-7788-4990-a1b2-c3d4e5f60718
        - 44556677-8899-4aa1-b2c3-d4e5f6071829
    Tag:
      type: object
      title: Tag
      description: 'A segment of a newsletter''s audience. A tag is what makes an article

        audience scoped: sending to a tag stamps the article, and from then on

        only holders of that tag and the newsletter''s team can read it.

        '
      additionalProperties: false
      required:
      - object
      - id
      - newsletter
      - name
      - retired
      - created_at
      properties:
        object:
          type: string
          const: tag
          description: Always `tag`.
        id:
          type: string
          format: uuid
          description: Stable identifier.
        newsletter:
          description: 'The newsletter the tag belongs to. A tag never spans newsletters. A

            `Ref` unless `newsletter` is named in `?expand=`.

            '
          oneOf:
          - $ref: '#/components/schemas/Ref'
          - $ref: '#/components/schemas/Newsletter'
        name:
          type: string
          description: 'What the creator calls the segment. Unique among the newsletter''s

            live tags, and freed for reuse once a tag is retired.

            '
        known_subscriber_count:
          type: integer
          minimum: 0
          description: 'How many currently subscribed people Commune knows of who hold this

            tag. Counted at read time from Commune''s own record of the

            audience, which for a newsletter connected to an outside provider

            is a partial cache of that provider''s list. Named `known_` for that

            reason: it is a floor, never the segment''s true size, and it must

            not be presented as one.

            '
        retired:
          type: boolean
          description: '`true` when the creator removed the tag but an already sent article is

            still addressed to it. Retired tags keep their assignments, because

            the audience of a sent article does not change retroactively. Excluded

            from the tag list unless `include_retired=true`.

            '
        retired_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the tag was retired. Null while it is live.
        created_at:
          type: string
          format: date-time
          description: When the tag was created.
    TagName:
      type: string
      title: TagName
      minLength: 1
      maxLength: 60
      description: 'What the creator calls the segment. Leading and trailing spaces are

        trimmed, and what is left has to be between 1 and 60 characters and

        unique among the newsletter''s live tags.

        '
    ListEnvelope:
      type: object
      title: ListEnvelope
      description: 'The envelope every collection is returned in. `data` holds the page,

        `pagination` holds the cursor state.


        `data` is required here and typed by each list operation, as an array

        of the one thing that operation returns, so the item type is stated on

        the page you are reading.

        '
      required:
      - object
      - data
      - pagination
      properties:
        object:
          type: string
          const: list
          description: Always `list`, so a response is self describing.
        pagination:
          $ref: '#/components/schemas/Pagination'
    ArticleStatus:
      type: string
      title: ArticleStatus
      description: 'Where an article is in its life. A credential holding only `read`

        permissions ever sees `sent` and nothing else. An imported article is

        always `sent`, since Commune sees it after the provider delivered it.

        '
      enum:
      - draft
      - scheduled
      - sending
      - sent
      - failed
      - archived
  responses:
    Unauthorized:
      description: 'No credential was presented, or it is malformed, unknown, revoked or

        expired, or it is an access token minted for a different audience.


        Every one of these answers identically, down to the wording and the

        headers, so a refusal never confirms that a string was once real.

        '
      headers:
        WWW-Authenticate:
          description: 'The authentication scheme this API accepts, and where to find out

            how to get a credential for it. Always

            `Bearer realm="Commune API", resource_metadata="https://api.usecommune.com/.well-known/oauth-protected-resource"`.


            `resource_metadata` is the RFC 9728 pointer to this API''s protected

            resource metadata, which names the authorization server an OAuth

            client should send its user to. A client holding an API key can

            ignore it. The header carries no `error` parameter, not even

            `error="invalid_token"`, because it describes what this API accepts

            rather than what was wrong with the credential sent, and the

            reasons above are deliberately indistinguishable.


            There is no second scheme and no query-parameter fallback, because

            a credential that can travel in a URL ends up in access logs and

            referer headers.

            '
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PaymentRequired:
      description: 'The credential is allowed to do this but the newsletter''s plan does not

        include it.


        Two surfaces can answer it: **insights**, the engagement and metrics

        operations, which are the only reads Commune reserves the right to

        meter, and **writing**, every operation that changes something.


        Every other read stays free on every plan, so a credential refused at

        one of these can still read everything else. The body names the plan the

        newsletter is on and the plans that would work.


        **This status is predictable and should not be how you discover it.**

        `GET /newsletters/{newsletter}/entitlements` answers the same question

        in advance, carrying the same plan list this puts in `allowed_values`

        and the same sentence it puts in `message`. Read it once at the start

        of a run rather than finding out in the middle of one.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 'No such resource, or the key is not allowed to know that it exists.

        Commune answers `404` rather than `403` where distinguishing the two

        would leak the existence of private content.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: 'Too many requests. Back off and retry after the interval named by the

        `Retry-After` response header.


        One of the budgets in `RateLimit-Policy` ran out, and the

        `RateLimit-*` headers on this response say which and when it resets.

        '
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 'The credential is valid but is not allowed to do this. Two codes answer

        with this status, and `error.code` says which.


        **`insufficient_scope`: it does not hold the permission.** The

        operation needs, say, `audience: read` on the newsletter addressed, and

        this credential holds less than that there. `allowed_values` carries

        the permission that was needed, and the message says what the

        credential does hold on that newsletter, because a credential granted

        the wrong family and a credential belonging to somebody whose standing

        on the team has narrowed look identical without it. The answer can

        differ per newsletter: the same credential may be allowed here and

        refused on the next one it reaches.


        The same code answers an operation that needs the **account

        permission** from a credential that does not carry it. That permission

        is about the person a credential belongs to rather than about any

        newsletter, so nothing granted on a newsletter adds up to it. It is

        granted on the credential itself, when a key is minted or when an

        authorization asks for `account:read`.


        And it answers a parameter the credential may send, but not with the

        value it sent: a filter a credential holding only `read` permissions

        may not use, or an `expand` path whose rows need a permission the

        operation does not. `param` names the parameter, and `allowed_values`

        carries what this credential may send instead, or is absent when it may

        send nothing there at all.


        **`forbidden`: it may not act here at all.** Either the credential does

        not reach the newsletter addressed, because it was never granted it or

        because the person it belongs to can no longer act on it, or it reaches

        no newsletter at all; `param` is `newsletter`, and `GET /newsletters`

        lists the ones it does reach. Or, on `DELETE /api-keys/{key}`, the

        credential named belongs to somebody else. Neither carries

        `allowed_values`, because there is no value to send instead.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 'The request collided with something. On a write this is always the

        `Idempotency-Key`, in one of two ways, and the message says which.


        Either the key was already used for a **different** request, which is

        refused rather than answered with the earlier request''s result. Or an

        earlier request using the same key has not finished, or never reported

        an outcome, in which case this one was not run and the key becomes

        usable again shortly.


        Nothing was changed by a request that answers this.

        '
      headers:
        Retry-After:
          description: 'Seconds to wait before retrying, on the second case only.

            '
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: 'The request is well formed and every value in it is legal, and the

        state of what it addresses refuses it anyway. The message says what

        about that state is in the way.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Something failed inside Commune. The request may be retried.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: "The request was malformed, and the same request will fail the same way\nuntil it is changed. `param` names the parameter or header at fault\nwhen there is exactly one, and `allowed_values` lists what it accepts\nwhen that is a finite set. The code is `bad_request` for every case\nbelow except the last.\n\n* **A query parameter**: one the operation does not have, a value\n  outside its set, range or format (an unparseable cursor, an unknown\n  `expand` path or `fields` name, an identifier that is not a UUID),\n  or a required one left out, such as `q` on a search or `newsletter`\n  when the credential reaches more than one.\n* **The request body**: not JSON, not the shape the operation reads,\n  a property it does not write, or a value of the wrong type, length\n  or format. `param` is absent here, since the body is not a\n  parameter, and the message names the property.\n* **The `Idempotency-Key` header**, on an operation that changes\n  something: missing, or a value this API will not store.\n* **An unrecognised `Commune-Version`**, which answers with its own\n  code, `invalid_version`, because it is never fixed by changing the\n  body.\n"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    oauth2:
      type: oauth2
      description: 'An OAuth access token, sent as `Authorization: Bearer <token>`. The

        walkthrough of the whole flow is at

        [usecommune.dev/use-cases/build-an-integration](https://usecommune.dev/use-cases/build-an-integration):

        discovery, registration, PKCE, the consent screen, the exchange, refresh

        and revocation.


        Ask for a family scope and the person picks which newsletter

        the token reaches; ask for `account:read` alone and it reaches no

        newsletter and reads only the account it belongs to.


        Each operation lists the scopes a token must carry to call it. An

        operation that lists none takes any token.


        Discover the URLs under `flows` at runtime from

        `GET /.well-known/oauth-authorization-server` rather than hardcoding

        them.

        '
      flows:
        authorizationCode:
          authorizationUrl: https://usecommune.com/api/oauth/authorize
          tokenUrl: https://usecommune.com/api/oauth/token
          refreshUrl: https://usecommune.com/api/oauth/token
          scopes:
            content:read: Read articles, threads and the rest of what a newsletter publishes.
            content:write: Create, edit and delete that content.
            audience:read: Read subscribers, tags and segments, including email addresses.
            audience:write: Add, tag and remove subscribers.
            insights:read: Read engagement, delivery and growth figures.
            insights:write: Write back an insight the newsletter owns.
            sending:read: Read sends, schedules and delivery outcomes.
            sending:write: Send an article, schedule one, and cancel a schedule.
            settings:read: Read a newsletter's configuration, senders and domains.
            settings:write: Change that configuration.
            webhooks:read: Read event destinations and their delivery history.
            webhooks:write: Create and remove event destinations.
            account:read: Read the person the credential belongs to, and nothing about any newsletter.
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: Commune API key
      description: 'A Commune API key, sent as `Authorization: Bearer <key>`. A key is

        granted one or more newsletters and carries six permission families on

        each, every one of them `none`, `read` or `write`. An operation names

        the family and the level it needs.


        A key is minted by a creator in Commune''s settings: no flow, no consent

        screen, no expiry. That is the whole difference from `oauth2`. An

        operation that declares both accepts either credential, and what each

        may do is what it was granted.

        '
x-refined-from:
- usecommune-openapi.json
- usecommune-openapi.yml
x-deferred:
- resource: user_newsletters
  scope: partner
  reason: The newsletters a person owns or is on the team of. Public one profile at a time, but served in bulk it maps the network. A Partner API candidate.
- resource: user_subscriptions
  scope: partner
  reason: The newsletters a person subscribes to. The reader side of the same network graph, so it waits for a Partner API with it.
- resource: user_activity
  scope: public
  reason: The threads, highlights and articles sub resources of a public profile. Each filters a collection that has its own operation.
- resource: user_settings
  scope: reader
  reason: Theme, contrast and the rest of a person's account preferences. Personal, and of no use to an integration.
- resource: notification_preferences
  scope: reader
  reason: Personal account settings.
- resource: push_subscriptions
  scope: reader
  reason: Per device push endpoints. Credential shaped, and personal.
- resource: newsletter_settings
  scope: creator
  reason: Chat permissions, physical address and editor defaults. Split from the core object so the public schema stays frozen, and deferred with the write surface it exists to serve.
- resource: invitations
  scope: creator
  reason: Carries invitee email addresses and single use tokens, and is write shaped. This version of the API is reads only.
- resource: esp_connections
  scope: creator
  reason: Holds provider OAuth tokens and API keys. The connection becomes readable without them; the credentials never do.
- resource: esp_imports
  scope: creator
  reason: Import and migration runs are long running writes against an outside provider. This version of the API is reads only.
- resource: esp_share_audiences
  scope: creator
  reason: The provider side allow list that decides what Commune ingests. Import configuration, not a resource an integration reads.
- resource: rss_authors
  scope: creator
  reason: The feed author to team member mapping. Import configuration, wired to one provider path.
- resource: newsletter_exports
  scope: never
  reason: An admin only operation, not part of the creator catalog.
- resource: article_drafts
  scope: creator
  reason: Commune's editor stores its own document format, and pinning it in a public contract would stop the editor evolving.
- resource: article_preview
  scope: creator
  reason: Renders an article to final email HTML. Worth exposing, and it would pin the merge tag engine and the block system while both are still moving.
- resource: article_compliance
  scope: creator
  reason: The pre send gate as a readable resource, answering "would this send?" without sending. Its blocker vocabulary is still growing, and freezing it now would freeze the gate; the send and schedule operations report the same refusals when they refuse.
- resource: article_move
  scope: creator
  reason: Moving a draft from one newsletter to another. A credential reads one newsletter, so both ends of the move cannot be named by one of them.
- resource: article_thread
  scope: public
  reason: An article's discussion, reachable as a sub resource. It is a thread and has an operation already; a second path to it is navigation.
- resource: article_comments
  scope: public
  reason: Dead table. An article's discussion is its chat thread, so the count is on `article.stats.comments` and the comments themselves are that thread's messages.
- resource: article_saved_event
  scope: creator
  reason: 'A topic for an article being saved or unsaved. Built alongside `article.liked` and `article.read` and then withdrawn before it shipped, on the ground that it is not the same kind of change they are.


    Those two ride a disclosure that already exists. A credential holding `insights: read` reads `GET /newsletters/{newsletter}/events` today, which names which subscriber viewed or liked which article, so a topic carrying the same facts tells a creator nothing they could not already fetch. A save has no counterpart anywhere: no entry in `EngagementEventType`, no tally on `Article.stats`, nothing in the product that shows a creator who saved what, and a row only its owner can read. The topic would therefore have been the first thing ever to tell a creator anything about saves, and the thing it told them would be who.


    That is a decision about what readers are told is private, not a gap in the catalog, and it is deferred until that decision is made rather than shipped as a side effect of building its two neighbours. `article_saves` itself is untouched: `GET /saved-articles` still returns a person their own list.'
- resource: article_shared_event
  scope: creator
  reason: 'A topic for an article being shared. Refused rather than queued, because Commune does not observe a share and cannot: the product hands the reader to the operating system''s own share sheet, which reports nothing back, so the only shares that could ever be counted are the ones that begin with a button inside Commune, and even those end somewhere Commune cannot see.


    Read `share` in `EngagementEventType` as the record of an earlier attempt rather than as a signal that exists. The value is declared, the insight scores weight it, and the collection at `GET /newsletters/{newsletter}/events` will return one if it ever finds one. None of that makes a share observable, and a `share` row is not something any newsletter has.


    Publishing a topic for it would put a channel in this catalog that can never carry a message, which is worse than an absence: an absence is visible, and a silent channel reads as a quiet week.'
- resource: article_read_state
  scope: reader
  reason: 'Per reader read and unread state, as a resource a client reads back and writes. Written on every read in the product, so exposing it invites the polling loop `article_views` is deferred for, on the same hot path. The `article.read` topic is not this resource arriving early: it is pushed rather than polled, which is the whole of what the objection was about, it reports one crossing per reader per article rather than a state a client can re-read, and it cannot be written.'
- resource: article_views
  scope: creator
  reason: 'A write on every read in the product. Exposing it as a readable counter invites polling loops against a hot path. Still deferred after `article.read` landed, and not made redundant by it: that topic deliberately reports neither anonymous reads nor repeat visits, so it is not the counter and a consumer cannot build the counter out of it.'
- resource: thread_demotion
  scope: creator
  reason: Taking a thread back off the global feed. Promoting one is an operation; the reverse has no topic and no considered answer to what a consumer already told about it should do.
- resource: article_schedule_cancelled_event
  scope: creator
  reason: A topic for a cancelled schedule. Cancelling is an operation; the event is not, for the reason directly above, and the article's own status is the authority until there is an answer.
- resource: thread_read_state
  scope: reader
  reason: Per user last read timestamps and mutes. A user token could hold it; a row names a thread, and handing one back would let an app walk into a private thread whose other participants consented to nothing.
- resource: thread_participants
  scope: public
  reason: Who spoke in a thread. Derivable from the thread's messages, which have an operation of their own.
- resource: moderation
  scope: creator
  reason: No moderation queue exists yet. An auditable log is worth having before write access rather than after it.
- resource: posts
  scope: public
  reason: Retired. Posts were folded into newsletter scoped chat threads, so the resource is `threads`, and modelling `posts` would put a dead stack into a contract with outside consumers.
- resource: post_replies
  scope: public
  reason: Retired with posts. A reply is a `message` in a thread.
- resource: reposts
  scope: public
  reason: 'Retired with posts, and never wired up: the internal surface returns a hardcoded zero.'
- resource: community_member
  scope: public
  reason: One person's place in a community, addressable on its own. The person has an operation and the place carries nothing but a date, so a second path to it is navigation rather than a resource.
- resource: suppressions
  scope: creator
  reason: Bounces, complaints and unsubscribes as one list. The data is spread across two tables and there is no single surface to freeze yet.
- resource: audience_count
  scope: creator
  reason: Commune's subscriber records are a partial cache of an outside provider's list, so any total derived from them would misstate the audience. Ask the provider.
- resource: article_deliveries
  scope: creator
  reason: Per recipient send results, including bounces. Deferred until the send pipeline's own shape is stable enough to freeze.
- resource: article_send_stats
  scope: creator
  reason: Opens and clicks come from the sending provider on the provider's schedule, so a number read here would be stale in a way the contract could not describe.
- resource: send_links
  scope: creator
  reason: Click breakdown per destination URL. Clicks are recorded as events and never aggregated by destination, so the rollup does not exist.
- resource: deliverability
  scope: creator
  reason: Rolling bounce and complaint health against thresholds. Derivable, and nothing computes it today.
- resource: delivery_retries
  scope: never
  reason: Re-sending a send's failed recipients. Commune retries transient failures itself; what still fails is followed up by its team, because some of it may already have been delivered.
- resource: network_metrics
  scope: never
  reason: Internal analytics, computed on a cron for Commune's own use.
- resource: feed
  scope: public
  reason: Public threads, articles and highlights unioned into one stream. A discriminated union whose member shapes and ranking are still moving.
- resource: newsletter_feed
  scope: public
  reason: The same union scoped to one newsletter. Deferred with `feed`.
- resource: discover
  scope: public
  reason: An editorial surface whose ranking is still being tuned. Freezing its shape now would freeze an experiment.
- resource: notifications
  scope: reader
  reason: A person's notification inbox. A user token is the right credential for it; every item points at a thread, message or article somewhere, and serving those references needs the subject registry to answer what an app may follow them to.
- resource: notification_stream
  scope: reader
  reason: The server sent events channel behind a person's notification inbox. Deferred with `notifications` above, and additionally because a stream is not a Path Item. It was described in a separate AsyncAPI document for a while, on the grounds that a stream is not a Path Item, but it was never built and that document was the only thing that document held which this one could not express. Both are gone. A stream that is worth publishing to API keys brings the second document back with it.
- resource: reader_digest
  scope: reader
  reason: The weekly roundup as data rather than as an email. Personal.
- resource: creator_digest
  scope: creator
  reason: The creator side weekly. Every number in it is readable from the Metrics operations, so it is a rendering rather than a resource.
- resource: billing
  scope: creator
  reason: Plan, usage and payment method. A money surface deserves its own contract and its own review, not a corner of the read catalog.
- resource: media
  scope: reader
  reason: Upload only, and this version of the API is reads only.
- resource: render_email
  scope: creator
  reason: 'Renders arbitrary editor JSON to email safe HTML. Same reason as `article_preview`: it would pin the block system in a public contract.'
- resource: oembed
  scope: public
  reason: oEmbed for articles, threads and highlights. A separately published spec with its own discovery rules, not a resource in this one.
- resource: api_key_mint
  scope: never
  reason: 'Minting a credential, which is refused rather than queued. A key that can mint keys outlives its own revocation: an intruder makes a second one, the creator revokes the first, and nothing they did stopped anything. A key is minted by a signed in person in Commune''s settings, where the secret is shown once. Listing and revoking keys are operations above.'
- resource: oauth
  scope: public
  reason: 'The authorize and token endpoints a third party app uses. Built, and on the authorization server rather than here: they live in the Commune app, because issuing a credential means showing a signed-in person a screen and this service has no sessions. `GET /.well-known/oauth-protected-resource` is how a client finds them, and the flow is walked through in full at `usecommune.dev/use-cases/build-an-integration`. Not to be confused with `oauth_protected_resource` below: that one is this service saying where tokens for *it* come from.'
- resource: oauth_protected_resource
  scope: public
  reason: '`GET /.well-known/oauth-protected-resource`, the RFC 9728 metadata document a client fetches after a `401` to find the authorization server. It is not a Commune resource and it is not versioned by `Commune-Version`: its shape is fixed by the RFC, it is the same bytes for every caller, and it is unauthenticated because discovery is what a caller does when it has no usable credential. The authorization server it names is not this API; it is the Commune app itself, where the creator''s session and the consent screen already are.'
- resource: spec_documents
  scope: public
  reason: This document, served as JSON and as YAML, each with `?version=`, `?profile=` and `?lang=`. Describing itself inside itself is circular.
- resource: mcp_server
  scope: creator
  reason: '`POST /mcp`, the Model Context Protocol endpoint. It is a JSON-RPC envelope over the operations declared above rather than a resource of its own: one tool is one Arazzo workflow, and every step of every workflow is one of these operations, dispatched through the same gateway with the caller''s own key. Declaring the envelope here would publish a second, untyped way to call operations that are already typed, and OpenAPI cannot describe what a `tools/call` body may contain without restating all twenty argument schemas the manifest already carries.'
- resource: webhooks
  scope: never
  reason: 'Inbound endpoints for outside services, authenticated by signature rather than by key. The outbound direction is not this resource: the events a consumer receives are the generated `webhooks` block.'
- resource: cron
  scope: never
  reason: Internal scheduled jobs, guarded by a shared secret.
- resource: admin
  scope: never
  reason: Commune staff surface. Never public.
