components:
  schemas:
    BillingSubscriptionUpdatedEvent:
      title: Billing subscription state changed
      description: The newsletter's own Commune subscription changed state.
      allOf:
      - $ref: '#/components/schemas/EventEnvelope'
      - type: object
        properties:
          type:
            const: billing.subscription.updated
          data:
            $ref: '#/components/schemas/BillingSubscriptionUpdatedData'
    SubscriberTaggedEvent:
      title: Subscriber tag added or removed
      description: A subscriber tag was applied or taken off.
      allOf:
      - $ref: '#/components/schemas/EventEnvelope'
      - type: object
        properties:
          type:
            const: subscriber.tagged
          data:
            $ref: '#/components/schemas/SubscriberTaggedData'
    ThreadCreatedData:
      type: object
      required:
      - thread_id
      - visibility
      - content
      - created_at
      properties:
        thread_id:
          type: string
          format: uuid
          description: The thread itself, which is the opening message of the conversation rather than a reply within one.
        short_id:
          type:
          - string
          - 'null'
          description: Short public identifier used in thread URLs.
        url:
          type:
          - string
          - 'null'
          format: uri
        author:
          $ref: '#/components/schemas/UserRef'
        content:
          type: string
          maxLength: 5000
          description: The opening message, capped at 5000 characters on write.
        visibility:
          type: string
          enum:
          - public
          - subscribers
          - paid
          description: '`public` puts the thread on the global feed and only team members may set it. `subscribers` keeps it in the newsletter''s own space. `paid` is reserved and unused.'
        article_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Set when the thread is an article's discussion. Comments on an article are messages in this thread; there is no separate comment resource.
        created_at:
          type: string
          format: date-time
    MessageCreatedData:
      type: object
      required:
      - message_id
      - thread_id
      - thread_level
      - content
      - created_at
      properties:
        message_id:
          type: string
          format: uuid
        short_id:
          type:
          - string
          - 'null'
        url:
          type:
          - string
          - 'null'
          format: uri
        thread_id:
          type: string
          format: uuid
          description: The top-level thread this reply belongs to.
        parent_id:
          type:
          - string
          - 'null'
          format: uuid
          description: The message being replied to. Equal to `thread_id` for a direct reply, a sibling message for a nested one.
        thread_level:
          type: integer
          enum:
          - 1
          - 2
          description: Nesting depth. 1 is a reply to the thread, 2 is a reply to a reply, and nesting stops there.
        author:
          $ref: '#/components/schemas/UserRef'
        content:
          type: string
          maxLength: 5000
        created_at:
          type: string
          format: date-time
    ArticleScheduledData:
      type: object
      required:
      - article_id
      - title
      - scheduled_for
      properties:
        article_id:
          type: string
          format: uuid
        title:
          type: string
        scheduled_for:
          type: string
          format: date-time
          description: When the send is due. Always in the future at the time of this event, and always on a five-minute boundary.
    SubscriberCreatedData:
      type: object
      required:
      - subscriber_id
      - email
      - status
      - resubscribed
      - created_at
      properties:
        subscriber_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        status:
          type: string
          enum:
          - subscribed
          - unsubscribed
          - bounced
          - complained
          - pending
        user_id:
          type:
          - string
          - 'null'
          description: The Commune account behind this subscriber, when there is one. Null for an address imported from an ESP or CSV that never signed up.
        acquisition_source:
          type:
          - string
          - 'null'
          description: How a subscriber was imported, fixed when they were first recorded so a later migration between providers cannot relabel it. An ESP import stamps that provider's slug and a CSV upload stamps `csv`. Set only on those two paths, so it is null for a subscriber who subscribed in the Commune app, finished signup, or accepted an invitation. `commune` and `imported` appear on old subscribers labelled before this field existed; nothing writes either today.
        resubscribed:
          type: boolean
          description: True when an existing unsubscribed subscriber came back to `subscribed`, rather than a new subscriber being recorded.
        created_at:
          type: string
          format: date-time
          description: When the subscriber row was first created. On a resubscribe this is the ORIGINAL creation time, not the reactivation, which is `occurred_at`.
    ArticlePublishedEvent:
      title: Article published
      description: An article became publicly readable.
      allOf:
      - $ref: '#/components/schemas/EventEnvelope'
      - type: object
        properties:
          type:
            const: article.published
          data:
            $ref: '#/components/schemas/ArticlePublishedData'
    SubscriberUnsubscribedData:
      type: object
      required:
      - subscriber_id
      - email
      - reason
      - unsubscribed_at
      properties:
        subscriber_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        reason:
          type: string
          enum:
          - self_service
          - bounced
          - complained
          description: '`self_service` is the reader opting out. `bounced` and `complained` are forced by delivery telemetry and arrive with the matching `delivery.*` event.'
        unsubscribed_at:
          type: string
          format: date-time
        article_send_id:
          type:
          - string
          - 'null'
          format: uuid
          description: 'The send whose email the reader acted on, when the unsubscribe link carried it. Best-effort attribution: null on an in-app unsubscribe, a link without the marker, or a bounce or complaint.'
    ArticleScheduledEvent:
      title: Article scheduled
      description: An article written in Commune was queued for a future send.
      allOf:
      - $ref: '#/components/schemas/EventEnvelope'
      - type: object
        properties:
          type:
            const: article.scheduled
          data:
            $ref: '#/components/schemas/ArticleScheduledData'
    ThreadCreatedEvent:
      title: Thread created
      description: A new top-level thread was started in a newsletter's space.
      allOf:
      - $ref: '#/components/schemas/EventEnvelope'
      - type: object
        properties:
          type:
            const: thread.created
          data:
            $ref: '#/components/schemas/ThreadCreatedData'
    SendFailedEvent:
      title: Send failed
      description: A send run broke and the article was parked in failed.
      allOf:
      - $ref: '#/components/schemas/EventEnvelope'
      - type: object
        properties:
          type:
            const: send.failed
          data:
            $ref: '#/components/schemas/SendFailedData'
    BillingSubscriptionUpdatedData:
      type: object
      required:
      - subscription_id
      - plan
      - status
      properties:
        subscription_id:
          type: string
          format: uuid
          description: Commune's own identifier for the newsletter's subscription, one per `commune` newsletter. Not a Stripe id; Stripe identifiers are never exposed.
        plan:
          type: string
          enum:
          - creator
          - enterprise
        status:
          type: string
          enum:
          - trialing
          - active
          - past_due
          - canceled
          - trial_expired
        previous_status:
          type:
          - string
          - 'null'
          enum:
          - trialing
          - active
          - past_due
          - canceled
          - trial_expired
          - null
          description: The state being left. Null when it could not be established, so treat this as a hint and the new `status` as the truth.
        trial_ends_at:
          type:
          - string
          - 'null'
          format: date-time
        current_period_start:
          type:
          - string
          - 'null'
          format: date-time
        current_period_end:
          type:
          - string
          - 'null'
          format: date-time
        cancel_at_period_end:
          type: boolean
          description: 'The subscription is still active but will not renew. Distinct from `status: canceled`, which means it already stopped.'
    InsightStatus:
      type: string
      title: InsightStatus
      description: 'Where a reader sits in the newsletter''s engagement ladder, from

        `dormant` at the bottom to `superfan` at the top.


        Assigned by rank inside the newsletter rather than against an absolute

        score, so it is a statement about this audience and never comparable

        between two newsletters. It also means a reader can move without doing

        anything, because the people around them moved.

        '
      enum:
      - superfan
      - engaged
      - reader
      - dormant
    SenderVerifiedEvent:
      title: Sender verified
      description: A sending identity passed verification and can now send.
      allOf:
      - $ref: '#/components/schemas/EventEnvelope'
      - type: object
        properties:
          type:
            const: sender.verified
          data:
            $ref: '#/components/schemas/SenderVerifiedData'
    ThreadPublishedEvent:
      title: Thread published to the feed
      description: A thread's visibility became public and it hit the global feed.
      allOf:
      - $ref: '#/components/schemas/EventEnvelope'
      - type: object
        properties:
          type:
            const: thread.published
          data:
            $ref: '#/components/schemas/ThreadPublishedData'
    SendCompletedData:
      type: object
      required:
      - article_id
      - send_id
      - started_at
      - completed_at
      - recipient_count
      - sent_count
      - failed_count
      properties:
        article_id:
          type: string
          format: uuid
        send_id:
          type: string
          format: uuid
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        recipient_count:
          type: integer
          minimum: 0
          description: Audience size fixed at the moment the run started. The stable denominator for any rate a consumer computes.
        sent_count:
          type: integer
          minimum: 0
          description: 'Recipients the provider accepted at dispatch. NOT confirmed deliveries: confirmation arrives later as `delivery.delivered`, one event per recipient.'
        failed_count:
          type: integer
          minimum: 0
          description: Recipients the provider rejected outright at dispatch.
    DeliveryBouncedEvent:
      title: Delivery bounced
      description: The message could not be delivered.
      allOf:
      - $ref: '#/components/schemas/EventEnvelope'
      - type: object
        properties:
          type:
            const: delivery.bounced
          data:
            allOf:
            - $ref: '#/components/schemas/DeliveryEventData'
            - type: object
              required:
              - reason
              properties:
                reason:
                  type:
                  - string
                  - 'null'
                  maxLength: 1000
                  description: The provider's bounce message or type, whichever it supplied. Free text for display. Hard and soft bounces are not distinguished today because Commune stores only this string.
    ArticleLikedEvent:
      title: Article like changed
      description: A reader liked an article, or took the like back.
      allOf:
      - $ref: '#/components/schemas/EventEnvelope'
      - type: object
        properties:
          type:
            const: article.liked
          data:
            $ref: '#/components/schemas/ArticleLikedData'
    ImportCompletedData:
      type: object
      title: Import completed body
      description: Body of `import.completed`. Which kind of run finished, where its rows came from, and how much it moved.
      required:
      - kind
      - source
      - imported_count
      - completed_at
      properties:
        kind:
          type: string
          enum:
          - articles
          - subscribers
          - migration
          description: '`articles` and `subscribers` ingest rows. `migration` is the finalize step that makes a newsletter `commune`, which ingests nothing.'
        source:
          type:
          - string
          - 'null'
          description: 'Where the rows came from: an ESP slug such as `kit` or `beehiiv`, `csv` for an uploaded list, or `rss` for a feed. Null when the run has no single source, which is the `migration` case.'
          examples:
          - kit
        imported_count:
          type:
          - integer
          - 'null'
          minimum: 0
          description: 'Subscribers that actually landed. Not the size of what was offered: both import paths skip anybody already on the list and leave their existing status alone. Null for `migration`, which ingests nothing.


            Subscribers the run could not take are not reported. One bad entry never ends a run, and nothing counts the ones that failed, so a number here would be a guess.'
        started_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the run began. Null when it was not recorded, so treat the duration as best effort.
        completed_at:
          type: string
          format: date-time
          description: When the run ended. Equal to `occurred_at`.
    ThreadPublishedData:
      type: object
      title: Thread published body
      description: Body of `thread.published`. Which thread reached the feed, how it got there, and enough to render a feed row without a second call.
      required:
      - thread_id
      - visibility
      - previous_visibility
      - source
      - published_at
      properties:
        thread_id:
          type: string
          format: uuid
          description: The thread. The same id `thread.created` carried, so a consumer that stored that event can match on it directly.
        short_id:
          type:
          - string
          - 'null'
          description: Short public identifier used in thread URLs.
        url:
          type:
          - string
          - 'null'
          format: uri
        author:
          $ref: '#/components/schemas/UserRef'
        visibility:
          type: string
          const: public
          description: Always `public`. Present so a payload stays self-describing next to `thread.created`, which carries the same field and can carry other values.
        previous_visibility:
          type:
          - string
          - 'null'
          enum:
          - subscribers
          - paid
          - null
          description: What the thread was before. Null when it was created public, which is the case `source` also reports.
        source:
          type: string
          enum:
          - created_public
          - visibility_changed
          description: '`created_public` for a thread a team member started public, which fires `thread.created` from the same write. `visibility_changed` for one that was featured later.'
        published_by:
          allOf:
          - $ref: '#/components/schemas/UserRef'
          description: 'The team member who put it on the feed. Named `published_by` rather than `actor` because the envelope already has an `actor`, and the two mean different things: this is a person, and that is the credential a change arrived under.


            Null in two cases. On the `created_public` path a thread was public from the start and nobody featured it. On a promotion made through this API there is no person to name, because a credential is not one; the envelope''s `actor` carries the credential instead.'
        article_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Set when the thread is an article's discussion rather than a standalone one.
        published_at:
          type: string
          format: date-time
          description: '`visibility_changed_at` on the `visibility_changed` path, the thread''s `created_at` on the `created_public` path.'
    SubscriberTaggedData:
      type: object
      title: Subscriber tagged body
      description: Body of `subscriber.tagged`. Which subscriber, which tag, and which way the membership moved.
      required:
      - subscriber_id
      - tag_id
      - tag_name
      - direction
      properties:
        subscriber_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        tag_id:
          type: string
          format: uuid
        tag_name:
          type: string
          description: The tag's name at the time of the change.
        direction:
          type: string
          enum:
          - assigned
          - removed
          description: 'Whether the subscriber joined the segment or left it. Branch on this: it is the only thing that differs between the two changes this topic carries.'
    ArticleReadEvent:
      title: Article read
      description: A reader stayed with an article long enough to have read it.
      allOf:
      - $ref: '#/components/schemas/EventEnvelope'
      - type: object
        properties:
          type:
            const: article.read
          data:
            $ref: '#/components/schemas/ArticleReadData'
    SenderVerifiedData:
      type: object
      required:
      - sender_id
      - from_email
      - domain
      - kind
      - verified_at
      properties:
        sender_id:
          type: string
          format: uuid
        from_email:
          type: string
          format: email
          description: Ready-to-use From address.
        from_name:
          type: string
        reply_to_email:
          type:
          - string
          - 'null'
          format: email
        domain:
          type: string
          description: The sending domain that was verified.
        kind:
          type: string
          enum:
          - commune
          - custom
          description: '`commune` is a Commune-provisioned subdomain, `custom` is a domain the creator owns and pointed at Commune.'
        is_default:
          type: boolean
          description: Whether this is the newsletter's default sender, the one used when an article does not pin a specific one.
        verified_at:
          type: string
          format: date-time
    DeliveryDeliveredEvent:
      title: Delivery accepted
      description: The provider confirmed the message reached the recipient server.
      allOf:
      - $ref: '#/components/schemas/EventEnvelope'
      - type: object
        properties:
          type:
            const: delivery.delivered
          data:
            $ref: '#/components/schemas/DeliveryEventData'
    SubscriberStatusChangedEvent:
      title: Subscriber insight status changed
      description: A reader crossed a boundary in the newsletter's engagement ladder.
      allOf:
      - $ref: '#/components/schemas/EventEnvelope'
      - type: object
        properties:
          type:
            const: subscriber.status_changed
          data:
            $ref: '#/components/schemas/SubscriberStatusChangedData'
    SendFailedData:
      type: object
      required:
      - article_id
      - failure_reason
      properties:
        article_id:
          type: string
          format: uuid
        send_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Null when the run broke before it was recorded, which is early enough that there is no run to point at.
        failure_reason:
          type: string
          maxLength: 1000
          description: Human-readable, truncated at 1000 characters on write. Meant for display, not for branching. Match on the topic, not this string.
    ArticleReadData:
      type: object
      title: Article read body
      description: 'Body of `article.read`. Which article, who read it, and when they crossed from unread to read. There is no count here and no way to build one: the topic reports first reads by signed-in people only.'
      required:
      - article_id
      - title
      - reader
      - read_at
      properties:
        article_id:
          type: string
          format: uuid
        title:
          type: string
        url:
          type:
          - string
          - 'null'
          format: uri
          description: Canonical public URL. Follows the newsletter's custom website domain when it has an active one, otherwise the Commune-hosted path.
        reader:
          $ref: '#/components/schemas/UserRef'
          description: 'The person who read it. Never a stand-in for an anonymous reader: an anonymous read produces no message at all rather than one with this field empty, because Commune records nothing durable for it and a message built from nothing would be a message the reader could fabricate. Null only in the case `UserRef` describes, an account that has since been deleted.'
        read_at:
          type: string
          format: date-time
          description: When the article became read for this person. Equal to `occurred_at`. It does not move afterwards, because this crossing happens once.
    Actor:
      type:
      - object
      - 'null'
      description: 'Who caused the change, and `null` when nobody outside Commune did.


        Populated on a change made through this API''s write operations, and null on every other change: an edit a creator made in the product, an import arriving from a provider, a scheduled job, a delivery result reported by the sending provider. Null is therefore the common case and stays a legitimate value. Read it as "this change came in through the API under this credential", never as "nothing caused this".


        It never names a person, only the credential.


        It answers "did this change come in through the API, and under which credential". It is **not** the field to drop the echo of your own write with: use `idempotency_key`, which you chose and therefore already know, whereas `id` here is Commune''s own identifier for your credential and no operation reports it back to you. A creator can read that identifier in Commune, but it changes when the credential is replaced, so matching on it puts the loop back silently after a rotation.'
      additionalProperties: false
      required:
      - type
      - id
      properties:
        type:
          type: string
          enum:
          - user
          - api_key
          - system
          description: '`api_key` for a change made through this API, which is the only value emitted today. `user` is reserved for a change a named person made through an authenticated session and `system` for an unattended job; neither is emitted.


            An OAuth access token reports as `api_key` as well. The two credentials are interchangeable everywhere else in this API, and a separate value here would be a distinction a consumer cannot act on.'
        id:
          type: string
          description: Identifier of the actor within its `type`. For `api_key` it is the credential's own id and never its secret, and it is the same value that appears in a creator's list of credentials, so an event can be traced back to the integration that caused it.
        label:
          type:
          - string
          - 'null'
          description: Human-readable name for display. Best effort, may be null.
    DomainVerifiedEvent:
      title: Custom website domain verified
      description: A creator's custom website domain went live.
      allOf:
      - $ref: '#/components/schemas/EventEnvelope'
      - type: object
        properties:
          type:
            const: domain.verified
          data:
            $ref: '#/components/schemas/DomainVerifiedData'
    ArticlePublishedData:
      type: object
      required:
      - article_id
      - title
      - published_at
      - source
      properties:
        article_id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type:
          - string
          - 'null'
        url:
          type:
          - string
          - 'null'
          format: uri
          description: Canonical public URL. Follows the newsletter's custom website domain when it has an active one, otherwise the Commune-hosted path.
        published_at:
          type: string
          format: date-time
          description: The article's own `posted_at`. Normally equal to `occurred_at`, but an import can backdate it to the original publication time.
        source:
          type: string
          enum:
          - commune_send
          - import
          description: '`commune_send` for an article Commune emailed itself, `import` for a post pulled in from a connected ESP or RSS feed.'
        audience_scoped:
          type: boolean
          description: True when the article is restricted to specific subscriber tags rather than the whole list. Which tags is not carried here; read `GET /articles/{article}` for that.
    MessageCreatedEvent:
      title: Message created
      description: A reply was posted inside a thread.
      allOf:
      - $ref: '#/components/schemas/EventEnvelope'
      - type: object
        properties:
          type:
            const: message.created
          data:
            $ref: '#/components/schemas/MessageCreatedData'
    HighlightCreatedData:
      type: object
      title: Highlight created body
      description: 'Body of `highlight.created`. The passage, where it sits in the article, and an opaque owner token. No `user_id`: Commune does not attribute a highlight to a named reader.'
      required:
      - highlight_id
      - article_id
      - quote
      - start_offset
      - end_offset
      - owner_key
      - message_id
      - created_at
      properties:
        highlight_id:
          type: string
          format: uuid
          description: Commune's identifier for the highlight.
        article_id:
          type: string
          format: uuid
        quote:
          type: string
          maxLength: 5000
          description: The marked text itself, as plain text, capped at 5000 characters. The surrounding prefix and suffix that let a client re-anchor the range are not here; read `GET /highlights/{highlight}` for those.
        start_offset:
          type: integer
          minimum: 0
          description: Where the passage starts, as a character offset into the article's normalised plain text. Always less than `end_offset`.
        end_offset:
          type: integer
          minimum: 1
          description: Where the passage ends, in the same offsets.
        owner_key:
          type: string
          description: An opaque, stable per highlighter value, scoped to this one article. The same value `GET /highlights/{highlight}` returns. Group by it to tell one reader's marks apart from another's. It cannot be resolved to a person and does not correlate across articles.
          examples:
          - 4f2a9c1e7b3d6a05
        message_id:
          type:
          - string
          - 'null'
          format: uuid
          description: 'The chat message the reader wrote from this passage, when the highlight was created as a discussion. Null for a silent highlight, and it stays null on this topic: attaching a message later updates the row rather than creating one.'
        created_at:
          type: string
          format: date-time
    SubscriberUnsubscribedEvent:
      title: Subscriber unsubscribed
      description: A subscriber stopped being mailable.
      allOf:
      - $ref: '#/components/schemas/EventEnvelope'
      - type: object
        properties:
          type:
            const: subscriber.unsubscribed
          data:
            $ref: '#/components/schemas/SubscriberUnsubscribedData'
    SubscriberCreatedEvent:
      title: Subscriber created
      description: Someone became a subscriber, or an unsubscribed one came back.
      allOf:
      - $ref: '#/components/schemas/EventEnvelope'
      - type: object
        properties:
          type:
            const: subscriber.created
          data:
            $ref: '#/components/schemas/SubscriberCreatedData'
    DeliveryEventData:
      type: object
      title: Delivery event body
      description: Shared body of the five `delivery.*` topics. One delivery to one recipient, identified by both Commune's ids and the provider's message id, so a consumer can reconcile with its own provider logs.
      required:
      - delivery_id
      - article_id
      - send_id
      - subscriber_id
      - email
      - status
      properties:
        delivery_id:
          type: string
          format: uuid
          description: Commune's identifier for this delivery.
        article_id:
          type: string
          format: uuid
        send_id:
          type: string
          format: uuid
          description: The send run this delivery belonged to.
        subscriber_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          description: The address as it was at send time. Snapshotted onto the delivery row, so it does not follow a later change to the subscriber.
        provider_message_id:
          type:
          - string
          - 'null'
          description: The email provider's id for this message, the correlator the inbound webhook matched on. Null only if the row was written without one.
        status:
          type: string
          enum:
          - queued
          - sent
          - delivered
          - opened
          - clicked
          - bounced
          - complained
          - failed
          description: 'The delivery row''s status after this event was applied. Because the state machine is forward-only, it is not always the event''s own name: an open recorded after a click leaves the row on `clicked`.'
    HighlightCreatedEvent:
      title: Highlight created
      description: A reader marked a passage of an article.
      allOf:
      - $ref: '#/components/schemas/EventEnvelope'
      - type: object
        properties:
          type:
            const: highlight.created
          data:
            $ref: '#/components/schemas/HighlightCreatedData'
    DeliveryOpenedEvent:
      title: Delivery opened
      description: The recipient opened the message.
      allOf:
      - $ref: '#/components/schemas/EventEnvelope'
      - type: object
        properties:
          type:
            const: delivery.opened
          data:
            $ref: '#/components/schemas/DeliveryEventData'
    DeliveryComplainedEvent:
      title: Delivery marked as spam
      description: The recipient reported the message as spam.
      allOf:
      - $ref: '#/components/schemas/EventEnvelope'
      - type: object
        properties:
          type:
            const: delivery.complained
