openapi: 3.2.0
info:
  title: Commune Webhooks API
  version: '2026-08-26'
  summary: Newsletters, articles, threads and the people around them.
  description: 'The Commune API exposes a Commune community: newsletters, the articles they

    publish, the chat threads those articles start, and the people who write

    and read them.'
  contact:
    name: Commune
    url: https://usecommune.com
    email: support@usecommune.com
servers:
- url: https://api.usecommune.com
  description: 'Production. There is no separate sandbox host.

    '
security:
- apiKey: []
tags:
- name: Webhooks
  description: 'The events Commune pushes to a consumer, rather than the resources a

    consumer pulls.'
paths: {}
webhooks:
  article.liked:
    post:
      operationId: onArticleLiked
      summary: Article like added or removed
      description: 'A reader liked an article, or took the like back. `data.direction` says

        which: `added` when the like was given, `removed` when it was withdrawn.


        One topic carries both directions, so subscribing once is enough to

        mirror the whole association. A consumer that heard a named person liked

        an article and never heard them take it back would keep acting on a

        claim the person withdrew.


        **`data.reader` names the person.** The same actions are readable as

        engagement records at

        `GET /newsletters/{newsletter}/events?event_type=like`. A reader with no

        Commune account cannot like an article, so unlike `article.read` this

        field is null only for a deleted account.


        `data.like_count` is the whole tally after the change, counted in the

        same transaction that made it, and is the number

        `GET /articles/{article}` reports on `stats.likes`. It is on the removal

        as well as the addition, so a consumer that stores it never has to add

        anything up and a consumer that missed a message is corrected by the

        next one.


        **Fires on a real row change only.** Liking an article this person

        already liked is silent, and so is unliking one they had not liked.

        Liking, unliking and liking again fires three times.


        Delivered as a single HTTPS POST to the consumer''s registered endpoint,

        with the message as the JSON request body. Respond 2xx to acknowledge.

        Anything else, or a timeout, is retried with backoff, so acknowledge

        fast and do the work afterwards.'
      tags:
      - Webhooks
      security: []
      parameters:
      - $ref: '#/components/parameters/WebhookVersion'
      - $ref: '#/components/parameters/WebhookEventId'
      - $ref: '#/components/parameters/WebhookEventType'
      - $ref: '#/components/parameters/WebhookSignature'
      - $ref: '#/components/parameters/WebhookTimestamp'
      - $ref: '#/components/parameters/WebhookDeliveryAttempt'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleLikedEvent'
            examples:
              likeAdded:
                summary: The eighteenth like on an article.
                value:
                  id: 018f2a93-1010-7000-8000-000000000041
                  type: article.liked
                  api_version: '2026-08-26'
                  occurred_at: '2026-08-26T20:02:14Z'
                  newsletter_id: 7d3f1c02-58a1-4a4e-9a0b-2f6d1c9e4411
                  actor: null
                  idempotency_key: null
                  data:
                    article_id: 4c9e2f81-0b7a-4d13-8e55-1a2b3c4d5e6f
                    title: What newsletters get wrong about community
                    url: https://example.com/p/what-newsletters-get-wrong-about-community
                    reader:
                      user_id: 9f8e7d6c-5b4a-4392-8180-7f6e5d4c3b2a
                      username: mara
                      display_name: Mara Iversen
                      avatar_url: https://example.com/avatars/mara.png
                    direction: added
                    like_count: 18
                    changed_at: '2026-08-26T20:02:14Z'
              likeRemoved:
                summary: The same reader takes it back, and the tally says so. A consumer that stored the first message has to act on this one.
                value:
                  id: 018f2a93-2020-7000-8000-000000000042
                  type: article.liked
                  api_version: '2026-08-26'
                  occurred_at: '2026-08-26T20:41:55Z'
                  newsletter_id: 7d3f1c02-58a1-4a4e-9a0b-2f6d1c9e4411
                  actor: null
                  idempotency_key: null
                  data:
                    article_id: 4c9e2f81-0b7a-4d13-8e55-1a2b3c4d5e6f
                    title: What newsletters get wrong about community
                    url: https://example.com/p/what-newsletters-get-wrong-about-community
                    reader:
                      user_id: 9f8e7d6c-5b4a-4392-8180-7f6e5d4c3b2a
                      username: mara
                      display_name: Mara Iversen
                      avatar_url: https://example.com/avatars/mara.png
                    direction: removed
                    like_count: 17
                    changed_at: '2026-08-26T20:41:55Z'
      responses:
        '200':
          description: 'The consumer accepted the delivery. Any 2xx acknowledges the message

            and it is not sent again.

            '
        4XX:
          description: 'The consumer rejected the delivery. Handled exactly like a 5xx: the

            message is retried with backoff, because a rejection cannot be told

            apart from a consumer that is briefly misconfigured.

            '
        5XX:
          description: 'The consumer failed to handle the delivery. Retried with backoff. A

            timeout is the same case and is retried too.

            '
  article.published:
    post:
      operationId: onArticlePublished
      summary: Article published
      description: 'An article became publicly readable on Commune. Two paths reach this

        state and both publish here, distinguished by `data.source`.


        `commune_send`: an article written in Commune finished sending. Its

        status moved from `sending` to `sent` and `posted_at` was stamped, which is what

        surfaces it in the feed.


        `import`: a post arrived from a connected ESP or an RSS feed. Feeds are

        polled on a schedule, so this fires without a creator having done

        anything at that moment.


        An article with a future `posted_at` is scheduled, not published, and

        does not fire this topic until it is actually live.


        Delivered as a single HTTPS POST to the consumer''s registered endpoint,

        with the message as the JSON request body. Respond 2xx to acknowledge.

        Anything else, or a timeout, is retried with backoff, so acknowledge

        fast and do the work afterwards.'
      tags:
      - Webhooks
      security: []
      parameters:
      - $ref: '#/components/parameters/WebhookVersion'
      - $ref: '#/components/parameters/WebhookEventId'
      - $ref: '#/components/parameters/WebhookEventType'
      - $ref: '#/components/parameters/WebhookSignature'
      - $ref: '#/components/parameters/WebhookTimestamp'
      - $ref: '#/components/parameters/WebhookDeliveryAttempt'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticlePublishedEvent'
            examples:
              communeArticleSent:
                summary: An article written in Commune finished sending and went live.
                value:
                  id: 018f2a8b-6c4b-7d2e-9f11-6a1c3d5e7b90
                  type: article.published
                  api_version: '2026-08-26'
                  occurred_at: '2026-08-26T09:32:11Z'
                  newsletter_id: 7d3f1c02-58a1-4a4e-9a0b-2f6d1c9e4411
                  actor: null
                  idempotency_key: null
                  data:
                    article_id: 4c9e2f81-0b7a-4d13-8e55-1a2b3c4d5e6f
                    title: What newsletters get wrong about community
                    slug: what-newsletters-get-wrong-about-community
                    url: https://example.com/p/what-newsletters-get-wrong-about-community
                    published_at: '2026-08-26T09:32:11Z'
                    source: commune_send
                    audience_scoped: false
      responses:
        '200':
          description: 'The consumer accepted the delivery. Any 2xx acknowledges the message

            and it is not sent again.

            '
        4XX:
          description: 'The consumer rejected the delivery. Handled exactly like a 5xx: the

            message is retried with backoff, because a rejection cannot be told

            apart from a consumer that is briefly misconfigured.

            '
        5XX:
          description: 'The consumer failed to handle the delivery. Retried with backoff. A

            timeout is the same case and is retried too.

            '
  article.read:
    post:
      operationId: onArticleRead
      summary: Article read
      description: 'A reader stayed with an article long enough to have read it. Commune

        records this when someone has had the article open for ten seconds, or has

        scrolled through it, whichever comes first.


        **Fires once per reader per article, ever.** It reports the one moment

        the pair crosses from unread to read, so a reader who comes back a year

        later produces nothing. It is a first-time signal, not a visit counter,

        and cannot be summed into one.


        **`data.reader` names the person.** The same actions are readable as

        engagement records at

        `GET /newsletters/{newsletter}/events?event_type=view`.


        **Three things this topic does not report, each of which will make a

        count built from it wrong.**


        * **A reader who is not signed in produces nothing**, so counting these

        messages counts signed-in readers and nothing else. Real readership is

        higher by however much logged-out traffic the newsletter gets, and

        Commune records nothing durable for an anonymous read, so there is no

        figure to correct the total by afterwards. On a newsletter with a

        public archive that can be most of the readership. Treat any number

        derived from this topic as a floor, label it as signed-in readers, and

        do not call it an open rate or a view count.

        * **Marking articles read in bulk produces nothing.** A reader clearing

        a backlog with "mark all as read" is declaring they are not going to

        read those articles. Only reading reaches this topic.

        * **A reader who opened an article and left produces nothing.** That is

        a different fact, it has no topic, and its absence is why this is not

        an open rate.


        Delivered as a single HTTPS POST to the consumer''s registered endpoint,

        with the message as the JSON request body. Respond 2xx to acknowledge.

        Anything else, or a timeout, is retried with backoff, so acknowledge

        fast and do the work afterwards.'
      tags:
      - Webhooks
      security: []
      parameters:
      - $ref: '#/components/parameters/WebhookVersion'
      - $ref: '#/components/parameters/WebhookEventId'
      - $ref: '#/components/parameters/WebhookEventType'
      - $ref: '#/components/parameters/WebhookSignature'
      - $ref: '#/components/parameters/WebhookTimestamp'
      - $ref: '#/components/parameters/WebhookDeliveryAttempt'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleReadEvent'
            examples:
              read:
                summary: A signed-in reader finishes an article, once and only once.
                value:
                  id: 018f2a93-5050-7000-8000-000000000045
                  type: article.read
                  api_version: '2026-08-26'
                  occurred_at: '2026-08-26T19:58:31Z'
                  newsletter_id: 7d3f1c02-58a1-4a4e-9a0b-2f6d1c9e4411
                  actor: null
                  idempotency_key: null
                  data:
                    article_id: 4c9e2f81-0b7a-4d13-8e55-1a2b3c4d5e6f
                    title: What newsletters get wrong about community
                    url: https://example.com/p/what-newsletters-get-wrong-about-community
                    reader:
                      user_id: 9f8e7d6c-5b4a-4392-8180-7f6e5d4c3b2a
                      username: mara
                      display_name: Mara Iversen
                      avatar_url: https://example.com/avatars/mara.png
                    read_at: '2026-08-26T19:58:31Z'
      responses:
        '200':
          description: 'The consumer accepted the delivery. Any 2xx acknowledges the message

            and it is not sent again.

            '
        4XX:
          description: 'The consumer rejected the delivery. Handled exactly like a 5xx: the

            message is retried with backoff, because a rejection cannot be told

            apart from a consumer that is briefly misconfigured.

            '
        5XX:
          description: 'The consumer failed to handle the delivery. Retried with backoff. A

            timeout is the same case and is retried too.

            '
  article.scheduled:
    post:
      operationId: onArticleScheduled
      summary: Article scheduled
      description: 'An article written in Commune was queued for a future send. Its status

        became `scheduled` and its `scheduled_for` is in the future.


        **Cancelling a schedule has no topic.** A consumer that needs to know a

        schedule went away should reconcile against `GET /articles/{article}`.


        Delivered as a single HTTPS POST to the consumer''s registered endpoint,

        with the message as the JSON request body. Respond 2xx to acknowledge.

        Anything else, or a timeout, is retried with backoff, so acknowledge

        fast and do the work afterwards.'
      tags:
      - Webhooks
      security: []
      parameters:
      - $ref: '#/components/parameters/WebhookVersion'
      - $ref: '#/components/parameters/WebhookEventId'
      - $ref: '#/components/parameters/WebhookEventType'
      - $ref: '#/components/parameters/WebhookSignature'
      - $ref: '#/components/parameters/WebhookTimestamp'
      - $ref: '#/components/parameters/WebhookDeliveryAttempt'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleScheduledEvent'
            examples:
              scheduledForTomorrow:
                value:
                  id: 018f2a90-1111-7000-8000-000000000001
                  type: article.scheduled
                  api_version: '2026-08-26'
                  occurred_at: '2026-08-26T10:04:00Z'
                  newsletter_id: 7d3f1c02-58a1-4a4e-9a0b-2f6d1c9e4411
                  actor: null
                  idempotency_key: null
                  data:
                    article_id: 4c9e2f81-0b7a-4d13-8e55-1a2b3c4d5e6f
                    title: The week we stopped chasing opens
                    scheduled_for: '2026-08-27T08:00:00Z'
      responses:
        '200':
          description: 'The consumer accepted the delivery. Any 2xx acknowledges the message

            and it is not sent again.

            '
        4XX:
          description: 'The consumer rejected the delivery. Handled exactly like a 5xx: the

            message is retried with backoff, because a rejection cannot be told

            apart from a consumer that is briefly misconfigured.

