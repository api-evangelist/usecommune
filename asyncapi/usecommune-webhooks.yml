delivery:
  source: https://api-reference.usecommune.dev/group/webhook-webhooks; https://usecommune.dev/llms-full.txt (webhooks
    guide); OpenAPI components.parameters WebhookSignature/WebhookTimestamp
  transport: one HTTPS POST per event to a destination registered in the delivery portal (HTTPS endpoint, or a queue,
    stream or object store)
  registration: in the delivery portal only; POST /newsletters/{newsletter}/portal-session (createPortalSession)
    mints a one-use link; no CRUD endpoint for destinations
  envelope: 'shared envelope: id, type, occurred_at, actor, idempotency_key, data; the same id/type arrive as Commune-Event-Id
    and Commune-Event-Type headers'
  headers:
  - Commune-Event-Type
  - Commune-Event-Id
  - Commune-Signature
  - Commune-Timestamp
  - Commune-Delivery-Attempt
  - Commune-Version
  signature:
    header: Commune-Signature
    algorithm: HMAC-SHA256
    key: the endpoint signing secret exactly as issued, whsec_ prefix included
    payload: Commune-Timestamp converted to Unix seconds, a literal ".", then the raw request body bytes
    encoding: lowercase hex as v0=<digest>, or two digests comma separated while a secret rotation is in flight
    timestamp_header: Commune-Timestamp (RFC 3339, UTC; covered by the signature; enforce a tolerance window of
      a few minutes)
  semantics: at least once and unordered; dedupe on id; occurred_at is the ordering field
  retries: 'a non-2xx response or a timeout is retried with backoff: eleven attempts over about eight and a half
    hours; a wrong signature should answer 401 and is retried like any non-2xx'
  replay: 'POST /delivery-attempts/{attempt}/replay (replayDeliveryAttempt) re-delivers an event as a new attempt
    marked manual: true'
  echo_rule: a write through the API publishes an event carrying the caller as actor and its Idempotency-Key as
    idempotency_key; a consumer that writes must skip events whose idempotency_key it issued
  attempt_log: GET /newsletters/{newsletter}/delivery-attempts filterable by event_id; GET /delivery-attempts/{attempt}
