aid: usecommune
name: Commune
description: 'Commune turns newsletters into communities: each newsletter has an archive of articles and every article carries
  a threaded chat, with engagement insights, subscriber analytics, growth tracking and superfan identification on top. The
  Commune API (63 operations, 23 webhook topics, contract version 2026-08-26) exposes newsletters, articles, threads, messages,
  subscribers, tags, senders, domains, metrics, sends and event delivery over a cursor-paginated REST surface at api.usecommune.com,
  authenticated with bearer API keys or OAuth 2.1 (PKCE, dynamic client registration, RFC 9728 protected-resource metadata),
  versioned by a Commune-Version date header, with a required Idempotency-Key on every write and a hosted MCP server at api.usecommune.com/mcp.'
