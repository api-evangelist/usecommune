    source: openapi/usecommune-openapi.yml
  - term: Team
    definition: 'Who may act on behalf of a newsletter: its owner, plus the members the owner added as admins, editors or guests. Both sides of
      that edge are here. A newsletter''s roster answers "who is on this team" and needs `settings`. `GET /memberships` answers "which teams is
      this account on", which is the same membership read from the person rather than from the newsletter, and needs `account: read` instead: '
    tags:
    - Resource Group
    source: openapi/usecommune-openapi.yml
  - term: Users
    definition: 'A person with a Commune account: the readers who join a community and the writers who are credited on an article. Looked up by
      identifier or by username, and only ever as a public profile: never an email address. The one account read from the inside is the credential''s
      own. `GET /me` is the same person as the profile above plus the address and verification state that one withholds, and it sits her'
    tags:
    - Resource Group
    source: openapi/usecommune-openapi.yml
  - term: Search
    definition: One query across newsletters, articles, people and chat. Where a reader starts who does not yet have an identifier for any of
      them.
    tags:
    - Resource Group
    source: openapi/usecommune-openapi.yml
  - term: Articles
    definition: 'An article is one thing a newsletter published: written in Commune and sent, or imported from the newsletter''s provider. Two
      rules gate every article read and are described on each operation. First, an article stamped with an audience is visible only to the newsletter''s
      team and to subscribers holding one of its tags. Second, an article dated in the future is invisible until that moment passes. An'
    tags:
    - Resource Group
    source: openapi/usecommune-openapi.yml
  - term: Highlights
    definition: A highlight is a passage of an article a reader marked. It anchors a comment to the exact sentence that prompted it.
    tags:
    - Resource Group
    source: openapi/usecommune-openapi.yml
  - term: Threads
    definition: 'A thread is a conversation inside a newsletter''s community. Commune has no separate posts or comments stack: a creator''s broadcast,
      a reader''s question and the discussion under an article are all threads in the same newsletter scoped chat.'
    tags:
    - Resource Group
    source: openapi/usecommune-openapi.yml
  - term: Messages
    definition: A message is a reply inside a thread, up to two levels deep. Reactions hang off a message.
    tags:
    - Resource Group
    source: openapi/usecommune-openapi.yml
  - term: Subscribers
    definition: 'Who receives a newsletter. Needs `audience`, and never a public surface: a newsletter''s list belongs to its creator. `GET /subscriptions`
      is that edge read from the other end, the lists one account is on rather than the people on one list, and it needs `account: read` instead.
      It carries none of what a newsletter''s own record of a subscriber carries: no address, no lifecycle status, none of the ta'
    tags:
    - Resource Group
    source: openapi/usecommune-openapi.yml
  - term: Subscriber tags
    definition: 'A tag segments a newsletter''s audience. Sending an article to a tag stamps that article with an audience, which is what makes
      it invisible to everyone outside it. Named for the subscribers it is applied to, because a tag called `Tags` inside a document made of tags
      says nothing. Applying and removing a tag are writes, and they are grants and revocations of access to whatever articles that segment '
    tags:
    - Resource Group
    source: openapi/usecommune-openapi.yml
  - term: Engagement
    definition: 'What Commune knows about one subscriber that a newsletter''s email provider cannot answer: engagement scored across the inbox
      and the community together, and the raw event stream those scores are summed from. Row shaped and high cardinality, which is what a CRM
      or a re-engagement automation reads. Needs `insights`, and part of the one read surface Commune may put behind a plan.'
    tags:
    - Resource Group
    source: openapi/usecommune-openapi.yml
  - term: Metrics
    definition: 'The rolled up numbers for a newsletter and for one article: headline stats for a period, acquisition attribution, bucketed series
      for charting, and one article''s email performance beside its community response. What a dashboard reads, where Engagement is what an automation
      reads. Creator scope, and part of the one read surface Commune may put behind a plan.'
    tags:
    - Resource Group
    source: openapi/usecommune-openapi.yml
  - term: Sends
    definition: 'A send is one dispatch of one article to a newsletter''s list: when it started, when it finished, and the three numbers it finished
      on. Not to be confused with Senders, one heading below: a sender is the address an article goes out from and is configuration, a send is
      something that happened. Starting one is an operation under Articles, because it is a moment in an article''s life. Reading what beca'
    tags:
    - Resource Group
    source: openapi/usecommune-openapi.yml
  - term: Senders
    definition: The addresses a newsletter sends from, and the state of the DNS that has to be in place for them to work. The sending half of
      the pair; Website domains is the other. Needs `sending`.
    tags:
    - Resource Group
    source: openapi/usecommune-openapi.yml
  - term: Website domains
    definition: 'A creator''s own domain pointed at their Commune site, so their community lives at their address rather than at ours. The same
      prove you own this hostname flow as Senders, pointed at the site rather than at the mail. Needs `settings`: a website domain is how the
      newsletter is configured, not how it sends.'
